name = "The Reaver's Resolve"
description_template = "While the Stormreaver was a guest of The Celestial One, Ternathear, some know that he wallowed for a time in drink. He had lost everything he had once held dear- even his prized blade, Cloudburst. After a group of adventurers defeated his former lieutenant, the storm giant lich Sor'jek Incanni, the Stormreaver resolved to take matters into his own two hands. (This enchantment has no effect.)"
verbose_name_template = "The Reaver's Resolve"
