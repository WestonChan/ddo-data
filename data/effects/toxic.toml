name = "Toxic"
description_template = "This weapon oozes with magical poisons from a dozen esoteric sources. Occasionally, these toxins will erupt on your target, unleashing a vile fog that will dissolve your foes with acid, and will additionally deal constitution damage to enemies whom are not immune to poison. Weak foes may be killed outright by this Toxic Cloud."
verbose_name_template = "Toxic"
