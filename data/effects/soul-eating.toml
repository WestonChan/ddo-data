name = "Soul Eating"
description_template = "On a Vorpal strike, the dark energy that inhabits this weapon will tear at the soul of your foe, inflicting up to three negative levels to your target. The Soul Eating weapon will feed this stolen life back to you in the form of 35 Temporary Hit Points that last for one minute or until depleted by incoming damage."
verbose_name_template = "Soul Eating"
