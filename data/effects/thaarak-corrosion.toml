name = "Thaarak Corrosion"
description_template = "Like a Thaarak Hound's vitriolic breath, this weapon is corrosive and can damage enemies over time. Occasionally, it applies a lasting effect to its targets that deals 2 to 8 acid damage every two seconds for six seconds. If the effect is reapplied before it has a chance to wear off, the duration will reset and stack up to three times."
verbose_name_template = "Thaarak Corrosion"
