name = "Accursed Flame"
description_template = "Coalesce beyond the material, join us in the Flame! Hatred burns eternal! This weapon is wrapped in cursed flames, dealing an additional 6d6 Fire damage on each hit. When striking an enemy that has been Quelled, it also deals 6d6 Evil damage on each hit. This effect makes the weapon evil aligned. Good characters wielding this weapon will suffer one negative level."
verbose_name_template = "Accursed Flame"
