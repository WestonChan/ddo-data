name = "Wild Frenzy"
default_value = 25
description_template = "This weapon has a tendency to drive those it strikes insane. On an attack roll of 20 which is confirmed as a critical hit the target will go wild and attack its own allies for 15 seconds if it fails a DC {1} Will save. Enemies driven wild in this way, however, have a chance of coming to their senses if damaged."
