name = "Graz'zt's Magic: Trap the Soul"
description_template = "Trap the Soul: This weapon stores the innate magic of the Dark Prince. When you hit an enemy with an offensive spell, this power occasionally comes to the surface, sucking out the life force of an enemy with Hit Points less than 3,420 and imprisoning the essence of their body and soul in a gem if they fail a DC 122 Will saving throw."
verbose_name_template = "Graz'zt's Magic"
