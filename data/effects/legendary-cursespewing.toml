name = "Legendary Cursespewing"
description_template = "On Vorpal Hit: Your enemy is cursed with a -4 Morale penalty on attack rolls, saving throws, and skill checks. This painful curse also causes the victim to take 6d6+6 damage every two seconds for a duration of twelve seconds. Additional vorpal strikes while the curse is active will extend the duration by another twelve seconds."
