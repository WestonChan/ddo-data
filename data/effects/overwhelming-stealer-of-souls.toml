name = "Overwhelming Stealer of Souls"
description_template = "This weapon tears at the very essence of your foes. On any strike, this weapon applies a single stack of Soul Scar, which reduces your target's Will Saves, Armor Class, and Fortification by 1 per stack, max 10. Occasionally, this weapon attempts to rip the life from your foe, as if it were the victim of a Phantasmal Killer spell with a DC of 100 versus Will. Bosses (and enemies with more than 10,000 hit points) are immune to this effect. Killing a monster will consume your soul, adding a stack of Consumed Soul to you. Consumed Souls stack up to 20 times, and linger for 20 seconds. Each one provides a +1 Profane bonus to Damage and Melee Power. If you block or unequip this weapon, the Consumed Souls will be released."
verbose_name_template = "Overwhelming Stealer of Souls"
