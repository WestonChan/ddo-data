description_template = "This item grants its wearer immunity to natural diseases. This item also grants a {1} %b1 bonus to saving throws against magical diseases, and the wearer does not fail saving throws against them on a roll of a natural 1 (this renders the wearer immune to magical diseases with a DC of less than 3 + their Fortitude save)."
