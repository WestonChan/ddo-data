name = "Lifeblood of the Undead Prince"
default_value = 58
description_template = "This artifact displays incredible regenerative abilities. You gain a {1} Competence Bonus to Positive Healing Amplification, a {1} Enhancement Bonus to Repair Healing Amplification and a {1} Profane Bonus to Negative Healing Amplification."
stat_set_verdict = "distinct"
stat_set_reason = "Lifeblood fixes Healing to Competence, Repair to Enhancement and Negative Healing to Profane; the set grouping takes one uniform type from its owner."
verbose_name_template = "Lifeblood of the Undead Prince"

