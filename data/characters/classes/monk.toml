description = """
A Monk is a combatant that performs amazing techniques in battle by
using a power source called Ki. They can have extremely high Dodge and
at high levels have a higher base movement speed than any other class.
In order to use their special abilities, monks must be centered and
remain in a state of physical and mental balance. To remain centered,
a Monk must be unencumbered, wielding Monk-specific weapons or unarmed,
and be wearing no armor except robes or outfits. When not centered,
monks lose the majority of their special bonuses. While they are limited
in their weapon selection, monks can gain specialized training through
feats or other class enhancements to enable other weapons to be used
while centered and gain a variety of special feats as they gain levels.
The primary attribute of monks is Wisdom, which they use in retaining Ki,
increase their Armor Class, and increase the effectiveness of their Ki
attacks and Monk-specific tactical abilities. Strength, Constitution,
and Dexterity are also important."""
