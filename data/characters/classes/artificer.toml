description = """
The Artificer combines magic with weapon technology and skill.
Traditionally, Artificers prefer to avoid getting their hands dirty
in a fight, using personally-made constructs that perform a variety
of tasks but are especially capable in combat. Artificers are a
jack-of-all-trades: they can serve as backup healers, decent offensive
spell caster, can act as both ranged or melee combatants, can find and
disable traps and open locks, and have excellent supportive abilities.
Artificers are the only class that can gain the use of Rune Arms, and
their primary attributes are Dexterity and Intelligence.

The Artificer class must either be purchased in the DDO store or unlocked
on a per-server basis by earning 150 House Cannith favor on a single character."""
