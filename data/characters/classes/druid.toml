description = """
Druids are divine spell casters with a variety of offensive and
supportive spells, but they are the epitome of crowd control and can
fulfill that role regardless of their specialization. They can be
excellent melee combatants, able to use Wild Shape to transform into
bears (strong and hardy tanks) and wolves (fast and agile attackers),
or can take up a spellcasting role, turning into fire or water elementals
to unleash primal forces of nature in the form of blizzards, thunderstorms,
and earthquakes. Druids make strong solo characters considering their
melee and self-healing options, especially at low and mid levels. Druids
cannot use metal armor or wield metal shields; doing so removes their
ability to use many of their druidic abilities. Druids use Wisdom as
their primary attribute, determining their maximum spell points and
spellcasting effectiveness."""
