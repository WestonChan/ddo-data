class_specific_feat_types = ["Fighter Bonus Feat"]
description = """
Fighters are warriors with many extra feats (almost double what most
classes can obtain), allowing them to super-specialize their role
in combat. There are many ways to fight: two-handed, dual-wielding,
a sword and shield, or even with a bow... you name it, a fighter can
specialize in it. As such, players should examine thoroughly what
feats they would like to pick before they create this versatile
front-line class. Fighters also gain access to many unique feats that
increase their offensive power, their defenses, or their ability to
use tactical maneuvers like Trip or Stunning Blow. Depending on which
martial path they wish to follow, a fighter might require Strength,
Constitution, and Dexterity in varied amounts."""
