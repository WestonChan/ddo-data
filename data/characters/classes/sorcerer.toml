description = """
A Sorcerer is an arcane spell caster, and serve as the primary offensive
magic class for DDO, but are physically quite weak. Their enhancements
are built almost entirely around dealing significant damage with spells.
Unlike wizards, they have a limited selection of spells, only gaining a
few spell slots per spell level and cannot change them at a tavern or rest
shrine. However, they cast spells much faster than any other, and most
often have the highest amount of spell points of any class. Charisma is
the primary attribute for sorcerers, increasing their available spell
points and making their spells more effective."""
