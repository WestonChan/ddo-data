casting_stats = ["Charisma"]
description = """
Bards possess many skills with some special spell casting ability,
and can fulfill almost any role. The primary draw of Bards is their
ability to use songs to inspire and buff a party, providing small,
but stacking bonuses to almost every aspect from weapon damage, to
spell effectiveness, to dodge and armor class. Their spells consist
of a mix of both divine and arcane, but are considered arcane overall:
they can use spells focused on crowd control, healing, and buffs, as
well as offensive sonic spells that often daze or stun opponents.
Bards are also very good at learning the Use Magic Device skill to
operate any kind of magical item. They have been called the "best
sixth man", because using a bard to fill the final slot in a party
means that their powerful musical buffs boost five other players,
they can deal significant damage when specced for both physical or
magical combat, and their respectable healing abilities assist the
main healer in keeping the party alive. Bards also possess one of the
few abilities in the game that can replenish spell points. The primary
attribute of bards is Charisma."""
