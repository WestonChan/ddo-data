description = """
Favored Souls are divine casters that follows the path of the cleric
but tend to be more focused on offense than support. They have fewer
spells at their disposal than clerics, but have almost double the
amount of spell points, enabling them to cast those fewer spells more
often. They gain energy resistance and inherent Damage Reduction as
they progress and can use light or medium armor. They have simple
weapon proficiency, but gain the use of additional weapons depending
on their chosen god and can become capable melee combatants. Favored
souls can use the highest of their Wisdom or Charisma scores for
determining their maximum spell points and effectiveness of spells.

The Favored Soul class must be purchased in the DDO store or unlocked
on a per server basis by earning 2,500 Total Favor on a single character."""
