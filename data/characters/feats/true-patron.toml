[[row]]
name = "True Patron: Fiend"
acquire = "Train"
description = """
You have made a pact with a fiend from the lower planes of existence,
a being whose aims are evil, even if you strive against those aims. Such beings
desire the corruption or destruction of all things, ultimately including you.

Pact Toggle: Your Eldritch Blast deals +1 Fire damage, plus 1d4 per bonus Pact Dice.
This damage is halved on a successful Fortitude saving throw vs
DC(19 + Charisma Mod + Evocation Bonuses)."""
icon = "TruePatronFiend"
source_name = "Acolyte of the Skin"

