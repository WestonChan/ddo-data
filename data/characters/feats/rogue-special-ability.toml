[[row]]
name = "Crippling Strike"
acquire = "Train"
description = """
A Rogue with this ability can sneak attack opponents with such precision
that his or her blows weaken and hamper them. An opponent damaged by a sneak
attack also takes 2 points of Strength damage."""
icon = "CripplingStrike"
source_name = "Rogue"

