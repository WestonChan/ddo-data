[[row]]
name = "Pact: Celestial"
acquire = "Train"
description = """
Your patron is a divine Celestial, patron of those who wish to devote
themselves to an unconventional method of worship. You will learn to channel
the light and air around you into a righteous weapon, and utilize holy abilities
to help your friends and pass judgment upon your enemies.

Toggle on: Your Eldritch Blast deals +1 Electric damage, plus 1d6 per bonus Pact Dice.
This damage is halved on a successful Reflex saving throw vs
DC(19 + Charisma Mod + Evocation Bonuses)
Adds Spells to your spell book at level
1 - Bless
5 - Soundburst
9 - Magic Circle Against Evil
14 - Prayer
17 - Holy Aura
19 - Freedom of Movement"""
icon = "PactCelestial"
source_name = "Warlock"

[[row.dc]]
name = "Pact: Celestial"
amount = [19]
dc_type = "Half Damage"
dc_versus = "Reflex"
description = """
Toggle on: Your Eldritch Blast deals +1 Electric damage, plus 1d6 per bonus Pact Dice
This damage is halved on a successful Reflex saving throw."""
