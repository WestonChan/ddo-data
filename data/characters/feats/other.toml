[[row]]
name = "Alchemical Spellcasting"
acquire = "Automatic"
description = """
Alchemists have a unique way of combining their spells as they cast them.
As an alchemist, your spells are each associated with a different Primer:
Crimsonite, Gildleaf, or Ceruleite. Casting a spell from a single Primer and then
casting a spell from a different Primer will activate a Reaction depending on the
Primer of the spells cast. Reactions come in three variants: Pyrite, Verudite, or
Orchidium. You can only have be in one Reaction at a time, and casting an Alchemist
spell from a Primer not associated with that Reaction will cancel the Reaction.

Casting a Crimsonite spell and then a Gildleaf, or a Gildleaf spell and then a
Crimsonite spell will active a Pyrite Reaction.

Casting a Gildleaf spell and then a Ceruleite spell, or a Ceruleite spell and then a
Gildleaf spells will activate a Verdanite Reaction.

Casting a Crimsonite spell and then a Ceruleite spell, or a Ceruleite spell and then a
Crimsonite spells will activate a Orchisium Reaction.

Each Reaction does something unique for 12 seconds upon switching into that Reaction.

Pyrite Reaction: Fire, Cold, Electric, Acid, and Poison Spell Power equal to
(10 + 6x your Alchemist level) and a -50% Enhancement Bonus to Spell Point Cost.

Verdanite Reaction: Positive and Negative Spell Power equal to (10 + 6x you
Alchemist level) and Transmutation and Conjuration DCs equal to (1 + 1 for every
10 Alchemist Levels).

Orchidium Reaction: Physical Resistance rating and Elemental Resistance equal to
(10 + 3x your Alchemist Level).

Each Reaction does something unique that lasts for as long as you maintain that Reaction:

Pyrite Reaction: +1 Fire, Cold, Electric, Acid, and Poison Spell Power per 2 Alchemist Levels.
Verdanite Reaction: +1 Positive and Negative Spell Power per 2 Alchemist Levels.
Orchidium Reaction: +1 Physical Resistance Rating per Alchemist Level."""
icon = "AlchemicalSpellcasting"
source_name = "Alchemist"

