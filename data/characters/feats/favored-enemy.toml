[[row]]
name = "Favored Enemy (Passive)"
acquire = "Automatic"
description = """
Each Favored Enemy feat grants a damage bonus when fighting certain foes.
When fighting a Favored Enemy, you gain +2 Damage for each Favored Enemy feat
you have. If you have more than one Favored Enemy feat that applies to a
particular Enemy, the damage applies for each type that matches a Favored
Enemy feat you have."""
icon = "FavoredEnemy"
source_name = "Ranger"

[[row.group]]
group_name = "Favored Enemy"

