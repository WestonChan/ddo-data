description = """
Hybrid Form: You give part of yourself to the hive, gaining insect like reflexes
and senses. Your bodily fluids become poisonous to others, and the swarm is
your ally.

Gain +1 to caster level and max caster level of all Acid and poison spells.

Gain 25% Concealment and Evasion.

Your Reflex saves are increased by 1 every 3 Druid levels and you become 10% more
