[[row]]
name = "Webtouched Wretch"
acquire = "Train"
variant = "dark-gift"
description = """
You've become entwined with a great cosmic web, which occasionally becomes coterminous
with reality. Your offensive spells, melee and ranged attacks occasionally cause
strange spectral webs to coat your enemies either slowing them or entangling
them for up to 6 seconds with no save.

When you get hit with Melee or Ranged attacks, there is a small chance the webs
turn on you, applying a weakened slow effect which lasts 6 seconds but can
stack 3 times. Spells/Immunities like Freedom of Movement do not prevent this."""
icon = "WebtouchedWretch"
source_name = "Dhampir Dark Bargainer"

