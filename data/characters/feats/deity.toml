[[row]]
name = "The Blood is The Life"
acquire = "Train"
description = """
You are a devoted follower of The Blood of Vol and your zeal has been rewarded.
Activate this ability to draw upon the power within your own blood for 24
seconds plus 6 seconds per Religious Lore feat you have. In this state, you
gain +4 Constitution, 100% Fortification, +10 to Fortitude Saves, PRR and MRR
equal to the number of Religious Lore feats you have. While in this state and
have a Dagger in your main hand, you also gain Vampirism, stacking with other
sources of Vampirism."""
icon = "TheBloodIsTheLife"

