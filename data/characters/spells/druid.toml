the swords are automatically equipped when created. At caster level 1, it has
a +1 Enhancement bonus and the flaming effect. Every five caster levels the
summoned swords improve. Because they are an extension of the caster's will,
monks may use these weapons without becoming uncentered. The flame blade i
not a physical weapon, but rather pure flame shaped by the caster's will;
because of this, it is snuffed out if unequipped."""
