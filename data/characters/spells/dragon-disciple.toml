[[row]]
name = "Cyclonic Blast"
description = """
You send a twisting torrent of wind toward your enemies that deals 1d3+3 bludgeon
damage per caster level (Maximum damage 80 to 120 at caster level 20) to targets
in its path. A successful Reflex save reduces the damage by half. If the target
fails its Reflex save, it must make a Strength check or Dexterity check to negate
or be knocked Prone. The spell also clears away all lingering effects in its path,
such as clouds and Wall of Fire of both friends and foes."""
icon = "CyclonicBlast"
max_caster_level = 20
