[[row]]
name = "Charm Animal"
description = """
Charms a hostile Animal, Magical Beast or Vermin which will fight as a trusted friend
and ally. Charmed animals get an additional save every 15 to 30 seconds.
A successful Will save negates this effect. Mindless targets cannot save, but
the duration is halved."""
icon = "CharmAnimal"
metamagics = [
    "Embolden",
    "Enlarge",
    "Heighten",
    "Quicken",
]
schools = ["Enchantment"]

[[row.dc]]
casting_stat_mod = true
dc_type = "Negates"
dc_versus = "Will"
schools = ["Enchantment"]

[[row]]
name = "Magic Fang"
description = """
Increases the Enhancement Bonus of the target's natural weapon by 1, plus 1 per five
caster levels. An item can have only one temporary item Enhancement at a time.
Only works on players, hirelings, or pets, and only if they are Animals,
Vermin, Magical Beasts, Dragons or Fey."""
icon = "MagicFang"
metamagics = ["Quicken"]
schools = ["Transmutation"]

[[row]]
name = "Summon Nature's Ally I"
description = """
Summons a Gray Wolf or a Brown Rat to fight for you for 10 minutes. You can only
have 1 summoned creature of any type serving you at a time. Summoning a new
creature of any type will return the previous one to its home plane."""
icon = "SummonNaturesAllyI"
metamagics = ["Quicken"]
schools = ["Conjuration"]

[[row]]
name = "Summon Nature's Ally II"
description = """
