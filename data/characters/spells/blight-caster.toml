versions, and the swords are automatically equipped when created. At caster level
1, it has a +1 Enhancement bonus and the Acid/poison effect. Every five caster levels
the summoned swords improve. Because they are an extension of the caster's will,
monks may use these weapons without becoming uncentered. The Thorn blade is not
a physical weapon, but rather pure liquid shaped by the caster;s will; because of
this, it dissolves when unequipped."""
