[[enhancement]]
name = "Kensei: Strike With No Thought"
cost_per_rank = [1]
description = """
Passive: Your weapons (but not shields) gain a +1 Competence bonus to Critical
Damage Multiplier. When you have a weapon equipped in your main hand that is
part of your Focus, you gain 1% Doublestrike or 1% Doubleshot (depending on
whether your Focus is melee or ranged). Each additional Core Ability you acquire
from this tree increases this bonus by 1%.

Doublestrike: Your main hand melee attacks gain a percent chance to strike twice.

Doubleshot: Your ranged attacks, including thrown attacks, gain a percent chance
to attack with an extra projectile. Repeating Crossbows have a reduced chance
to produce extra shots."""
icon = "StrikeWithNoThought"
