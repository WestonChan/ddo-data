[[enhancement]]
name = "Grandmaster of Flowers: Everything is Nothing"
cost_per_rank = [2]
description = """
Cost: 50 Ki
Cooldown: 3 minutes

Your state of luminous consciousness allows your will to alter the fabric of the
planes, ripping your foes out of time and space. Up to six nearby non-boss enemies
must make a saving throw (DC: 20 + Highest Ability Score Mod + Stunning Bonuses)
or be erased from the multi-verse. If they succeed at their saving throw, they are
instead paralyzed by temporal shock for six seconds.

When you activate Everything is Nothing, you are affected by Emptiness for 5 minutes.

Emptiness: +3% Dodge, +1% Dodge cap. You gain the effects of the Elusive Target feat,
or if you already have it, it instead has double the chance to proc."""
