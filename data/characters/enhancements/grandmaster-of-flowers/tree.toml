name = "Grandmaster of Flowers: Split the Soul"
cost_per_rank = [2]
description = """
Cost: 100 Ki
Cooldown: 5 minutes

Epic Moment: For 30 seconds, your soul is split, and a fragment of it manifests
beside you as a combatant. Your Soul Warrior provides the following benefits:

Offensive (Dark): Your attacks may strike an additional target regardless of
weapon type, and each attack has a 5% chance of banishing your enemies from the
multi-verse with no save.

Defensive (Light): Your Soul Warrior also grants you 25% Concealment,
25% Incorporeality, and 25% Dodge/max Dodge, as your physical form is less
present while you are in this state.

If you follow a Monk Philosophy, your split soul will embody that choice
(either Light or Dark), doubling either the Offensive (Dark) portions or
Defensive (Light) portions."""
