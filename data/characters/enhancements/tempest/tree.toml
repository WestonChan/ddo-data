[[enhancement]]
name = "Tempest: Shield of Whirling Steel"
arrows = ["ArrowRight"]
cost_per_rank = [1]
description = """
While you are dual wielding weapons, you gain a +2 Shield bonus to Armor Class,
Physical Resistance Rating, and Magical Resistance Rating. This increases by +1
for each additional Tempest Core Ability you acquire.

In addition, if you are a level 1 character, you gain the Two Weapon Fighting
Feat until you reach Ranger level 2. (Two Weapon Fighting is granted permanently
when you take a second Ranger level).

Two Weapon Fighting: Reduces the penalty for fighting with two weapons, and
increases the chance to produce off hand attacks when fighting with two weapons
(or as an unarmed Monk) by 20% to 40%."""
