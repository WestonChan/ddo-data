description = "Toggle: 30sp, toggles off on rest.\nMust have your Bond Feat active to use. Mutually exclusive with Form feats (PM, Druid, etc).\nStage 1: When this stance is enabled, you gain +1 to Hit and Damage, 1% Doubleshot, and 1% Doublestrike.\nStage 2: After 20 seconds of this stance being active, these bonuses double.\nStage 3: After 40 seconds of this stance being active, you also gain a 10% Action Boost Bonus to Attack \n         Speed, 10% Action Boost bonus to Melee Power, and 5% Action Boost bonus to Ranged Power, but\n         you take your  Character Level in Light damage every second until the stance is toggled off.\nStage 4: After 60 seconds of this stance being active, all of your bonuses from this stance double once \n         more, but you take one stack of Vulnerability every second.\nStage 5: After 70 seconds of this stance being active, your movement speed will drop dramatically.\nStage 6: After 75 seconds of this stance being active, you can no longer contain the radiance within,\n         and it will consume you."
icon = "DivineFormScourge"
internal_name = "SADivineForm"
is_clickie = true
min_spent = 15
