description = "Activate this ability to transform into an Air Elemental.\nWhile in elemental form, you gain +100% fortification.\nIf you are a Warforged, you are no longer considered a Living Construct, and so are\nimmune to Repair spells, but can be healed normally by Positive Energy spells.\n\nWhile in Air Elemental form, you also gain an additional +20 Electric and Sonic Spell Power,\n+2% Electric and Sonic Spell Critical Chance, and a +1 bonus to caster level and max\ncaster level for Air, electrical, and sonic spells, but your water, earth, and fire\nspells have a -3 penalty to caster level and max caster level.\nYou also gain a +10 racial bonus to electrical resistance, +20 Physical Resistance Rating,\n+3% dodge chance, and a -10 penalty to acid resistance.\nWhile in Elemental Form, your spells also cost an additional 10% Spell Points to cast.\n\nYou also gain the following passive benefits, even while not in elemental form:  +2 Charisma \n+10 Electric and Sonic Spell Power \n+1 Caster Level when casting Electric, Sonic, and Air spells. \n+1 Maximum Caster Level when casting Electric, Sonic, and Air spells."
icon = "ASElementalApotheosisAir"
internal_name = "ASCore6"
