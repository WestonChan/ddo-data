[[enhancement.selection]]
name = "Carrion Swarm"
cost_per_rank = [2]
description = """
Epic Strike: Target enemies and all enemies within a small radius around
them become covered with biting acidic and poisonous insects. Every 2 seconds
they take 1d6+1 Acid and 1d6+1 Poison damage per every 2 Character Levels for 8
seconds (Max Caster Level 20). Stacks up to 3 times. Each stack also causes a
-4 penalty to attack rolls and Armor class. Every few seconds, affected enemies
have a chance to break free of the swarm if they pass a Fortitude saving throw
(DC: 20 + highest of Int/Wis/Cha modifier mod + Conjuration bonuses).
Cost: 2 Spell Points
Cooldown: 6 seconds.

Is considered a Druid spell for interactions with other abilities.

Requires you to be attuned to the path of Thorn.

Every Epic strike shares a cooldown with every other Epic Strike. Using this
ability will put every Epic Strike onto this ability's cooldown."""
