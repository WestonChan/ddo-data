Choose between a Melee and Ranged attack.
You and your Hunting Bird attack as one against a single target.
Activate this ability to attack for +30% damage against a single target.
Your Hunting Bird will follow up for an additional 10d6 damage that scales with
200% of melee or ranged power, whichever is higher. Your Hunting Bird also
trips the target, causing them to become Helpless. Your target is slowed by 30%
for 10 seconds whether they make the saving throw or not.

