[[enhancement]]
name = "Fiendish Symbiosis"
cost_per_rank = [2]
description = """
You call upon your fiendish patron, transforming into a Demon for a
short time. You gain +100% Fortification, heal from Fire damage, and gain Natural
Armor equal to your Pact Dice. While in this form, you no longer Eldritch Blast
at range, instead you lash out with demonic claws as a melee attack. Each strike
deals your full Eldritch Blast damage on hit. Entering this form is so frightening
that activating this ability causes nearby enemies to become afraid. You may only
maintain your Demonic form for 30 seconds, but its duration increases by 5
seconds for each Core Ability you have in this tree.
Cooldown: 3 minutes"""
