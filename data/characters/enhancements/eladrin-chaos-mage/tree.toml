[[enhancement]]
name = "Eladrin Chaos Mage: Arcane Fey Step"
arrows = ["ArrowRight"]
cost_per_rank = [2]
description = """
Disappear and reappear several feet in front of you. You start with 2 charges
per Rest. Based on your season, this has an additional effect:

Spring: You gain a +3 to Universal Spell Power per Character Level, for 10 seconds.

Summer: You gain a +20% bonus to Spell Cost Reduction for 10 seconds.

Autumn: You gain +5 bonus to Magical Resistance Rating and Magical Resistance
Rating Cap, +1 per Character Level for 10 seconds.

Winter: You gain a +2 bonus to Spell Penetration, with an additional +1 per 5
Character Levels, for 10 seconds."""
icon = "EladrinFeyStep"
internal_name = "EladrinWMArcaneFeyStep"
is_clickie = true
min_spent = 1
ranks = 1
x = 3
y = 1

