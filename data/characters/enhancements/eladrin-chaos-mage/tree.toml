cost_per_rank = [2]
description = """
A spell-Like Ability that creates dark storm cloud over the target which blasts
it and nearby enemies with lightning for 1d6+2 electric damage for every caster
level. If targets are immune to electric damage they become vulnerable to it for
15 seconds. Max caster level 20. Evocation DC using the highest of Intelligence,
Charisma or Wisdom.
Cost: 5 Spell Points
Cooldown: 10 seconds

Can only be used if you have Spring Affinity Active."""
