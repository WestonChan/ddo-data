name = "Fire Savant: Elemental Apotheosis: Fire"
cost_per_rank = [1]
description = "Activate this ability to transform into a Fire Elemental.\nWhile in elemental form, you gain +100% fortification. If you are a Warforged,\nyou are no longer considered a Living Construct, and so are immune to Repair spells,\nbut can be healed normally by Positive Energy spells. \n\nWhile in Fire Elemental form, you also gain an additional +20 Fire Spell Power,\n+2% Fire Spell Critical Chance, and a +1 bonus to caster level and max caster level\nfor Fire spells, but your air, earth, and water spells have a -3 penalty to caster\nlevel and max caster level. You also gain a +10 racial bonus to Fire resistance,\n+20 Physical Resistance Rating, and a -10 penalty to cold resistance.\nWhile in Elemental Form, your spells also cost an additional 10% Spell Points to cast.\n\nYou also gain the following passive benefits, even while not in elemental form:\n+2 Charisma \n+10 Fire Spell Power \n+1 Caster Level when casting Fire spells \n+1 Maximum Caster Level when casting Fire spells."
icon = "FSElementalApotheosisFire"
