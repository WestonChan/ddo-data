[[enhancement]]
name = "Dhampir: Embrace Death"
cost_per_rank = [1]
description = """
Embrace Death: Toggle: While Embrace Death is active, you gain 100% critical hit
resistance and are able to be healed by Negative Energy. You take 50% healing
from Positive, and double damage from Light. (This replaces your natural
vulnerability to Light). You are considered Undead rather than your original
type for the purposes of most effects. You gain +2 Intelligence, +2 Charisma,
+2 Wisdom, and +3 Perform. Your melee attacks have a 10% chance to heal you
for 1d3 with Negative Energy per Character level (max 20).
This is a Major Form, and counts as a Shroud for the purpose of Pale Master.
Cooldown: 30 seconds"""
icon = "DhampirEmbraceDeath"
internal_name = "DhampirEmbraceDeath"
is_clickie = true
