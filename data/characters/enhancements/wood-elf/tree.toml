[[enhancement]]
name = "Wood Elf: Child of Nature"
cost_per_rank = [1]
description = """
You are able to produce an Entangle effect using a drop of your blood.
Cost: 1 HP and 10 spell points.
Primal magic awakens plants and vines to grasp at the caster's enemies.
Entangled creatures suffer a 90% penalty to movement speed, a 50% attack
speed penalty and a -1 penalty to attack rolls, AC and Reflex.
A successful Reflex save (DC: 10 + Half Character Level + Wisdom Modifier)
negates the effect. Entangled creatures may leave the affected area to
escape it's effects, or attempt to  make a Strength check every 2 seconds
to negate. Area of effect fire spells will destroy these vines and free
any entangled creatures. Incorporeal creatures and oozes are naturally immune.
Fire elementals and other fire creatures are immune because they burn
through the plants."""
