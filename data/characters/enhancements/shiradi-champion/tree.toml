gaining Archer's Focus stacks, and you do not take the normal 20% damage penalty
while using Improved Precise Shot. You also gain 30% Action Boost bonus to
Movement Speed for the duration. In addition, your Ranged attacks have a 30%
chance to deal 10d100+180 Cold damage and 10d100+180 Light damage which scale with
200% Ranged Power. Finally, your Ranged attacks in this state have a 100% chance
to proc Double Rainbow effects.
Cooldown: 5 minutes."""
