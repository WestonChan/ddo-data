1 stack of Fey Chaos, and apply a stack of Fey Chaos on hitting non-Player,
non-Hireling targets while Confused.
5 minute cooldown.

Fey Chaos: This creature takes 5% more damage from all sources for 10 seconds.
This effect can stack up to 10 times, and all stacks expire after not gaining
new ones for 10 seconds."""
