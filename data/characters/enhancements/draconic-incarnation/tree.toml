description = """
Epic Moment: Activate this ability to take on the aspect of your Draconic Bloodline.
For 30 seconds, you gain the following:

You become immune to elemental damage of your Draconic Bloodline. If you are an
Undead and aligned with Shadow Dragons, this does not apply to you.
You gain DR 100/- and your Hit Points begin to regenerate at a fast rate.
Your spells gain a 50% cost reduction.
Your spells have a chance to turn a non-boss enemy to gold permanently, adding
them to your hoard, with no save.
Cooldown: 5 minutes."""
