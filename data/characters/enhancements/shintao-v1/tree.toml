[[enhancement]]
name = "Shintao: Jade Strike"
arrows = ["ArrowUp"]
cost_per_rank = [2]
description = """
Ki Melee Attack: You perform a melee attack that is anathema to tainted creatures,
that increases their physical damage vulnerability by 10% and reduces their
fortification by 25%. A successful Will save negates this effect
(DC = 10 + Wisdom modifier + your monk level).
This ability only functions on aberrations, extra-planar creatures that are not
classified as 'Lawful Outsiders', and undead. Creatures that are both extra-planar
and either aberrations or undead receive double this effect. On critical hits,
a tainted target will be locked in a tomb of jade on a failed Will save
(DC = 10 + Wisdom modifier + monk level + stun bonuses). Extra-planar Aberrations or
Undead must succeed at two consecutive Will saves to avoid their fate.
(Activation Cost: 10 Ki. Cooldown: 15 seconds)"""
