[[enhancement]]
name = "Water Savant: Elemental Apotheosis: Water"
cost_per_rank = [1]
description = "Activate this ability to transform into a Water Elemental.\nWhile in elemental form, you gain +100% fortification. If you are a Warforged,\nyou are no longer considered a Living Construct, and so are immune to Repair\nspells, but can be healed normally by Positive Energy spells. \n\nWhile in Water Elemental form, you also gain an additional +20 Cold Spell Power,\n+2% Cold Spell Critical Chance, and a +1 bonus to caster level and max caster\nlevel for Cold and Water spells, but your air, earth and fire spells have a -3\npenalty to caster level and max caster level. You also gain a +10 racial bonus\nto Cold resistance, +20 Physical Resistance Rating, +20 Swim, and a -10 penalty\nto Fire resistance.\nWhile in Elemental Form, your spells also cost an additional 10% Spell Points to cast.\n\nYou also gain the following passive benefits, even while not in elemental form: \n+2 Charisma \n+10 Cold Spell Power \n+1 Caster Level when casting Cold or Water spells. \n+1 Maximum Caster Level when casting Cold or Water spells."
icon = "WSElementalApotheosisWater"
internal_name = "WSCore6"
is_clickie = true
min_spent = 40
ranks = 1
x = 5
y = 0

