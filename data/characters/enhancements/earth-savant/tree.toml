description = "Activate this ability to transform into an Earth Elemental.\nWhile in elemental form, you gain +100% fortification. If you are a Warforged,\nyou are no longer considered a Living Construct, and so are immune to Repair spells,\nbut can be healed normally by Positive Energy spells.\n\nWhile in Earth Elemental form, you also gain an additional +20 Acid Spell Power,\n+2% Acid Spell Critical Chance, and a +1 bonus to caster level and max caster level\nfor Acid and Earth spells, but your air, fire, and water spells have a -3 penalty to\ncaster level and max caster level. You also gain a +10 racial bonus to acid resistance,\n+25 Physical Resistance Rating, and a -10 penalty to electrical resistance.\nWhile in Elemental Form, your spells also cost an additional 10% Spell Points to cast.\n\nYou also gain the following passive benefits, even while not in elemental form:  +2 Charisma \n+10 Acid Spell Power \n+1 Caster Level when casting Acid and Earth spells \n+1 Maximum Caster Level when casting Acid and Earth spells."
icon = "ESElementalApotheosisEarth"
