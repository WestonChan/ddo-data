Activate for 10 Depravity: +25 Universal Spell Power, +2 bonus to all Spell DCs.
Lasts 20 seconds. Cooldown: 60 seconds..

You gain 1 Depravity each time you damage enemies with Eldritch Blast or spells
(except with Positive Energy). You can gain 1 Depravity every 6.5 seconds.
Each additional trained tainted Scholar Core enhancement reduces this cooldown
by 1 second, to a minimum of 1.5 seconds. You can have up to 10 Depravity,
which disappears on rest, death or entering public spaces.

