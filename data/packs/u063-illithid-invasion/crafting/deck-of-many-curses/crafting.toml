[[citation]]
url = "https://ddowiki.com/page/Item:Deck_of_Many_Curses"
read = "2026-11-04"
note = """
Whole page read. The 93 curses on the page match the data's 93 curse recipes by name, and every rarity matches; every curse costs one Deck, the Deck costs 12 each of the four cards, and Remove a curse costs one Card of Curse Cleansing, as in the data. Typed text only: the item screenshot (Deck_of_Many_Curses.png) was not opened. Card drop text matches the data (primary quest per card, saga rows, Festivult). Card of Curse Cleansing: the page says extremely rare and gives no source. No level, pack or favor gate is stated for turning in cards or using the Deck (Minimum Level: 1 is the item's).

The page names no crafting device."""

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Item:Deck_of_Many_Curses"
read = "2026-11-04"
note = """
One Deck per curse; all 93 curse recipes cost one Deck in the data and the page states a Deck places one curse.

A random pool: you cannot choose which curse the Deck places; the step is random and the 93 curses are its outcomes, some more likely than others (the page notes uneven rates). The page gives no name for the step."""

[[citation]]
field = "recipe"
url = "https://ddowiki.com/page/Item:Deck_of_Many_Curses"
read = "2026-11-04"
note = "Page: turn-in of 12 each; the Deck is Bound to Account on Acquire, stack size 1. The survey has no items row named Deck of Many Curses."

[[recipe]]
note = """
Turning in the cards creates the Deck, which places one permanent, random, positive curse (a Fortune bonus) on an item; you cannot choose the curse. Eligible: named, random and crafted items; ineligible: augments, cosmetics, wands, scrolls, quivers and ammunition, so a character can wear at most 14 curses (13 with a two-handed weapon). Curses do not change binding or minimum level; Fortune bonuses to the same statistic do not stack. Upgrades that recreate the item (Epic Crafting, the Altar of Epic Rituals) remove the curse. Each curse is a possible outcome and costs one Deck.

At the Deck of Many Curses."""
option = "Deck of Many Curses"
tier = "any"

