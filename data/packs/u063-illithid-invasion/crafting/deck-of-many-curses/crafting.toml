[[recipe]]
note = "All recipe facts are on this page. Turning in the cards creates the Deck, which places one permanent, random, positive curse (a Fortune bonus) on an item; you cannot choose the curse. Eligible: named, random and crafted items; ineligible: augments, cosmetics, wands, scrolls, quivers and ammunition, so a character can wear at most 14 curses (13 with a two-handed weapon). Curses do not change binding or minimum level; Fortune bonuses to the same statistic do not stack. Upgrades that recreate the item (Epic Crafting, the Altar of Epic Rituals) remove the curse. The curse rows below are the possible outcomes, each costing one Deck."
option = "Deck of Many Curses"
tier = "any"

