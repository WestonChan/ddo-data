[[citation]]
url = "https://ddowiki.com/page/Weaponry_of_the_Golden_Age"
read = "2026-11-04"
note = """
Weapons released with Update 69, rare drops in Magic of Myth Drannor quests; any two Golden Age weapons may be turned in for a weapon of your choice (Valanice Daventhorn for heroic weapons, Rosella Daventhorn for legendary weapons). The similarly named Shields of the Golden Age may not be traded or obtained this way. The pack is Magic of Myth Drannor as the page names the drops; it states no pack requirement for the trade.

Whole page read: lead, the enchantment lists (heroic ML13, legendary ML33, caster longswords), the 40 standard weapons and 10 sceptre line weapons each with a Legendary Variant. No images on the page. Typed only. Shields of the Golden Age (8 data items) are excluded by the page. Not stated: any level, favor or pack gate on the trade; which quests drop the weapons."""

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Weaponry_of_the_Golden_Age"
read = "2026-11-04"
note = """
Any two of these weapons (the page lists them as the heroic Standard Weapons and the Sceptre Line); a pool cost, not a fixed item.

Any two of these weapons (the page lists them as the legendary Standard Weapons and the Sceptre Line); a pool cost, not a fixed item.

Two Golden Age weapons of any kind (page: any two Golden Age weapons) for one weapon of your choice; the page does not say whether the two must be of the same version as the one chosen."""

