[[citation]]
url = "https://ddowiki.com/page/Ritual_Table"
read = "2026-11-04"
note = "Whole page read: intro (Update 69, Magic of Myth Drannor, device in a side room of the raid Threats Old and New, reachable only after completing the raid), the four crafting materials (Barrier Fragment, Sigils of the Crownblade, Warblade and Artblade; all from the raid's end chest, the Sigils rare), and the tables: Weaponry of the Undying Age, Reflections of the Blades (3 rows), Armor of the Blade's Reflection (18 rows), Sealed in Fire weapon upgrades (6 effects, one cost), Sealed in Undeath clothing/jewelry upgrades (1 row). Not stated: level, favor, pack, feat; the names of the individual Weapons of the Undying Age (one generic row)."

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Ritual_Table"
read = "2026-11-04"
note = """
Pure step: Weaponry of the Undying Age (one generic recipe covering 50 weapons), Reflections of the Blades (3 echoes) and Armor of the Blade's Reflection (18 armors). No socket label.

Six effect rows (Legendary Dust, Ash, Vacuum, Ooze, Salt, Affirmation) for Sealed in Fire weapons; the table's first two rows carry a shared cost cell spanning all six.

One row: choose one of Strength, Constitution, Dexterity, Intelligence, Wisdom or Charisma at +15, Insightful +7 or Quality +3.

120 Barrier Fragments on the Undying Age row and on every one of the 21 Reflection rows (3 + 18). Differing parts stay on the recipe: the consumed item (the corresponding Legendary Weapon of the Golden Age, or the Legendary Echo/armor) and, on the 21 Reflection rows only, one Sigil of that blade (the page shows no count, taken as 1).

20 Barrier Fragments for all six effects (one cost cell spanning the table) plus any Sealed in Fire weapon from Weaponry of the Undying Age or the Threats Old and New raid, which is the item being rewritten, not a fixed item.

20 Barrier Fragments plus a Sealed in Undeath item (the item being rewritten).

The page's section 'Sealed in Fire weapon upgrades' rewrites the effect of Sealed in Fire weapons (Weaponry of the Undying Age or Threats Old and New raid weapons) with six effects (Legendary Dust, Ash, Vacuum, Ooze, Salt, Affirmation), each removing any previous Ritual Table effect. Step name is the wiki's wording; the in-game wording was not seen.

The page's section 'Sealed in Undeath clothing / jewelry upgrades' has one row, 'Ability bonus (Raid Threats Old and New Equipment)', that removes any previous Ritual Table effect and adds one ability bonus of choice. Step name is the wiki's wording; the in-game wording was not seen."""

