Enhancement bonus to your Hide and Move Silently skills.
Insightful Deception +4: +4 Insight bonus to hit and +6 to damage for any hit
that would qualify as a sneak attack.
Seeker +10: Provides a +10 Enhancement bonus to confirm critical hits, and a
+10 Enhancement bonus to critical hit damage (before multipliers are applied).
Adds a Colorless augment slot."""
