[[unlock]]
kind = "pack"
pack = "Eveningstar Challenge Pack"
text = "The page states 'Requires access to adventure pack: Eveningstar Challenge Pack' (695 Points; free to VIP; included with Menace of the Underdark). The challenges are partially free to play: one free universal challenge token per day from the challenge token vendor in the House Cannith Enclave or Eveningstar."

[[step]]
name = "Cormyrian item exchange"
is_random = true

[[step]]
name = "Cloak exchange"

[[citation]]
url = "https://ddowiki.com/page/Eveningstar_Challenge_Pack"
read = "2026-11-04"
note = """
The page calls it exchanging challenge ingredients for rewards. The Cormyrian weapons, armor, robes, shields, staves and throwers are semi-randomly generated (the effects are random; the turn-in only picks the item type and level); the nine cloaks are fixed named items. The Item Deconstruction section: dragging an item into the Barter Box and selecting Cormyrian Armament Exchange destroys it and returns 37% to 46% of the purchase materials (observed).

Whole page read: the challenge table (6 challenges, one ingredient each, from the icon names IngIcon_ESChallenge_*), the item-type price table (18 cells, the ingredient identities read from icon files and tooltips) and the cloak table (9 cloaks, base and cumulative costs), the Cormyrian item description sections and Item Deconstruction. No screenshots on the page: typed only."""

