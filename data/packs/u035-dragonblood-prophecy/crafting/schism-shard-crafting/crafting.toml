[[citation]]
url = "https://ddowiki.com/page/Schism_Shard_Crafting"
read = "2026-11-04"
note = "Page states: pack Dragonblood Prophecy; NPC Varron Tertius in The Gatekeepers' Grove; Killing Time must be completed to speak to him and view recipes; 9 recipes, each 5 Schism Shards plus a base weapon, plus a Sentient Jewel (0 Sentience XP) for the three White Plume Mountain weapons. The page body states no level requirement; the page's level navbox lists it under Level 28+ (navbox only, not recorded as an unlock)."

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Schism_Shard_Crafting"
read = "2026-11-04"
note = """
Pure step: no socket label. Each recipe consumes a base weapon and 5 Schism Shards (the three White Plume Mountain bases also a Sentient Jewel). Added 2026-11-13 by the orchestrator from the reader's own rows, with no new read, under the reader brief's rule that a system with no socketed step gets one pure step named for what it does (amendment Revision 13e).

Confirmed on the recipe table: every recipe costs 5 Schism Shards, but each also takes its own base weapon, and the three White Plume Mountain bases also one Sentient Jewel, so there is no whole-recipe uniform cost. The common part is Schism Shard x5."""

