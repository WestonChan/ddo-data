note = "Item page and examine screenshot (420px-Ring_of_Power.png) read. Named item, 'Upgradeable? Slave Lords Crafting'. The screenshot shows 'Against the Slave Lords Set Bonus: An Against the Slave Lords Set Bonus can be applied to this item.' as an enchantment line, then 'Augments: Green Augment Slot: Empty'. Typed list agrees."

[[citation]]
url = "https://ddowiki.com/page/Item:Chains"
read = "2026-11-04"
note = "Item page and examine screenshot (420px-Chains.png) read. Crafted base item (Ingredient Type: Slave Lord's Crafting): the screenshot shows Slaver's Prefix Slot, Slaver's Suffix Slot, Slaver's Extra Slot, Slaver's Bonus Slot, 'Against the Slave Lords Set Bonus' (same sentence as the Ring of Power) and Slaver's Augment Slot, each 'Apply a Slaver's shard to this item'. Typed list agrees."

