[[citation]]
url = "https://ddowiki.com/page/Slave_Lords_Crafting"
read = "2026-11-04"
note = "Whole page read: overview, crafting NPC, base items, ingredients, named items table, the effects table (39 rows) with heroic and legendary values and costs, and the three set bonuses. Every cost matches the data: Prefix 50/100 Broken Shackle, Suffix 50/100 Chain Links, Extra 50/100 Broken Collar, Bonus 20/50 Frayed Leather plus 20/50 of each common, Set bonus 20/50 Shattered Symbol plus 20/50 of each common, Augment slot 20/50 Staff Splinter plus 20/50 of each common (Green 30/100 Staff Splinter), Mythic Boost +1 one Statuette of the Gods and +3 one Slave Master's Bust (Legendary versions for the legendary tier). The page says ML 8 (heroic) and ML 28 (the data and page call the second tier Epic/Legendary). The page box states the pack requirement; 'All base items are Bound to Account on Acquire, requiring access to the pack to craft these items.' No level, favor or feat gate. The heroic barter window shows wrong values for Quality Attributes, Quality Fortification and Quality False Life (the page gives the right ones). The 12-row Named items table lists (Legendary) Executioner's Platemail, Docent, Spinneret, Symbol of the Slave Lords, Executioner's Helm, Mutilator of Minds, Slave Master's Cloak, Slave Rags, Breaker of Bodies, Hardened Hide Helm, Ring of Power and Slave Master's Staff; the data's 'against the slave lords set bonus' label is on 21 items and is missing from Executioner's Helm (heroic) and Hardened Hide Helm (heroic; no Legendary Hardened Hide Helm item exists)."

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Slave_Lords_Crafting"
read = "2026-11-04"
note = """
Heroic (ML 8) effects.

Three sets; the set bonus triggers at 3 and 5 pieces; each item counts for one set. Named items show the same in-game slot text and use the label 'crafting: against the slave lords set bonus', which cannot be a second slot of this step (see the report).

Legendary (ML 28) effects; the same group as the heroic Prefix with the Legendary column.

Legendary (ML 28) effects; the Legendary column of Suffix.

Legendary (ML 28) effects; the Legendary column of Extra.

Legendary (ML 28) effects; the Legendary column of Bonus.

The Legendary column of Set bonus addition.

Pure step, both tiers (recipes exist at heroic and legendary): adds an empty augment slot of that colour to the item (the page tips: do not make a Colorless slot, make Blue or Yellow). In game the slot reads 'Slaver's Augment Slot'.

Pure step, both tiers: adds a Mythic Boost to crafted or named Slave Lords gear; costs one rare ingredient. (A patch removed using it on non-Slave-Lords gear sharing a slot; on a named item the drop's own mythic bonus can coexist, but the page says you do not get a benefit from both.)

Effects table: one cost cell spans all 5 prefix rows (heroic 50 Broken Shackles, Legendary 100).

One cost cell spans all 9 suffix rows (heroic 50 Chain Links, Legendary 100).

One cost cell spans all 8 extra rows (heroic 50 Broken Collars, Legendary 100).

One cost cell spans all 6 bonus rows: 20 each of Frayed Leather and the three common ingredients.

Same 6 rows, 50 each of the Legendary ingredients.

One cost cell spans the 3 set bonus rows (Slave Lord's Might, Slave Lord's Sorcery, Slaver's Endurance).

Same 3 rows, 50 each of the Legendary ingredients.

Common part: 20 each of the three common ingredients. Each recipe adds its own Staff Splinters: Colorless, Blue and Yellow 20, Green 30 (page: 30/100 for a green slot).

Common part: 50 each of the three Legendary common ingredients. Each recipe adds its own Legendary Staff Splinters: Colorless, Blue and Yellow 50, Green 100.

No shared cost: Mythic Boost +1 costs one Statuette of the Gods, +3 costs one Slave Master's Bust (the page marks each with an asterisk, the rare ingredient only).

No shared cost: +1 costs one Legendary Statuette of the Gods, +3 one Legendary Slave Master's Bust.

Effects table group 'Prefix' (Heroic ML 8 values); in game 'Slaver's Prefix Slot' (Chains screenshot).

Same 'Prefix' group, Legendary ML 28 column and cost, as a separate step because the label differs.

Effects table group 'Suffix'; in game 'Slaver's Suffix Slot'.

Same 'Suffix' group, Legendary column, as a separate step because the label differs.

Effects table group 'Extra'; in game 'Slaver's Extra Slot'.

Same 'Extra' group, Legendary column, as a separate step because the label differs.

Effects table group 'Bonus'; in game 'Slaver's Bonus Slot'.

Same 'Bonus' group, Legendary column, as a separate step because the label differs.

The Legendary counterpart of 'crafting: slavelords set bonus': the same 'Set bonus addition' group, Legendary column (50 each cost). Written as its own step ('Legendary set bonus') because the step shape holds one slot per step, as the Alchemical file does for its Legendary tiers; the game shows one 'Against the Slave Lords Set Bonus'. The Legendary Chains page was not read, so the in-game wording of this label rests on the system page's shared table."""

