[[citation]]
field = "step"
url = "https://ddowiki.com/page/Item:Chains"
read = "2026-11-04"
note = "VERDICT: the same enchantment as the two other set bonus labels, written here as the step 'Set bonus'. In game the crafted base items (Chains, Five Rings, Shackles) show 'Against the Slave Lords Set Bonus: An Against the Slave Lords Set Bonus can be applied to this item.', word for word what the named items show; the system page has one 'Set bonus addition' group (Slave Lord's Might, Slave Lord's Sorcery, Slaver's Endurance) that applies to base items and named items alike, and says named items 'can only add a Set Bonus or Mythic Bonus'."

[[citation]]
field = "step"
url = "420px-Chains.png on Item:Chains"
read = "2026-11-04"
note = "VERDICT: the same enchantment as the two other set bonus labels, written here as the step 'Set bonus'. In game the crafted base items (Chains, Five Rings, Shackles) show 'Against the Slave Lords Set Bonus: An Against the Slave Lords Set Bonus can be applied to this item.', word for word what the named items show; the system page has one 'Set bonus addition' group (Slave Lord's Might, Slave Lord's Sorcery, Slaver's Endurance) that applies to base items and named items alike, and says named items 'can only add a Set Bonus or Mythic Bonus'."

[[citation]]
