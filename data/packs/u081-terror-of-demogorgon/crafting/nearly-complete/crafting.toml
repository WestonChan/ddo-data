[[citation]]
url = "https://ddowiki.com/page/Nearly_Complete"
read = "2026-11-04"
note = "Whole page read (two paragraphs and one table of six effect sets with heroic and legendary lists). Matches the data: all 12 labels' recipe sets by name and value (Ability Score +6 / +15, Healing Amplification +24 / +62, Insightful Ability Score +2 / +7, Quality Ability Score +1 / +3, Skill: Exceptional Bonus +6 / +11, Spell Focus +4 / +13), cost 25 Abyssal Gems, 25 Legendary Abyssal Gems for Legendary items. The prose calls the Ability Score set 'an Enhancement bonus to one of the core stats'. No level, favor, quest, pack or feat gate is stated (the page says only that the items are from the Terror of Demogorgon expansion). No item is produced: the forge adds an enchantment to an owned item. 'You cannot replace a Nearly Completed upgrade after selecting one - you will need a new copy of the item.' The page names no place for the forge beyond 'Gravenhollow'."

