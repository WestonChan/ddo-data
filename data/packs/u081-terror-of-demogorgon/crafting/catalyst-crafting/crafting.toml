[[station]]
name = "Strange Catalyst Forge"
note = "Ingredients are combined here to produce the new named item; the new item does not inherit Card Curses, Mythic or Reaper bonuses and all socketed augments are destroyed."

[[unlock]]
kind = "pack"
pack = "Terror of Demogorgon"
text = "Access to the Terror of Demogorgon expansion is still required to use the Catalysts, which are Unbound and tradeable."

[[unlock]]
kind = "level"
value = 11
text = "Level 11 or higher; the crafted items are ML11 (heroic) or ML35 (legendary)."

[[step]]
name = "Item upgrade"

[[step.cost]]
tier = "heroic"
ingredient = "Abyssal Gem"
quantity = 50

[[step.cost]]
tier = "legendary"
ingredient = "Legendary Abyssal Gem"
quantity = 5

[[citation]]
url = "https://ddowiki.com/page/Catalyst_Crafting"
read = "2026-11-04"
note = "Page read in full: prose, the catalyst/variant table (52 rows) and the level navigation boxes. No in-game screenshots on the page, so every row is typed_only. Not stated: crafting levels, favor, reaper experience, any quest gate on the forge."

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Catalyst_Crafting"
read = "2026-11-04"
note = """
Pure step: no socket label. A named base item, its catalyst and Abyssal Gems become the upgraded item, heroic or legendary. Added 2026-11-13 by the orchestrator from the reader's own rows, with no new read, under the reader brief's rule that a system with no socketed step gets one pure step named for what it does (amendment Revision 13e).

Gem part only: 50 Abyssal Gems on every heroic recipe. The catalyst (Abyssal or Deep, one per base item) and the named base item differ per recipe, so a recipe keeps those as its own rows.

Gem part only: 5 Legendary Abyssal Gems on every legendary recipe (the page text says 5). Catalyst and base item differ per recipe."""

