[[citation]]
url = "https://ddowiki.com/page/Sealed_Altar"
read = "2026-11-04"
note = "Page read in full (prose and the two item tables, heroic and legendary). No in-game screenshots on the page, so every row is typed_only. Not stated: crafting levels, favor, a quest gate. The tables describe three shapes (Shields, Sceptre, Other weapons) and the page gives the item name only as the label <Type> of the Oozing Hunger."

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Sealed_Altar"
read = "2026-11-04"
note = """
Pure step: no socket label. A Duergarcraft item and Abyssal Gems become the Oozing Hunger item of its shape, heroic or legendary. The three Slime Emblem recipes make the kept key, not an item, and are not listed here (they are this file's [[ingredient_recipe]] rows). Added 2026-11-13 by the orchestrator from the reader's own rows, with no new read, under the reader brief's rule that a system with no socketed step gets one pure step named for what it does (amendment Revision 13e).

All three heroic shapes (Shields, Sceptre, Other weapons) take 50 Abyssal Gems plus the corresponding heroic Duergarcraft item. That item differs per output type and is each recipe's own item cost, not expressible once on the step.

Page: 50 Legendary Abyssal Gems plus the corresponding Legendary Duergarcraft item (per output type). Note the contrast with Catalyst Crafting, whose legendary recipes take 5."""

[[citation]]
field = "recipe"
url = "https://ddowiki.com/page/Sealed_Altar"
read = "2026-11-04"
note = """
Globe sources the page gives: Black, Saga reward list of Terror of Demogorgon (Heroic) / (Legendary); Green, The Temple of Elemental Evil: Lower Temple Complex, Living Pool's chest; Gold, The Underdark (Menace of the Underdark), northern shrine after slaying Digestive Slimes. These stay drop text; no quest link is written.

Globe sources the page gives: Blue, Durk's Got A Secret, Muck's second chest; Gray, White Plume Mountain, Huge Black Pudding's chest; Pink, The Pit, Avatar of Juiblex's second chest.

Page: combine the top and bottom to get the Slime Emblem. The Emblem is the kept key."""

