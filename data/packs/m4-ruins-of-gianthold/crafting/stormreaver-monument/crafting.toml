[[citation]]
url = "https://ddowiki.com/page/Stormreaver_Monument"
read = "2026-11-04"
note = "Whole page read: overview (Update 12, 12 Patch 3, 17, 18), location, the Seal section, the heroic upgrade table (12 items), The Fall of Truth tier table (Tier 1 and Tier 2). No level, favor, pack, feat or quest gate is stated for the monument. The page does not give the quantity of Seals per upgrade as a number ('Place the seals and the named items'); Maetrim's x1 is kept and not contradicted. The page does not name a step for the heroic upgrade."

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Stormreaver_Monument"
read = "2026-11-04"
note = """
Heroic upgrade of The Reaver's Fate named loot with one Seal. The wiki gives the upgrade no step name; the game's socket label reads 'Upgradeable Item'. Maetrim puts Amulet of the Stormreaver and Cloudburst on this shared label and the other ten on the '(stormreaver)' label, although the page shows one upgrade kind with one cost for all twelve (see label conflict).

Same heroic upgrade as the step above; ten items. Name taken from the label, the page names no step.

Page table 'Attuned by Heroism: Tier 1' under The Fall of Truth (Update 17). 12 items: Braisingstar, Dreampiercer, Rebellion, Skybreaker, Hand of the Stormreaver, Madstone Aegis and the seven yellow-slot items (Gauntlets of Immortality, Halcyon Boots, Idol of Fortune, Pendant of the Stormreaver, Ring of Deceit, Stormreaver's Tablecloth, Ventilated Armbands).

Page table 'Attuned by Heroism: Tier 2' under The Fall of Truth. 11 items; Tier 2 effects differ per item (Conflagrating, Supreme Good, Colorless/Blue/Red slots, Good Luck +3, Electric Resistance +50, Spell Penetration III, Immunity to Air Elemental Knockdown). Skybreaker adds a Red slot and The Reaver's Fate; Madstone Aegis and Pendant etc. as in Maetrim's rows.

Plus the named item itself (x1 per recipe, an item cost). The page says to 'place the seals and the named items in the Monument' and gives no number; the same cost holds for all twelve heroic upgrades in the table. Upgrading does not remove a Deck of Many Curses curse.

As for the other heroic step.

One cost cell over all four effect groups of the Tier 1 table; plus the item itself x1. Matches Maetrim's twelve rows. The page's '5 - 12 Commendations of Heroism depending on difficulty' is 5 (Tier 1) + 7 (Tier 2).

One cost cell over all Tier 2 effect groups; plus the item itself x1. Matches Maetrim's eleven rows.

Amulet of the Stormreaver and Cloudburst are heroic Reaver's Fate items upgraded with a Seal. The label is shared with the Fountain of Necrotic Might (Breeze, Circle of Hatred, Enduring Conviction, Wretched Twilight) and with ToEE armor sockets; this verdict is for Stormreaver only and does not decide the others.

Ten heroic Reaver's Fate items upgraded with a Seal. Used by Stormreaver Monument only (Dreamspitter's socket is on this label, and Dreamspitter is also upgraded at the Dreamforge by the 'crafting: suppressed power' label).

Page table 'Attuned by Heroism: Tier 1' (The Fall of Truth items). Shared with Mikrom Sum, where the same label means Caught in the Web weapons: Adds Planar Conflux. Here the Tier 1 effects differ per item (+7 to +8 enhancement, or a Yellow slot).

Page table 'Attuned by Heroism: Tier 2' (The Fall of Truth items). Shared with Mikrom Sum, where Tier 2 for every Caught in the Web weapon is +7 enhancement becomes +8; here Tier 2 effects differ per item."""

[[citation]]
field = "recipe"
url = "https://ddowiki.com/page/Stormreaver_Monument"
read = "2026-11-04"
note = """
Update 18: 'Trade 20 Black Dragon Scales, 20 Blue Dragon Scales, 20 White Dragon Scales at the Stormreaver Monument' (page cost table 'Seal of the Stormreaver | 20 Black | 20 Blue | 20 White'). Yields one Seal (quantity not stated). The Seal is Bound to Account (screenshot SealoftheStormreaver.jpg) and can sit in an ingredients bag; it also drops from The Reaver's Fate warded chest on Hard or Elite difficulty.

The Fall of Truth items. Epic Normal items can be upgraded twice (Tier 1 for 5 Commendations of Heroism, then Tier 2 for 7). Epic Hard items drop already at Tier 1 and can be upgraded once, to Tier 2, for 7 Commendations of Heroism. Epic Elite items drop fully upgraded. The page's overview gives the total as '5 - 12 Commendations of Heroism, actual amount depends on the difficulty the item was obtain[ed]'.

Epic Normal items need Tier 1 first (5 Commendations), then Tier 2 (7). Epic Hard items are bought at Tier 2 only (7 Commendations of Heroism). Epic Elite items drop with both upgrades already applied. Cost cell on the page: 7 Commendations of Heroism and 9 each of Restored Giant, Elven and Dragon Relics.

Update 12 Patch 3: raid items from the Reaver or Abbot raids obtained before Update 12 can be unlocked to add the upgrade option. Process requires 5 giant, elven or dragon relics (the type depends on the item). Dreamspitter keeps its Suppressed or Unsuppressed status; old versions with neither status gain no suppressed power and keep their binding. Stone of Change rituals persist. Quantity x5 matches Maetrim's row."""

[[citation]]
url = "https://images.ddowiki.com/SealoftheStormreaver.jpg"
read = "2026-11-04"
note = "In-game examine window of the Seal of the Stormreaver: 'Bound To Account', 'Binds to Account on Acquire', 'Ingredient Type: valuable item that can be exchanged for goods if brought to a Challenge Trader', stores as an ingredient; text says to bring it to the Monument in Gianthold with a loot item from the Stormreaver raid. Base value 2,000. Matches the data's Bound to Account."

