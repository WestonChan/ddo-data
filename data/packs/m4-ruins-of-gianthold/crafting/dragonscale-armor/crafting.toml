[[citation]]
url = "https://ddowiki.com/page/Dragonscale_Armor"
read = "2026-11-04"
note = "Whole page read: armor types (Robe Armor Bonus +8; Dragonhide leather 3 base armor +5; Dragonscale scalemail 6 +5; Dragonplate full plate 9 +5; Docent Adamantine +17, Mithral +8, Composite +3; 'Dragonscale outfits do not exist'), the scale drop table, the turn-in table (Master Scalesmiths heroic 20 scales; Flawless 20 Flawless scales, 10 Restored Dragon, 10 Giant, 10 Elven Relics, 3 Commendations of Heroism; Altar of Epic Rituals Epic Red; Mikrom Sum (requires 375 Purple Dragon Knights favor) Cormyrian Red and Green), set bonuses (Draconic Ferocity, Mind, Resilience with the Helm of each colour, levels 23-25). All nine recipe costs and the stat lines match the data. Update 14 made the enhancements uniform across armor types. No level or pack gate is stated (the Level 14+ box is the wiki's grouping). The page does not mention the Attuned by Heroism upgrades or the Stormreaver Monument. The Cormyrian rows give 15 Commendations: Druids of the King's Forest (Red) and 15 Commendations: War Wizards (Green) as the second commendation, which the Mikrom Sum page words per armor type."

[[citation]]
field = "pack"
url = "https://ddowiki.com/page/Gianthold"
read = "2026-11-12"
note = "The Master Scalesmiths stand in Gianthold city, and the Gianthold page says 'Requires access to adventure pack: Ruins of Gianthold'. No Epic Red or Cormyrian recipe, station or output is listed under this system: the Epic Red armors are Epic Crafting's (made at the Altar of Epic Rituals) and the Cormyrian armors are Mikrom Sum's."

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Dragonscale_Armor"
read = "2026-11-04"
note = """
Pure step: no socket label. Heroic Black, Blue and White armors at the Master Scalesmiths (ML 14). Each recipe yields one of five armor types (Robe, Dragonhide, Dragonscale, Dragonplate, Docent) of its colour.

Pure step: no socket label. Flawless Black, Blue and White armors at the Master Scalesmiths (ML 25, +7 enhancement). Each recipe yields one of five armor types (Robe, Dragonhide, Dragonscale, Dragonplate, Docent) of its colour.

Each recipe costs 20 heroic Dragon Scales of its colour (Black Dragon Scale, Blue Dragon Scale, White Dragon Scale), nothing else; the colour differs, so no ingredient is shared. The survey rows match.

Shared part; each recipe adds 20 of its Flawless Black, Blue or White Dragon Scale. The survey rows match."""

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Attuned_to_Heroism"
read = "2026-11-04"
note = """
Proposed: no recipe in the data prices it. Flawless Black, Blue and White armors (15 items): Tier 1 turns +7 Enhancement Bonus into +8. Upgradable at the Stormreaver Monument (and 'Mastercraft Scalesmiths'); 'Upgrading requires Commendations of Heroism', no quantity stated on any page read. The label also has verdicts under Stormreaver Monument and Mikrom Sum.

Proposed: no recipe in the data prices it. Flawless armors, by colour: Black Armor-Piercing 15% -> 20%; Blue Spell Lore VI -> IX; White Protection +7 -> +8 and Shield +6 -> +8 (the data's socket options match: Armor Piercing 20%, Spell Lore IX, Protection +8 and Shield +8, five items each)."""

[[citation]]
field = "recipe"
url = "https://ddowiki.com/page/Dragonscale_Armor"
read = "2026-11-04"
note = """
Set bonus Draconic Ferocity with the Helm of the Black Dragon (levels 23-25): +3% artifact bonus to Doublestrike and +2 artifact bonus to Hit and Damage with ranged and thrown weapons. Flawless armors have +7 enhancement where the others have +6 (Robe: Armor Bonus).

Set bonus Draconic Mind with the Helm of the Blue Dragon (levels 23-25): +15 artifact bonus to Universal Spell Power.

Set bonus Draconic Resilience with the Helm of the White Dragon (levels 23-25): +50 artifact bonus to Hit Points."""

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Item:Flawless_Black_Dragonscale_Armor"
read = "2026-11-04"
note = """
The 15 Flawless Black, Blue and White armors carry it; the item pages list 'Attuned by Heroism: Tier 1: +7 Enhancement Bonus -> +8 Enhancement Bonus'. The label also has verdicts under Stormreaver Monument and Mikrom Sum; see the verification request on which system owns the armors' sockets.

The same 15 armors; the item pages list a per-colour Tier 2 change (Black Armor-Piercing 15% -> 20%, Blue Spell Lore VI -> IX, White Protection +7 -> +8 and Shield +6 -> +8)."""

