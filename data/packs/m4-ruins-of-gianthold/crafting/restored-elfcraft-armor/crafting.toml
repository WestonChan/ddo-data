[[citation]]
url = "https://ddowiki.com/page/Restored_Elfcraft_Armor"
read = "2026-11-04"
note = """
Turn in 10 Restored Elven Relics to Hoorunoe for a piece of armor (all ML 23, bound to character on equip). The page is a short stub of prose: no tables, no screenshots.

Whole page read: relic source prose ('Restored Elven Relics can be obtained by completing Epic Gianthold quests; at the end of the chain you are offered 4 of each type of Restored Relic in the chain rewards list' and a chance to loot one or more at the end of each quest), the turn-in sentence, the five armor varieties and the shared properties. No gate (level, favor, quest) is stated for the trade; the page does not name the chain. Typed only."""

[[citation]]
field = "pack"
