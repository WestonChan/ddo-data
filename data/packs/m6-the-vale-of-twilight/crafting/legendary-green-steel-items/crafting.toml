[[citation]]
field = "step"
url = "https://ddowiki.com/page/Legendary_Green_Steel_items/Tier_3"
read = "2026-11-04"
note = """
No ingredient is shared by every recipe: each takes one Focus, one Gem and one Essence of its own types (1 each, from the survey and the table columns), which stay on the recipes. Augments need no cell or Commendation at the altar; the Commendations of Valor are spent making the manufactured ingredients (see the ingredient recipes).

No ingredient is shared by every recipe: each takes one Focus, one Gem and one Essence of its own types (1 each, from the survey and the table columns), which stay on the recipes. Augments need no cell or Commendation at the altar; the Commendations of Valor are spent making the manufactured ingredients (see the ingredient recipes). The Dual Weapon Shard column shows "Legendary Superior Focus of Any Essence" on the first row of each Gem/Essence block: a dual weapon shard adds a second Tier 3 Focus, which the survey rows (three ingredients) do not carry.

Weapon bonus effects (21 named, e.g. Legendary Air Strike AAAa, Legendary Mineral EPEp) are chosen by four foci: Tier 1 Focus A, Tier 2 Focus B, and two Tier 3 foci (a Dual Weapon Shard). Aspect Dominance does not apply to Legendary recipes, so order does not matter. Heroic Elemental Mastery (Fire/Water/Earth/Air) became Legendary Tempered (Air/Earth/Air/Earth) and the other version became Legendary Balance of Land & Sky (Fire/Water/Fire/Water); two combinations give "No effect".

Tier 3 page: 36 rows with an Equipment Augment column (Quality values); the page says Tier 3 bonus effects are granted for weapons only. Step name read from the in-game Augment Item window (screenshot https://images.ddowiki.com/UI_LGSAugment.png): "Green Steel Tier 1/2/3 Equipment Slot", "Green Steel Active Slot", "Fangs of Shavarath".

Tier 3 page: 36 rows with a Weapon Augment column (Exceptional values, 12d120 on vorpal) and a Dual Weapon Shard column; the weapon bonus effect comes from the combination of one Tier 1, one Tier 2 and two Tier 3 foci. Step name follows the main page's typed wording ("Green Steel Tier 1 Slot", "Green Steel Active Slot"); the weapon slot window was not seen."""

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Legendary_Green_Steel_items/Active"
read = "2026-11-04"
note = """
The Active page prices its 40 clicky augments with three to five manufactured ingredients each in differing counts (1 to 3 of each, 12 to 15 of Tier 3 for the dearest); nothing is shared. The 23 weapon bonus effects on this label have no cost of their own in the data.

The Active page lists 40 clicky augments (Flame Arrow, Nightshield, Haste, ... Restoration), each with 3 to 5 manufactured ingredients and charges and caster level. Spot-checked against the survey: the counts for Flame Arrow, Nightshield, Haste, Quench and Call Kindred Being agree. Made at the Altar of Fecundity, not at the legendary altars.

Main page: all LGS weapons have 4 slots, the Active slot being the clicky slot (and the in-game window shows equipment with a Green Steel Active Slot and a Fangs of Shavarath slot too). The 23 recipes the data puts on this label are the Tier 3 page's weapon bonus effects (Legendary Air Strike ... Concordant Opposition and two "No effect"), not the Active page's 40 clicky augments, which carry no label in the data. Verdict "step" is for the slot; which recipes belong to it is a verification request. Step name follows the main page's typed wording ("Green Steel Tier 1 Slot", "Green Steel Active Slot"); the weapon slot window was not seen."""

