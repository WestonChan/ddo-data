[[citation]]
field = "step"
url = "https://ddowiki.com/page/Legendary_Green_Steel_items/Tier_1"
read = "2026-11-04"
note = """
No ingredient is shared by every recipe: each takes one Focus, one Gem and one Essence of its own types (1 each, from the survey and the table columns), which stay on the recipes. Augments need no cell or Commendation at the altar; the Commendations of Valor are spent making the manufactured ingredients (see the ingredient recipes).

Tier 1 page: 36 rows with an Equipment Augment column (Intensity 20%, Guard +10d6, Profane Wizardry/Lifeforce, saves, resistances). Main page: all LGS equipment has 5 slots, Tier 1/2/3, Active and Fangs of Shavarath. Step name read from the in-game Augment Item window (screenshot https://images.ddowiki.com/UI_LGSAugment.png): "Green Steel Tier 1/2/3 Equipment Slot", "Green Steel Active Slot", "Fangs of Shavarath".

Tier 1 page: 36 rows with a Weapon Augment column (Magnetism 139, Electrifying 12d6, stats +12 ...). Step name follows the main page's typed wording ("Green Steel Tier 1 Slot", "Green Steel Active Slot"); the weapon slot window was not seen."""

