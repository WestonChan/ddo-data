[[citation]]
field = "step"
url = "https://ddowiki.com/page/Altar_of_Invasion_-_Manufactured_Ingredient_Recipes"
read = "2026-11-04"
note = """
Altar of Invasion page: "All Recipes assume you are also placing a Shard of Power and a Shavarath Low Energy Cell in the Altar" (imbue step); the crafting-steps page adds a second Shavarath Low Energy Cell to apply the Imbued Shard to the item, so 1 shard + 2 cells shared by all 36 weapon recipes. The Focus, Gem and Essence (one of each, 1 each) differ per recipe and stay on the recipes, so no exceptions. Replaces the round-1 row, which listed all 36 recipes as exceptions before the uniform-part rule was settled.

Altar of Invasion page: "All Recipes assume you are also placing a Shard of Power and a Shavarath Low Energy Cell in the Altar" (imbue step); the crafting-steps page adds a second Shavarath Low Energy Cell to apply the Imbued Shard to the item, so 1 shard + 2 cells shared by all 36 accessory recipes. The Focus, Gem and Essence (one of each, 1 each) differ per recipe and stay on the recipes, so no exceptions. Replaces the round-1 row, which listed all 36 recipes as exceptions before the uniform-part rule was settled.

Altar of Invasion/Tier 1, Altar of Subjugation/Tier 2, Altar of Devastation/Tier 3 on the system's navigation box; the Invasion table lists a weapon attribute and a clothing/jewelry attribute per recipe (Subjugation and Devastation tables read in round 2: the same weapon/clothing split). Step name is the wiki's tier wording, not confirmed in game"""

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Altar_of_Subjugation_-_Manufactured_Ingredient_Recipes"
read = "2026-11-04"
note = """
Altar of Subjugation page: "All Recipes assume you are also placing a Shard of Great Power and a Shavarath Medium Energy Cell in the Altar" (imbue step); the crafting-steps page adds a second Shavarath Medium Energy Cell to apply the Imbued Shard to the item, so 1 shard + 2 cells shared by all 36 weapon recipes. The Focus, Gem and Essence (one of each, 1 each) differ per recipe and stay on the recipes, so no exceptions.

Altar of Subjugation page: "All Recipes assume you are also placing a Shard of Great Power and a Shavarath Medium Energy Cell in the Altar" (imbue step); the crafting-steps page adds a second Shavarath Medium Energy Cell to apply the Imbued Shard to the item, so 1 shard + 2 cells shared by all 36 accessory recipes. The Focus, Gem and Essence (one of each, 1 each) differ per recipe and stay on the recipes, so no exceptions.

No cost of its own. The aspect is granted by the focus pair already used at Invasion and Subjugation; the page prices nothing for it. The survey also gives these recipes no ingredients.

Altar of Subjugation page, "Additional Effects" table (36 rows: Invasion focus x Subjugation focus -> aspect and clicky). The aspect is added by the Tier 2 upgrade itself; it takes no ingredient of its own. Step name follows the page's "Tier 2 Aspect Properties" link, not the game."""

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Altar_of_Devastation_-_Manufactured_Ingredient_Recipes"
read = "2026-11-04"
note = """
Altar of Devastation page: "All Recipes assume you are also placing a Shard of Supreme Power and a Shavarath High Energy Cell in the Altar" (imbue step); the crafting-steps page adds a second Shavarath High Energy Cell to apply the Imbued Shard to the item, so 1 shard + 2 cells shared by all 36 weapon recipes. The Focus, Gem and Essence (one of each, 1 each) differ per recipe and stay on the recipes, so no exceptions. The survey carries only 1 High Energy Cell here; the page's own steps and planning example (5 Low cells for a 3-ingredient Invasion run: 3 + imbue + apply) say 2, so 2 is written and the difference is a verification request.

Altar of Devastation page: "All Recipes assume you are also placing a Shard of Supreme Power and a Shavarath High Energy Cell in the Altar" (imbue step); the crafting-steps page adds a second Shavarath High Energy Cell to apply the Imbued Shard to the item, so 1 shard + 2 cells shared by all 36 accessory recipes. The Focus, Gem and Essence (one of each, 1 each) differ per recipe and stay on the recipes, so no exceptions. The survey carries only 1 High Energy Cell here; the page's own steps and planning example (5 Low cells for a 3-ingredient Invasion run: 3 + imbue + apply) say 2, so 2 is written and the difference is a verification request.

No cost of its own. The aspect is granted by the Devastation upgrade (single shard, or a dual-affinity shard for mixed-element rows); the page prices nothing for it. The survey also gives these recipes no ingredients.

Altar of Devastation page, second "Additional Effects" table headed "Clothing/Jewelry Attribute Added" (21 rows; Mineral II reads Protection +5, Fortification +100%, which tells it from the weapon table). Added by the Tier 3 upgrade; mixed-element rows need a dual-affinity shard. Step name follows the page's "Tier 3 Aspect Properties" link.

Altar of Devastation page, first "Additional Effects" table headed "Weapon Attribute Added" (21 rows; Mineral II reads Metalline, Keen/Impact, Slicing, Mineral). Added by the Tier 3 upgrade; mixed-element rows need a dual-affinity shard. The wiki shows no weapon-side Aspect I table, and the data has no weapon aspect I label."""

