description = """
SAFETY INSTRUCTIONS:
Use the short-range welding prototype to join metals with a surge of electricity.
Power supplies are accepted via rear-oriented connection. Do not look directly
into the aperture. Do not point the aperture at any nonmetal apparatus while
connected to a power supply. Do not submerge in water. Do not attempt to disassemble
the prototype or any accompanying power supply materials.

WARNING: Operating
this prototype without safety equipment, including but not limited to appropriately
fitting and approved safety goggles, may cause serious damage to yourself and
others. User caution is advised."""
