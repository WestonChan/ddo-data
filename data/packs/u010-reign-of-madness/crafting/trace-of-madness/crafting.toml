[[citation]]
url = "https://ddowiki.com/page/Altar_of_Insanity"
read = "2026-11-04"
note = "Whole page read. The recipe table's ingredient column is icons with hover tooltips (typed text only, no screenshot); all 10 recipes' quantities match the data files. Alien Mind and Uncanny Awareness carry a footnote: they are Resistance-typed bonuses that do not stack with Resistance items (quoted developer remark on the page). No gate stated: no level, favor, pack or quest access is named for the altar (the Level 14+ navbox heading is a category list, not a gate). Ingredients drop from Reign of Madness enemies (Update 10) and Trace of Madness items from Harbinger of Madness, Reign of Madness and Disciples of Rage, which is a source, not a stated access gate."

[[citation]]
field = "pack"
url = "https://ddowiki.com/page/Altar_of_Insanity"
read = "2026-11-12"
note = "The Altar of Insanity is in The Twelve (no pack named). The Altar of Insanity page (read 2026-11-04, not reloaded) says the ingredients drop from Reign of Madness enemies and the Trace of Madness items from Harbinger of Madness, Reign of Madness and Disciples of Rage, so Reign of Madness supplies both and is the one pack the system needs. The page states no access gate itself."

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Altar_of_Insanity"
read = "2026-11-04"
note = """
Not uniform: every recipe has its own mix of 10, 20, 50 of Watcher's Eyes, Polished Stones, Adhesive Slimes and Brain Samples (plus the Trace of Madness item x1 in each). Per-recipe costs stay on the recipes; all 10 match the data files.

One socket; every recipe is named Xoriat Madness: <name>. Once applied the recipe is fixed and cannot be overwritten by a different recipe."""

