[[citation]]
url = "https://ddowiki.com/page/Alchemical_Crafting"
read = "2026-11-04"
note = "Whole page read. Heroic: blank items drop from The Master Artificer raid end chest and every 5th MA reward list; level 12 unbound, 12 BtA with a material type (page text elsewhere says ML 14 at the Reforging Station), 16 BtC with Tier 1, 18 with Tier 2, 20 with Tier 3. Legendary (Update 47): blanks from Legendary Lord of Blades and Legendary Master Artificer, Minimum Level 29, Bound to Character on Equip; Tier 0 material = blank plus 50 Threads of Fate, Tier 1 = 50 Threads and 1 Stabilizing Compound, Tier 2 = 100 and 1, Tier 3 = 250 and 1; Tier 3 element must equal the Tier 1 or Tier 2 element. All 7 Tier 0 materials, 20 Tier 1, 20 Tier 2 and 16 Tier 3 legendary options match the data. The nav box 'Level 12+' is the wiki's grouping and no level, favor, feat or pack gate is stated in the page body. Update 47 made many old heroic ingredients unused (Martial/Mystical Cannith Power Cells, Khyber Dragonshards of Binding, Elemental Spirits); they are not in the data. Only one image on the page, Crafting_AlchemicalGreataxe.jpg (a weapon look)."

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Cannith_Reforging_Station"
read = "2026-11-04"
note = """
Six metal types. The recipe text says the prototype item becomes Bound to Account and ML 14.

Not in the data's recipes: Reforging Station table 'Toven's Hammer Unlocking'.

Common part: 1 Cannith Power Cell (plus the Prototype item being reforged). Each recipe adds its own three ingots, 1 each: Adamantine = Dense, Metallic, Glowing; Byeshk = Pliable, Metallic, Dense; Cold Iron and Silver = Metallic, Glowing, Pliable; Crystal and Flametouched Iron = Glowing, Pliable, Dense. The survey rows match.

Partially Repair Toven's Hammer (the only recipe): the hammer, 1 Cerebral Distillation Unit and 1 Cannith Power Cell (icon counts of 1). The Cerebral Distillation Unit is not an ingredient in the data (see the new_ingredient row).

Complete Toven's Hammer (the only recipe): the hammer, 1 Elemental Motion Fixation Device and 1 Greater Cannith Power Cell (icon counts of 1). The device is not an ingredient in the data (see the new_ingredient row).

VERDICT: a different step from 'crafting: alchemical tier 1', not the same step under two labels. Toven's Hammer's first Alchemical Crafting upgrade is the Reforging Station recipe 'Partially Repair Toven's Hammer' (adds Insightful Intelligence +2) for the Cerebral Distillation Unit and a Cannith Power Cell; the weapon Tier 1 is a Binding Station elemental choice for an alloy. Different station, effects and cost.

VERDICT: a different step from 'crafting: alchemical tier 2'. It is the Reforging Station recipe 'Complete Toven's Hammer' (adds Transform Kinetic Energy) for the Elemental Motion Fixation Device and a Greater Cannith Power Cell."""

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Cannith_Binding_Station"
read = "2026-11-04"
note = """
Martial and Mystical per element; Mystical effects also depend on the metal type.

Martial and Mystical per element.

Martial adds a Red augment slot; Mystical gives the Efficient Metamagic, Focus and Augmentation lines.

Two groups, by element: the four Martial options cost Durable Alloy x1; the four Mystical options cost Volatile Alloy x1. Costs do not vary by element. The survey rows match the Binding Station page.

Two groups, by element: the four Martial options cost Fortified Compound x1 and Durable Alloy x1; the four Mystical options cost Mercurial Compound x1 and Volatile Alloy x1. Costs do not vary by element. The survey rows match the Binding Station page.

Two groups, by element: the four Martial options cost Fortified Compound x2 and Token of the Twelve x5; the four Mystical options cost Volatile Alloy x1 and Mercurial Compound x1. Costs do not vary by element. The survey rows match the Binding Station page.

Heroic Tier 1 Elemental Binding at the Cannith Binding Station: Martial or Mystical, per element (page heading 'Tier 1 Elemental Binding').

Heroic Tier 2 Elemental Binding at the Cannith Binding Station.

Heroic Tier 3 Elemental Binding at the Cannith Binding Station; each Martial recipe adds an empty Red augment slot."""

