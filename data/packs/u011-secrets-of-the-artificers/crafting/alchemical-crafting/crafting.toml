Combine the Tier 1 item with 100 Threads of Fate and 1 Stabilizing Compound; all 20 options.

Combine the Tier 2 item with 250 Threads of Fate and 1 Stabilizing Compound; all 16 options.

Heroic: the Cannith Reforging Station 'Refinement' (page heading); the six Reforge Item recipes pick the metal type, which also fixes the Mystical effects of Tiers 1 and 2.

Legendary page section 'Tier 0: Material': blank plus 50 Threads of Fate.

Legendary page section 'Tier 1'.

Legendary page section 'Tier 2'.

Legendary page section 'Tier 3'; the Orange, Purple and Green options each add that colour of augment slot."""

