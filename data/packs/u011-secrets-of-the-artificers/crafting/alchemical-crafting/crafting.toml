[[citation]]
url = "https://ddowiki.com/page/Cannith_Binding_Station"
read = "2026-11-04"
note = "Whole page read: the six heroic recipe tables (Martial and Mystical, Tier 1 to 3). Every cost matches the data: Tier 1 Martial 1 Durable Alloy, Mystical 1 Volatile Alloy; Tier 2 Martial Fortified Compound + Durable Alloy, Mystical Mercurial Compound + Volatile Alloy; Tier 3 Martial 2 Fortified Compound + 5 Tokens of the Twelve, Mystical Volatile Alloy + Mercurial Compound. Costs do not depend on the element. The first ingredient of each recipe is the item being upgraded (a Reforged, Infused or Dual-Infused weapon or shield); it is not an ingredient row. The page says the three tiers can use any mix of elements."

[[citation]]
url = "https://ddowiki.com/page/Item:Toven%27s_Hammer"
read = "2026-11-04"
note = "Item page read, including the examine-window screenshot 420px-Toven's_Hammer.png (its Missing Parts line refers to partially repairing the hammer with a cerebral distillation unit; it does not show the socket names). Notes: the hammer can be upgraded two ways by Alchemical Crafting (Insightful Intelligence +2, then Transform Kinetic Energy); the Cerebral Distillation Unit drops from The Master Artificer's 'Destroy Soul-Cleansing Device' optional chest; the Elemental Motion Fixation Device (BtCoA) from The Lord of Blades' 'Grudge Maker' optional chest."

