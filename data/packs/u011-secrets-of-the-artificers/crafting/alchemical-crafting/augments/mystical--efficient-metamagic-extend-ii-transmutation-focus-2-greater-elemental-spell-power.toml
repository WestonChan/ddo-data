name = "Mystical: Efficient Metamagic - Extend II, Transmutation Focus +2, Greater Elemental Spell Power"
description = """
Efficient Metamagic - Extend II: The additional spell point cost for using the Extend
Metamagic feat is reduced by 2 SP.
Transmutation Focus +2: +2 Equipment bonus to the DC of Transmutation spells.
Greater Elemental Spell Power: Harnessing a small amount of the power and
potential of the raw elements, this items gives you a +100 bonus to your maximum
spell points. This stacks with all bonuses except Greater Elemental Spell Power."""
