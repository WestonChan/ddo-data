[[citation]]
url = "https://ddowiki.com/page/Dragontouched_Armor"
read = "2026-11-04"
note = """
Whole page read: pack box ('Requires access to adventure pack: The Reaver's Reach'), Overview, Crafting Steps 1 to 4 (50 Draconic Runes buy an armor from Vorace; Stealer of Souls must be completed to spend Draconic Runes; Vorace sells an Eldritch Rune for 50 Draconic Runes; 3 Eldritch -> 1 Tempest and 3 Tempest -> 1 Sovereign at the altars; shatter a Sovereign Rune with a Draconic Rune for 1-9 runes; forge armor plus a rune at the matching altar), Armor Types (six, ML 16), Rune Properties table (23 Eldritch, 24 Tempest, 33 Sovereign) and set Notes. All 80 rune names and effect lines, all costs and the 6 armor types match the data. The data's note that the in-game skill-rune text says +3 where the page's table says '+6*' is not settled by this page (no footnote text for the asterisk was found). No player level gate is stated (the Level 16+ box is the wiki's grouping; ML 16 belongs to the armors). Editorial comment on the page: the system is mostly obsolete.

Presumably also makes a Sovereign Rune from three Tempest Runes, as the Eldritch Altar makes a Tempest Rune from three Eldritch Runes; the page gives no chat-log line for this altar."""

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Dragontouched_Armor"
read = "2026-11-04"
note = """
Vorace gives the chosen armor (Plate, Breastplate, Leather, Docent, Robe/Shroud or Outfit/Vestments) for 50 Draconic Runes.

Vorace shows ten of the 25 possible Eldritch Runes; you pick one for 50 Draconic Runes.

Three Eldritch Runes become one Tempest Rune whose type is not chosen (the chat log shows three Electricity Resistance runes giving a Tempest Rune of Exceptional Intelligence); a stack of identical runes cannot be used, separate identical runes can.

Three Tempest Runes become one Sovereign Rune; the type is not chosen.

A Sovereign Rune and a Draconic Rune (both consumed) return 1-9 Eldritch Runes' worth, converted up (5 gives a Tempest and 2 Eldritch; 9 a Sovereign), with exceptions the page's chat log shows (a Sovereign Rune of Crippling gave a Sovereign Rune of Destruction).

The armor takes one Eldritch Rune (23 types), forged at the Eldritch altar.

The armor takes one Tempest Rune (24 types), forged at the Tempest altar.

The armor takes one Sovereign Rune (33 types), forged at the Sovereign altar.

Step 1 and 2: 50 Draconic Runes for your choice of armor.

'1 Eldritch Rune from Vorace in exchange for 50 Draconic Runes.'

'grind 3 Eldritch into 1 Tempest'.

'3 Tempest into 1 Sovereign'.

'Place one Sovereign Rune and one Draconic Rune in the Dragontouched Sovereign Altar; both runes will be consumed.'

One rune of the type per forge, for every rune on the page's table (the armor being forged is also placed in the altar and kept). The survey rows match.

The page's Eldritch Rune column: one rune of that type per armor ('the armor can have one of each rune', 'no tiers, you can use the runes in any order'). The runes are drawn at random (chest drops, the ten Eldritch Runes Vorace shows out of 25, and the altar conversions that give an unchosen type), so the step is marked is_random; the page does say the player picks which rune in the inventory to forge.

The page's Tempest Rune column: one rune of that type per armor ('the armor can have one of each rune', 'no tiers, you can use the runes in any order'). The runes are drawn at random (chest drops, the ten Eldritch Runes Vorace shows out of 25, and the altar conversions that give an unchosen type), so the step is marked is_random; the page does say the player picks which rune in the inventory to forge.

The page's Sovereign Rune column: one rune of that type per armor ('the armor can have one of each rune', 'no tiers, you can use the runes in any order'). The runes are drawn at random (chest drops, the ten Eldritch Runes Vorace shows out of 25, and the altar conversions that give an unchosen type), so the step is marked is_random; the page does say the player picks which rune in the inventory to forge."""

[[citation]]
field = "recipe"
url = "https://ddowiki.com/page/Dragontouched_Armor"
read = "2026-11-04"
note = """
Six armors, all ML 16: Plate (armor +22, max Dex +1), Breastplate (+17, +5), Leather (+11, +11), Docent (Adamantine +16, Mithral +7, Composite +2, Construct Fortification 10%), Shroud (Robe, +6), Vestments (Outfit, +6).

Glacial Assault, Levik's Defender, Lorikk's Champion and Tharne's Wrath are each part of a three-piece set with two Module 7 raid items, 2 and 3 piece bonuses (Glacial Assault: Glaciation +72 / +78; Lorikk's Champion: Devotion +72 / +78; Levik's Defender: +3 / +5 insight AC with Melee threat)."""

