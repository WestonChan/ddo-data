read = "2026-11-04"
note = "Every recipe table, the ingredient table, the Tier 0 and Shadowscale base-item tables and the weapon and armor base-property lists were read. No in-game screenshot of any crafted item is on the page (only Crafting_MagmaForge.png, the forge). The page states no level, favor, pack, feat or crafting-level gate for the system; the nav template's 'Level 22+' group is a navigation listing, not a stated gate."

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Thunder-Forged"
read = "2026-11-04"
note = """
Page heading 'Creating base items'; the item says 'Thunder-Forged (Tier 0)'

Page heading 'Shadowscale Armor / Base items': Robe, Outfit, Light, Medium, Heavy, Docent, ML 26, all Bound to Character on Acquire

Page heading 'Flawless version upgrade', ML 28; each option adds a Green Augment Slot plus its own lines; compatibility by armor type is in the table (Shadow Caster and Shadow Disciple: all five armor types; Killer: not cloth; Striker: Medium, Heavy, Docent; Guardian: Heavy, Docent; Construct: Docent)

One recipe

Both cells are one rowspan over all six options

Only Commendation of Valor x240 is shared by all eleven options. Ingots 320 (nine options) or 720 (the two augment slots); Fire and Shadow Dragon Scale per option: Blessing 75 fire + 25 shadow, Edge 25 fire + 75 shadow, 2nd Degree Burns and Wrath of Flames 100 fire, Paralyzing Fear and Wrath of Shadows 100 shadow, Focus, School Focus and Spell Penetration 50 fire + 50 shadow, slots none. The survey rows match the page exactly.

Ingot x800 and Commendation x600 are shared by all 25 options. Group 1 (7 options: Ice Storm, 3rd Degree Burns, Crippling Flames, Leg Breaker, Mind Breaker, Dwarvencraft Acid Lore, Dwarvencraft Healing Lore) adds Fire Dragon Scale 200 + Shadow Dragon Phlogiston 30; group 2 (8 options, Eternal Chilling Darkness to Dwarvencraft Kinetic Lore) adds Shadow Dragon Scale 200 + Shadow Dragon Phlogiston 30; group 3 (10 options, Eternal Scorching Light to Dwarvencraft Repair Lore) adds Shadow Dragon Scale 200 + Fire Dragon Phlogiston 30. Group 1 pairing Fire scale with Shadow phlogiston is what the page's cells say (the rowspan is 7 on the 200 and 30 cells, and the columns are Fire Scale and Shadow Phlogiston by header icon); the survey rows match.

Header icons are Shadow Dragon Scale and Commendation of Valor; one recipe row covers every armor type

One cost cell over the six options

The Thunder-Forged page's 'Flawless version upgrade' (ML 28, Shadowscale Armor; 'You can only choose one upgrade') table has a Compatibility column per armor type: Cloth, Light, Medium, Heavy, Docent, over six options (Shadow Caster, Disciple, Killer, Striker, Guardian, Construct), each also adding a Green Augment Slot. The Cloth column ticks Caster and Disciple only, and those are the two augments carrying the Cloth label in the data. The data's six Shadow augments list exactly the five 'shadow <type> variant' labels the table's ticks give: Caster and Disciple all five (Cloth, Light, Medium, Heavy, Docent), Killer all but Cloth, Striker Medium/Heavy/Docent (Docent needs Mithral or Adamantine Body), Guardian Heavy/Docent (Docent needs Adamantine Body), Construct Docent only; the labels are therefore the armor-type variants of one step, one label per armor type. No item page names the sockets, so the step name is the wiki's heading 'Flawless version upgrade' plus the armor type; the game's own wording is unconfirmed. This splits the round-1 step 'Shadowscale Armor flawless upgrade' (slot none) into five steps, or keeps one step and gives its recipes a compatibility per variant: a shape decision for the orchestrator (verification request below). Cloth covers the Shadowscale Robe and Outfit, Light the Dragonhide, Medium the Dragonscale, Heavy the Dragonplate.

Same table as 'crafting: shadow cloth variant', Light column: options Shadow Caster, Shadow Disciple and Shadow Killer carry it in the data; the page's Light column ticks Caster, Disciple, Killer only.

Same table, Medium column: Shadow Caster, Disciple, Killer and Striker (the four augments carrying the label in the data; Striker's footnote 3 is a Docent condition, not Medium).

Same table, Heavy column: Shadow Caster, Disciple, Killer, Striker and Guardian (the five augments carrying the label in the data).

Same table, Docent column: all six options (the six augments carry the label in the data). Footnotes: Shadow Striker on a Docent requires Mithral Body or Adamantine Body; Shadow Guardian on a Docent requires Adamantine Body.

Page section 'Tier 1 upgrade ML 24'; item text 'Thunder-Forged (Tier 1)'

Page section 'Tier 2 upgrade ML 26'; the Green and Purple Augment Slot recipes are options of this step and grant a socket (grants_slot green / purple)

Page section 'Tier 3 upgrade ML 28'"""

