label = "crafting: suppressed power"
name = "Death's Touch"

[[option]]
name = "Adds Unholy Burst and Necromancy Focus II"
description = """
Unholy Burst: An unholy weapon is imbued with unholy power. This power makes the
weapon evil-aligned and thus bypasses the corresponding damage reduction.
It deals an extra 2 to 12 points of damage against all of good alignment and an
extra 3 to 18 on a critical for weapons with a x2 critical multiplier, 4 to 24
for a x3 multiplier, and 5 to 30 for a x4 multiplier.
Necromancy Focus II: +2 Equipment bonus to the DC of Necromancy spells."""
min_level = 18

[[option.effect]]
