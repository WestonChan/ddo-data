[[citation]]
field = "recipe"
url = "https://ddowiki.com/page/Dinosaur_Bone_crafting"
read = "2026-11-04"
note = "Barter at Sharpened Bone for 25 each of Fossilized Raptor Claws, Triceratops Horns, Pteranodon Vertebrae and Ankylosaur Ribs. The weapons also drop in the wilderness; the blue-border blanks are available from Isle of Dread quests, wilderness encounters, The Mountain Keeper's chest in the raid and the Sharpened Bone trader. Attuned Bone weapons (raid dice +3/+6, Bound to Character, Legendary Dread Isle's Curse set) cannot be crafted and drop only in the raid Skeletons in the Closet."

