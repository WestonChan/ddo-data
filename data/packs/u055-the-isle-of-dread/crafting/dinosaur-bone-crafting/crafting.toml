[[citation]]
url = "https://ddowiki.com/page/Dinosaur_Bone_crafting"
read = "2026-11-04"
note = "Whole page read: intro, ingredients, crafting, the slot table, all 11 recipe tables (every row name and the single cost cell over each table), the Raid Augments table and unslotting. Recipe counts per step match the survey (Scale weapon 7, Fang weapon 7, Claw weapon 16, Horn weapon 6, Scale accessory 17, Fang accessory 17, Claw accessory 17, Horn accessory 7, Scale armor 4, Fang armor 3, Set Bonus 6) and every cost matches. The Raid Augments table (Aspect of Tar, Black Sands' Desire, Fragment of Extraplanar Alignment, Fragment of Extraplanar Shadow, Dimensional Horn, Fossilized Amber) are drops from the raid Skeletons in the Closet's Free Yarrow optional ending, not recipes. The page states the pack requirement (box) and calls the system Legendary (ML31) with no Heroic version; no level, favor or feat gate. Attuned Bone weapons cannot be crafted and drop only in the raid. The page spells the claw ingredient 'Tyrannosaurus Teeth' in costs and 'Fossilized Tyrannosaurus Tooth' in the ingredient list."

