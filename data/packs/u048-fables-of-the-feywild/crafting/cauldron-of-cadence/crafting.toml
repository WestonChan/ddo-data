[[citation]]
url = "https://ddowiki.com/page/Cauldron_of_Cadence"
read = "2026-11-04"
note = "Whole page read: intro (device for Ferrocrystal Weaponry and Set Augments, reached through the Hut from Beyond), the Ferrocrystal Weaponry paragraph (20 Chunks or Legendary Chunks, ML5 heroic and ML29 legendary), the Set augments paragraph and the 21-row table (Set Augment, Color, ML, Items to Consume, Set bonus effect, item drop sites). Not stated: any level, favor, pack, quest or feat gate; the quantity of the Empty Soul Vessel (shown without a number, taken as 1)."

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Cauldron_of_Cadence"
read = "2026-11-04"
note = """
Pure step: turn in 20 Chunks (heroic ML5 weapon) or 20 Legendary Chunks (ML29 weapon) and receive one of the weapons; the page does not say the result is chosen or random (the Ferrocrystal Weaponry page says 'craft these weapons via turning in 20 Chunks'). The weapon list is on the Ferrocrystal Weaponry page.

Pure step: 21 level 30 Set Augments, all Colorless, each from one named legendary raid item. No socket label.

Page: 'turning in 20 Chunks of Ferrocrystal'; the same on the Ferrocrystal Weaponry page. The page names one recipe kind, so the cost is uniform.

Page: 'turning in 20 ... Legendary Chunks of Ferrocrystal'.

Items to Consume column: 'Thread of Fate x 50' and 'Empty Soul Vessel' (no count shown, taken as 1) on all 21 rows, plus the one named legendary item, which differs per recipe and stays on the recipe."""

