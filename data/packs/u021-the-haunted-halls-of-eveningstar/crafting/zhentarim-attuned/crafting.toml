note = """
Page text 'Zhentarim Attuned: This item has been attuned by the Zhentarim mage, Whisper. It can be upgraded with Zhentarim Black Stones.' Introduced in Update 21.

The six Haunted Halls of Eveningstar items carry this socket and the page upgrades exactly those six; the label is used by this system only."""

