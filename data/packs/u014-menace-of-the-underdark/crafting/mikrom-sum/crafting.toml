read = "2026-11-04"
note = "Whole page read: NPC infobox, Usage, Attuned to Heroism upgrade, Caught in the Web Item Upgrades table (Tiers 1 to 4), Cormyrian Dragon Armors purchase table (10 rows), Armor upgrades table (5 sets). The page states a favor gate and no level, pack, quest or feat gate; the nav template's 'Level 22+' group is a navigation listing, not a stated gate."

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Mikrom_Sum"
read = "2026-11-04"
note = """
Caught in the Web raid weapons only. Table says 'All Caught in the Web raid items'.

Caught in the Web raid weapons only. 13 weapons listed, each with its own effect.

Caught in the Web raid weapons only. Twelve weapons add a Red Augment Slot; Celestia adds a Green Augment Slot.

Page heading 'Armor upgrades': the named armors (Stone Heart, Terrorweb Chitin Breastplate, Spidersilk Robes, Spider-spun Caparison, Hide of the Goristro, Embrace of the Spider Queen) become part of the Eveningstar Commendation item sets. The page gives no step name; 'Armor Upgrade' follows its heading.

Plus the weapon itself x1 per recipe (an item cost). Cell is one cost over all thirteen weapons; matches Maetrim's thirteen rows.

Always 15 of one faction Commendation plus the armor itself x1; the faction is set by the upgrade: Amaunator's Blessing = Clerics of Amaunator, Battle Arcanist = War Wizards, Way of the Sun Soul = Villagers of Eveningstar, Woodsman's Guile = Druids of the King's Forest, Knight's Loyalty = Purple Dragon Knights. So the quantity is uniform (15) but the ingredient differs per set. Matches Maetrim's eleven rows.

Page: 'When an item is first upgraded, Attuned to Heroism becomes Attuned by Heroism: Tier 1'. Caught in the Web weapon upgrade tier. Shared with the Stormreaver Monument, where Tier 1 effects differ per Fall of Truth item; here Tier 1 for every Caught in the Web item is 'Adds Planar Conflux'.

Caught in the Web weapon upgrade tier. Shared with the Stormreaver Monument; here Tier 2 for every Caught in the Web item is '+7 enhancement bonus becomes +8'.

Caught in the Web weapon upgrade tier. Used by Mikrom Sum only.

Sockets of the six named armors the 'Armor upgrades' table upgrades with Commendations. The label is used by Mikrom Sum only."""

[[citation]]
field = "recipe"
url = "https://ddowiki.com/page/Mikrom_Sum"
read = "2026-11-04"
note = """
Purchase: 20 Flawless Red (or Green) Dragon Scale, 15 Commendation: Purple Dragon Knights (Red) or War Wizards (Green), a second 15 Commendation by armor type (Heavy and Docent: War Wizards for Red / Purple Dragon Knights for Green; Medium: Clerics of Amaunator; Light: Druids of the King's Forest; Robe: Villagers of Eveningstar), and 3 Commendation of Heroism. The page's aside reads "Unlike Red Dragonscale Armors from Update 3 (The Vault of Night epic items), Cormyrian Red Armors don't require corresponding Black/Blue/White base armor." The aside predates Update 50, which refactored the Vault of Night crafting, and four current sources contradict it: the Epic Crafting page, the Dragonscale Armor page's turn-in row, and the Shard of the Red Dragon's Tips and in-game text all give the Epic Red armors four ingredients and no base armor. No page retracts the aside; it is judged stale by its date.

The Dragonscale Armor page gives one cost per color instead (red: Purple Dragon Knights and Druids of the King's Forest; green: Purple Dragon Knights and War Wizards); the Mikrom Sum page's cost by armor type is the one written. The page's aside reads "Unlike Red Dragonscale Armors from Update 3 (The Vault of Night epic items), Cormyrian Red Armors don't require corresponding Black/Blue/White base armor." The aside predates Update 50, which refactored the Vault of Night crafting, and four current sources contradict it: the Epic Crafting page, the Dragonscale Armor page's turn-in row, and the Shard of the Red Dragon's Tips and in-game text all give the Epic Red armors four ingredients and no base armor. No page retracts the aside; it is judged stale by its date."""

