[[citation]]
url = "https://ddowiki.com/page/Syranian_Forged_Weaponry"
read = "2026-11-04"
note = "Page states: crafted with the Alchemical Crafting / Nearly Finished system by speaking to Rayne Cloud in the City of Sharn Docks district near the crafting stations; Cannith Melting Station in the Lower Docks of Sharn; Heroic (ML15) and Legendary (ML29) versions, Bound to Account on Acquire; 40 weapon types each with a Legendary Variant; total cost after Update 42 Patch 1 identical for heroic and legendary (Iron Defender Claws 30, Rivets 40, Magefire Cannon Cores 30, Magefire Cannon Parts 40, Shield Guardian Cores 45, Shield Guardian Gyroscopes 45, Worker Drone Actuators 45, Worker Drone Platings 45); sequence stage 1 4 Reforged Metallic, 4 Reforged Dense, 3 Reforged Pliable, 3 Reforged Glowing Ingot, stage 2 2 Energizing Alloy and 2 Dampening Alloy, stage 3 1 Caustic Compound and 1 Stabilizing Compound, stage 4 speak to Rayne Cloud to choose the item. The page states no pack-access, favor, level or quest gate."

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Syranian_Forged_Weaponry"
read = "2026-11-04"
note = """
Pure step: no socket label. Each recipe makes one Syranian weapon from ingredients only, heroic or legendary. Added 2026-11-13 by the orchestrator from the reader's own rows, with no new read, under the reader brief's rule that a system with no socketed step gets one pure step named for what it does (amendment Revision 13e).

Page gives one total cost for every Syranian item and says heroic and legendary costs are the same; the data has one cost per grade across all 40 recipes and it equals the page. The Reforged ingots, alloys and compounds of the stages are intermediate crafts not in the data's cost."""

[[citation]]
url = "https://ddowiki.com/page/Rayne_Cloud"
read = "2026-11-04"
note = "Whole page read (NPC page, four lines of text and one photo): location and what she exchanges. It names no level, quest or favor gate."

[[citation]]
url = "https://ddowiki.com/page/Cannith_Melting_Station"
read = "2026-11-04"
note = "Whole page read. All 16 Melting Station recipes match the data's ingredient-making recipes (written in alchemical-crafting.toml as ingredient_recipe rows). Syranian stages (from the Syranian page): stage 1 is 4 Reforged Metallic, 4 Reforged Dense, 3 Reforged Pliable and 3 Reforged Glowing Ingot; stage 2 is 2 Energizing and 2 Dampening Alloy; stage 3 is 1 Caustic and 1 Stabilizing Compound. Summing the Melting page's recipes over those counts reproduces the system's total for Iron Defender Rivets 40, Magefire Cannon Parts 40, Worker Drone Platings 45 and Shield Guardian Gyroscopes 45, and for Worker Drone Actuators and Shield Guardian Cores 45 each only if the Reforged Glowing Ingot takes no Actuators or Cores. As printed, Reforged Glowing Ingot lists 5 Actuators and 5 Cores twice, which would make 75 each and leave Iron Defender Claws 30 and Magefire Cannon Cores 30 unexplained; see the verification request."

