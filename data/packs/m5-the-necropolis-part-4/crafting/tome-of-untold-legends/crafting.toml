[[citation]]
url = "https://ddowiki.com/page/Tome_of_Untold_Legends"
read = "2026-11-04"
note = "Whole page read: the Tome: Binding section, the numbered list of where each page drops most often, the Reward list (eight weapons, ML 14, Bound to Character on Acquire, 'Acquired: Tome of Untold Legends, Turn in completed Tome: Binding', all with a 1.5[W] multiplier), eight page sections (flavor text, Collector Bilk Howland, Located in Upper Necropolis, Commonly and Randomly drop locations). The page shows no 'Requires access to adventure pack' box, only the 'Litany of the Dead Part 4 item containers' navigation box (the Shield of Legend page does show the pack line). The page's two drop-location lists disagree for Legend II to V, VII and VIII (see the verification request). The Update 13 note says every Orchard of the Macabre chest that could drop Sigil Frame pieces, Tapestries, Tome pages or Shield fragments can now drop any of them."

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Tome_of_Untold_Legends"
read = "2026-11-04"
note = """
Pure step: no socket label. A completed Tome: Binding is turned in for one weapon of the player's choice.

'Turn in a completed Tome (8 pieces) to Bilk Howland and receive a weapon from the list.' One cost for all eight weapons; the survey rows match."""

