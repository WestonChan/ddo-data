[[citation]]
url = "https://ddowiki.com/page/Shield_of_Legend"
read = "2026-11-04"
note = "Whole page read: pack box ('Requires access to adventure pack: The Necropolis, Part 4'), Shield: Frame section, drop table of the 8 fragments, Reward List (seven shields, all ML 14 and Bound to Character on Acquire, 'Acquired: Shield of Legend, Turn in completed Shield: Frame'), the fragment sections (Uncommon, Collector Racella Unary, Located in Upper Necropolis, The Necropolis). Matches the data: 8 fragments and where each drops mainly, 7 shields, one Frame each. Screenshots: ShieldFrame_complete.jpg shows the 8-slot Frame; Shield_Fragment_One.png shows only the description. The page also lists 'Seal of the Black Abbot' as a bullet under the Reward List heading (see the verification request)."

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Shield_of_Legend"
read = "2026-11-04"
note = """
Pure step: no socket label. A completed Shield: Frame is turned in for one shield of the player's choice.

'Turn in a completed Shield: Frame (8 Fragments) to Racella Unary and receive a shield from the list.' One cost for all seven shields; the survey rows match."""

