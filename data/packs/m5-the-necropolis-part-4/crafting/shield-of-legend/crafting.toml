[[citation]]
field = "recipe"
url = "https://ddowiki.com/page/Shield_of_Legend"
read = "2026-11-04"
note = "The Frame is a container with unique item capacity 8: the eight different fragments are placed in it in order (positions 1 to 8, left to right); no station is involved. Racella Unary gives the empty Frame. The page does not call this a recipe. Fragments drop in most chests of all four Necropolis IV quests from Update 13 and in rare chests in the Orchard of the Macabre, mainly: One and Two in Desecrated Temple of Vol (Marut chest), Three and Four in Ghosts of Perdition (Undead wave chest), Five and Six in Flesh Maker's Laboratory (Golem wave chest), Seven and Eight in Inferno of the Damned (Locked Acolyte chest)."

