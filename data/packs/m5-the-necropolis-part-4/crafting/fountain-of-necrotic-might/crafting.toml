[[recipe]]
note = "Changes most earlier versions into the Update 12 upgradeable version; the new version is not necessarily better. An exclusive item is destroyed into an essence of the item in the ingredient bag, which must be placed back in the fountain to get the new version. Converting the old Quiver of Alacrity destroys any arrows or bolts in it. Adds the upgrade socket, which Maetrim models on the items already."
option = "Convert to the Update 12 upgradeable version"
tier = "heroic"

[[recipe.ingredient]]
ingredient = "Pre-Update 12 Ascension Chamber item"
quantity = 1

[[recipe.ingredient]]
ingredient = "Shred of Tapestry"
quantity = 5

[[recipe]]
note = "Upgrades Breeze (Quarterstaff; 1d10 damage, 19-20/x2 crit, Screaming, Roaring, Telekinetic, Slicing Winds, Dexterity bonus used for to hit and damage) in place: loses Telekinetic, gains Greater Telekinetic, Greater Sirocco. Introduced in Update 12. Maetrim holds the upgraded effects as an item-specific option on this socket, not in an augment family."
option = "Breeze upgrade"
slot = "crafting: upgradeable item"
tier = "heroic"

