[[citation]]
field = "step"
url = "https://ddowiki.com/page/Fountain_of_Necrotic_Might"
read = "2026-11-04"
note = """
Heroic Ascension Chamber upgrade with one Seal of the Black Abbot.

Same heroic upgrade; nine items. The page shows one upgrade kind for all thirteen items.

Update 23 epic Necropolis Part 4 items; the wiki writes it 'Upgradable - Primary/Secondary Augment' (see verification request).

As above.

Page: 'Place a seal and the named item in the Fountain'; plus the item x1. Same for all thirteen items; matches Maetrim's rows.

Plus one Update 23 epic Necropolis item. One recipe.

Breeze, Circle of Hatred, Enduring Conviction and Wretched Twilight are Ascension Chamber items upgraded here. The label is shared with Stormreaver Monument (Amulet of the Stormreaver, Cloudburst) and ToEE armor sockets; this verdict is for the Fountain only.

Nine Ascension Chamber items upgraded here; the label is used by the Fountain only.

Page: Update 23 epic items 'Upgradable - Primary/Secondary Augment' take an added augment slot for 120 Epic Tapestry Shreds (primary augment); slot colour follows the normal item-type rules (armor and accessories cannot get Orange, Red or Purple).

Same section: 120 Masterwork Tapestry Shreds (secondary augment)."""

[[citation]]
field = "recipe"
url = "https://ddowiki.com/page/Fountain_of_Necrotic_Might"
read = "2026-11-04"
note = "Most earlier versions of the items convert to the Update 12 upgradeable versions by inserting the item and 5 Shreds of Tapestry (matches Maetrim's x5). The new version is not always an upgrade over the old; exclusive items are destroyed and leave an 'essence' in the ingredient bag that must be re-inserted. Upgrading the Quiver of Alacrity from the old version destroys the ammunition inside; upgrading to the 30% striding version does not. Game bug: for items with clicky charges except Litany of the Dead and Purging the Pantheon, the altar claims more charges than are gained (the missing amount equals the base amount)."

[[recipe]]
note = """
Changes most earlier versions into the Update 12 upgradeable version; the new version is not necessarily better. An exclusive item is destroyed into an essence of the item in the ingredient bag, which must be placed back in the fountain to get the new version. Converting the old Quiver of Alacrity destroys any arrows or bolts in it. Adds the upgrade socket.

Most earlier versions of the items convert to the Update 12 upgradeable versions by inserting the item and 5 Shreds of Tapestry. The new version is not always an upgrade over the old; exclusive items are destroyed and leave an 'essence' in the ingredient bag that must be re-inserted. Upgrading the Quiver of Alacrity from the old version destroys the ammunition inside; upgrading to the 30% striding version does not. Game bug: for items with clicky charges except Litany of the Dead and Purging the Pantheon, the altar claims more charges than are gained (the missing amount equals the base amount)."""
