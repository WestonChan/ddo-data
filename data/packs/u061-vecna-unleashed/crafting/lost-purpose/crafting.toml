[[citation]]
url = "https://ddowiki.com/page/Lost_Purpose"
read = "2026-11-04"
note = "Whole page read: intro, manual quote, location, the Heroic and Legendary recipe lists, the Lost Purpose effect text and the list of 44 items. Every recipe matches the data (11 heroic Awaken Set Bonus options at 10 Esoteric Relics, 11 Legendary at 20 Legendary Esoteric Relics), and the 44 items listed are exactly the 44 items the data gives the 'crafting: lost purpose' slot (20 Legendary University items, 20 University items, 4 Page Regalia items). The page shows no 'Requires access to adventure pack' box and states no pack, level, favor or quest gate; it only says the device came in Update 61 with the Vecna Unleashed expansion (the data's pack). It does not say where Esoteric Relics come from (the Esoteric Table page and the data give Vecna Unleashed end chests for the Legendary one). The 'Level 18+' nav grouping is the wiki's own."

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Lost_Purpose"
read = "2026-11-04"
note = """
Heroic and Legendary options are separate recipes (the Legendary ones read 'Awaken Set Bonus: Legendary <set>'). Choosing again erases the previous set bonus.

Page: '(requires 10 Esoteric Relics)' over all 11 heroic options.

Page: '(requires 20 Legendary Esoteric Relics)' over all 11 Legendary options.

Page section 'Lost Purpose': the item effect 'This item is missing some parts that made it unique' marks the slot, and the station awakens one of the Vecna Unleashed set bonuses; both heroic and legendary items use it."""

