[[citation]]
url = "https://ddowiki.com/page/Esoteric_Table"
read = "2026-11-04"
note = """
Whole page read: intro, ingredients, the Tier 1 table (2 upgrades, one shared cost) and the Tier 2 table (3 upgrades). All 5 recipes and their costs match the data. The page states: the table is in the entrance of the quest Fire Over Morgrave (Morgrave University - Upper Commons), usable before the raid starts or after it is completed, locked during the fight; speak to Geth to enter the raid and 'you must be at least level 20'; it upgrades legendary weapons and shields from Vecna Unleashed quests including the Fire Over Morgrave raid loot; dev comments say it is meant to work with certain shields but the shield recipes are not shown and are unknown (Legendary Defiled shields are not affected). It states no pack, favor or feat gate; the 'Level 32' nav grouping is the wiki's own.

The only station the page names. The shield recipes are unknown."""

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Esoteric_Table"
read = "2026-11-04"
note = """
Both Tier 1 upgrades add Leashed Power (Tier 2) and Warp Souls (-1 Will, AC, Fortification, stacks 10 times). Warp the Unholy removes Taint of Evil, Warp the Seared removes Planar Searing; the data gives both recipes the 'planar searing' label.

Each Unleash upgrade removes the other two Unleashed effects. Shield recipes are not shown on the table.

One cost cell over both Tier 1 rows.

Common part of all three Unleash upgrades. Each recipe adds 12 of one more dust of its own: Unleash the Fire = Legendary Black Dust of Vile Darkness, Unleash the Lightning = Legendary Gray Dust, Unleash the Resistance = Legendary Crimson Dust.

Page section 'Tier 1': the two upgrades remove Planar Searing (raid weapons) or Taint of Evil (Defiled weapons) and add Leashed Power (Tier 2) and Warp Souls. The slot is the one the Fire Over Morgrave weapons start with (Planar Searing).

Page section 'Tier 2': the three Unleash upgrades replace Leashed Power (Tier 2) with Unleashed Inferno, Storm or Resistance."""

[[citation]]
field = "unlock"
url = "https://ddowiki.com/page/Esoteric_Table"
