[[citation]]
url = "https://ddowiki.com/page/Unholy_Defiler_of_the_Hidden_Hand"
read = "2026-11-04"
note = "Whole page read: intro (Update 61, Vecna Unleashed; location; Steps' Lenses), the four Dust of Vile Darkness drop notes, the Heroic and Legendary recipe tables, the Esoteric Table follow-on. Matches the data: heroic 6 of each of the four dusts, legendary 12 of each Legendary dust, one base item per recipe; the 16 recipe rows (5 heroic, 11 legendary; the weapon row stands for 50 weapons each tier). Dust drop places match the data. Page quirk: the Legendary Defiled Azure Tower row names Defiled Azure Tower (not Legendary Azure Tower) as its base item. No level, favor or pack gate is stated (the Level 18+ box is the wiki's navigation grouping); no screenshot."

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Unholy_Defiler_of_the_Hidden_Hand"
read = "2026-11-04"
note = """
Pure step: no socket label. Each recipe converts a base Vecna Unleashed item into its Defiled version, costing the base item plus all four dusts.

All five heroic rows. Plus the base item per recipe (Shining Reliquary <Weapon>, Azure Buckler, Azure Targe, Azure Rotella, Azure Tower), which stays on the recipe: 'Along with a copy of an item from Vecna Unleashed, all upgrades require all four types of Dust'. The survey rows match.

All eleven legendary rows. Plus the base item per recipe, kept on the recipe (see the verification request for the Azure Tower base). The survey rows match."""

[[citation]]
field = "recipe"
url = "https://ddowiki.com/page/Unholy_Defiler_of_the_Hidden_Hand"
read = "2026-11-04"
note = """
The page names Defiled Azure Tower (the heroic item, link Item:Defiled_Azure_Tower) as this recipe's base item, where every other legendary row names the Legendary version.

Legendary weapons can be further upgraded at the Esoteric Table in Fire Over Morgrave to a 'Truly Vile Weapon': this removes Taint of Evil (and adds Warp Souls).

The page names Defiled Azure Tower (the heroic item, link Item:Defiled_Azure_Tower) as this recipe's base item, where every other legendary row names the Legendary version; the pattern suggests Legendary Azure Tower."""

[[citation]]
url = "https://ddowiki.com/page/Defiled_Reliquary_Weaponry"
read = "2026-11-04"
note = "Whole page read: the series released with Update 61, 'they never drop in the wild - players can instead create them by converting Shining Reliquary Weaponry at the Unholy Defiler of the Hidden Hand'; Heroic (ML18) and Legendary (ML32); all Bound to Account on Acquire; the list of 50 weapons (40 plus ten sceptres), each with a Legendary Variant. The 50 heroic names match the data's 50 heroic outputs."

