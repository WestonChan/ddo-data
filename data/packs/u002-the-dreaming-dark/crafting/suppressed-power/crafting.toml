[[station]]
name = "Dreamforge"
note = """
Combines Dreaming Dark essences into Crystal Shards and Discs of Dreams, and spends a Disc to remove an item's Suppressed Power; its list interface previews the upgrades

Makes Essence of Horrors.

Makes Essence of Nightmares.

Makes Essence of Phantasms.

Makes Essence of Torments.

Makes Crystal Shard of Dreams.

Makes Crystal Disc of Dreams (from essences).

Makes Crystal Disc of Dreams (from shards).

Makes Crystal Disc of Dreams (purchase)."""

