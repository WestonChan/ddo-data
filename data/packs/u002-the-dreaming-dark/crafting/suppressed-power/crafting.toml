note = "Whole page read: overview (crafting station at the end of The Dreaming Dark; the quest must be completed each time to access it), essences/shards/discs and where the essences drop, the 9-row combinations table, Ioun Stone upgrades (10 rows), The Mindsunder item upgrades (9 rows), The Reaver's Fate upgrade (Dreamspitter), and two developer quotes. Essence sources: Eye of the Titan (Horrors, Nightmares), Reclaiming Memories (Horrors, Phantasms), Raiding the Giants' Vault (Horrors, Torments), Mining for Ancient Secrets (Horrors, Torments). Not stated: level, favor, pack or feat gate; the quantity of the Ioun Stone (taken as 1)."

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Dreamforge"
read = "2026-11-04"
note = """
Pure step: merging an Ioun Stone with a Crystal Disc of Dreams. The page says to drag the stone onto the Dreamforge crafting menu. Pale Green Ioun Stone is not upgradeable; old Pale Lavender stones without the 'Suppressed Power' effect still upgrade, other old types do not.

Nine Mindsunder items and Dreamspitter from The Reaver's Fate raid; each upgrade is done in place on an item that carries the Suppressed Power enchantment.

Page: 'Ioun stones can be upgraded by merging with a Crystal Disc of Dreams'; combinations row 'Upgraded item = an item with Suppressed Power + Crystal Disc of Dreams'. The stone itself differs per recipe and stays on the recipe.

Same combination row (an item with Suppressed Power + Crystal Disc of Dreams) for the nine Mindsunder items and Dreamspitter; the item stays on the recipe.

The Mindsunder and The Reaver's Fate upgrade tables list the items with a 'Suppressed Power' enchantment and the upgrade removes it in place (Upgraded Items become Bound to Character on Acquire). The page's intro describes the attribute as 'Suppressed Power'. Step name is the wiki's wording; the in-game socket text was not seen."""

