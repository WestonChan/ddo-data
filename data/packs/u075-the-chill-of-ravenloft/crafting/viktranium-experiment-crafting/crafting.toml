[[station]]
name = "Viktranium Experiment crafting workbench"
note = "Makes the Heroic and Legendary Lamordia augments (Melancholic, Dolorous, Miserable and Woeful, weapon, accessory and armor variants) and the Heroic and Legendary Calamitous weapons. Heroic and Legendary recipes are on separate workbenches."

[[station]]
name = "Wicked Viktranium Experiment Crafting workbench"
note = "Makes the Legendary-only Wicked augments (12 Miserable weapon, 3 Miserable accessory, 10 Woeful weapon, 14 Woeful accessory) and the Legendary Cataclysmic weapons and shields. Crafting can be done before the raid starts without activating monsters."
variant = "Relentless raid entrance"

[[station]]
name = "Wicked Viktranium Experiment Crafting workbench"
note = "The same Wicked recipes as the raid entrance device."
variant = "Ludendorf Wax Museum"

