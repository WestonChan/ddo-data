[[citation]]
url = "https://ddowiki.com/page/Viktranium_Experiment_crafting"
read = "2026-11-04"
note = "Whole page read: intro, ingredients, crafting prose, every one of the 14 recipe tables (10 main-workbench, 4 Wicked) and the Cataclysmic section. Typed text only (the only images are the Wicked device and its location). Recipe counts per step match the survey: Melancholic weapon 7/7 (heroic/legendary), Dolorous weapon 15/17, Miserable weapon 23/23 plus 12 Wicked legendary, Woeful weapon 6 plus 10 Wicked (legendary only), Melancholic accessory 19/19, Dolorous accessory 26/26, Miserable accessory 17/17 plus 3 Wicked, Woeful accessory 7 heroic and 7 plus 14 Wicked legendary, Melancholic armor 4/4, Dolorous armor 3/3. Every option name and cost matches the data; the Heroic Dolorous 'Dreadful' bug (Flames, Chill, Sparks, Acid, Focus) is on the page as the data notes. The Wicked Woeful weapon list says '50 Bleak Mementos' (the accessory list says Legendary Bleak Mementos); read as Legendary Bleak Memento, since Woeful augments are Legendary-only. The page states the pack requirement and no level, favor or feat gate (ML 8 and ML 34 are the augments' and items' own levels). Sun and Moon Augment Slots are mentioned only as standard colours that replace the Dinosaur Bone Set Bonus slot on these items; no verdict is needed. Unslotting with a Viktranium Pick is not a crafting step."

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Viktranium_Experiment_crafting"
read = "2026-11-04"
note = """
Pure step: crafting a Calamitous or Cataclysmic weapon, which has no socket label. Each option makes weapons of any type, and the Cataclysmic option also makes shields.

Heroic and Legendary versions of an augment are separate recipes of the same option name (Dolorous Dimlight and Shadows, every Woeful weapon augment and the Wicked ones are Legendary only).

One recipe (Heroic Calamitous weapon): 5 each of Bleak Alternator, Conductor, Insulator and Resistor (page crafting prose).

Common part: 25 each of the four Legendary materials, for both Legendary options. The Legendary Cataclysmic weapon or shield (Wicked workbench) also costs 25 Legendary Bleak Memento on the recipe itself; the Memento drops only from chests in the raid Relentless; shields cost the same as weapons (page).

'Heroic versions cost' line over all 7 augments.

'Legendary versions cost' line over all 7 augments.

Line over all 15 Heroic augments (Dolorous Dimlight and Shadows have no Heroic version).

Line over all 17 Legendary augments.

Line over all 23 Heroic augments.

Common part: 25 each of the four Legendary materials. Each recipe adds its own extra: the 23 main-workbench augments 100 Legendary Bleak Wire, the 12 Wicked augments (Metalline, Planar and the ten Spell Crit Chance augments) 50 Legendary Bleak Transformer instead.

Common part: 50 each of the four Legendary materials. Each recipe adds its own extra: the 6 main-workbench elemental augments (Flames, Chill, Sparks, Acid, Dimlight, Shadows) 50 Legendary Bleak Transformer, the 10 Wicked augments 50 Legendary Bleak Memento instead. There is no Heroic Woeful weapon augment (page).

Line over all 19 augments.

Line over all 26 augments.

Line over all 17 Heroic augments.

Common part: 25 each of the four Legendary materials. Each recipe adds its own extra: the 17 main-workbench augments 100 Legendary Bleak Wire, the 3 Wicked augments (Legendary Armor Piercing, Force Absorption, Rebellion) 50 Legendary Bleak Transformer instead.

Line over all 7 Heroic augments.

Common part: 50 each of the four Legendary materials. Each recipe adds its own extra: the 7 main-workbench augments 50 Legendary Bleak Transformer, the 14 Wicked augments 50 Legendary Bleak Memento instead (those are Bound to Character on Acquire, page warning).

Line over all 4 augments.

Line over all 3 augments.

Page section 'Dolorous (accessory)' (Dolorous): a Lamordia augment of this type fits only a slot of exactly this type; the game's tooltip row 'Augment Type' carries the type (page prose).

Page section 'Dolorous (armor)' (Dolorous): a Lamordia augment of this type fits only a slot of exactly this type; the game's tooltip row 'Augment Type' carries the type (page prose).

Page section 'Dolorous (weapon)' (Dolorous): a Lamordia augment of this type fits only a slot of exactly this type; the game's tooltip row 'Augment Type' carries the type (page prose).

Page section 'Melancholic (accessory)' (Melancholic): a Lamordia augment of this type fits only a slot of exactly this type; the game's tooltip row 'Augment Type' carries the type (page prose).

Page section 'Melancholic (armor)' (Melancholic): a Lamordia augment of this type fits only a slot of exactly this type; the game's tooltip row 'Augment Type' carries the type (page prose).

Page section 'Melancholic (weapon)' (Melancholic): a Lamordia augment of this type fits only a slot of exactly this type; the game's tooltip row 'Augment Type' carries the type (page prose).

Page section 'Miserable (accessory)' (Miserable): a Lamordia augment of this type fits only a slot of exactly this type; the game's tooltip row 'Augment Type' carries the type (page prose).

Page section 'Miserable (weapon)' (Miserable): a Lamordia augment of this type fits only a slot of exactly this type; the game's tooltip row 'Augment Type' carries the type (page prose).

Page section 'Woeful (accessory)' (Woeful): a Lamordia augment of this type fits only a slot of exactly this type; the game's tooltip row 'Augment Type' carries the type (page prose).

Page section 'Woeful (weapon)' (Woeful): a Lamordia augment of this type fits only a slot of exactly this type; the game's tooltip row 'Augment Type' carries the type (page prose)."""

[[citation]]
field = "recipe"
url = "https://ddowiki.com/page/Viktranium_Experiment_crafting"
read = "2026-11-04"
note = "Creates an ML8 Calamitous weapon: +4 Enhancement Bonus and 1[W], Vampirism 1 (the Calamitous Sceptre has Quality Mystic Diversion +1% instead), Melancholic, Dolorous and Miserable weapon slots and a Red Augment Slot (thrown weapons also gain Returning). Bound to Account on Acquire, cannot have Mythic bonuses. Cost 5 each of Bleak Alternator, Conductor, Insulator and Resistor."

[[citation]]
field = "recipe"
url = "https://ddowiki.com/page/Calamitous_Weaponry"
read = "2026-11-04"
note = "Creates an ML34 Calamitous weapon: +15 Enhancement Bonus, 5.8[W] with +2 (one-handed) or +4 (two-handed) loaded weapon dice, Melancholic, Dolorous, Miserable and Woeful weapon slots plus Orange and Purple Augment Slots (thrown weapons also gain Returning). No standard enchantment, so the Legendary Calamitous Sceptre equals the Legendary Calamitous Club. Bound to Account on Acquire, no Mythic bonuses. Cost 25 each of the four Legendary Bleak materials."

[[citation]]
field = "recipe"
url = "https://ddowiki.com/page/Cataclysmic_Weaponry"
read = "2026-11-04"
note = """
Crafted at the Wicked workbench (raid Relentless or Ludendorf Wax Museum). Same slots as Legendary Calamitous (Melancholic, Dolorous, Miserable and Woeful weapon, Orange and Purple) and +15 Enhancement Bonus, 5.8[W], but +3 (one-handed) or +6 (two-handed) loaded weapon dice; shields: Buckler +6 loaded dice and +0.2[W] (6[W] total), Small and Large Shield +8 loaded damage dice, Tower Shield +10. Weapons are Bound to Character on Acquire, shields Bound to Account on Acquire (Viktranium page); the Cataclysmic page gives no shield binding. Cost 25 each of the four Legendary Bleak materials plus 25 Legendary Bleak Memento. Crafted ones cannot have Mythic bonuses; chest-looted ones may.

The bindings are from the Viktranium Experiment crafting page; the Cataclysmic Weaponry page gives no shield binding."""

