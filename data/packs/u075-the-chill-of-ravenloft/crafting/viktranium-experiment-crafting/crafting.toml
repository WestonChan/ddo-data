[[citation]]
url = "https://ddowiki.com/page/Cataclysmic_Weaponry"
read = "2026-11-04"
note = "Whole page read: 40 Legendary Cataclysmic weapons, the Burning Sceptre and 4 shields (45 items). Crafted at the Wicked Viktranium Experiment Crafting workbench in the raid Relentless or the Wax Museum in Lamordia (25 each of the four Legendary Bleak materials plus 25 Bleak Mementos, which drop only from chests in Relentless); also found pre-crafted as loot from Relentless; Bound to Character on Acquire, and chest-looted ones may have Mythic bonuses. Typed only. Note the page's own spellings 'Bleak Momentos' and 'Bleak Mementos'."

