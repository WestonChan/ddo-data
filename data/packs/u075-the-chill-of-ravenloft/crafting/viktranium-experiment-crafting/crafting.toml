[[recipe]]
note = """
Wicked Viktranium Experiment device in Relentless: creates a Cataclysmic weapon (Bound to Character on Acquire) or shield (Bound to Account on Acquire), a Calamitous weapon with +3/+6 loaded weapon dice; no augment counterpart.

Crafted at the Wicked workbench (raid Relentless or Ludendorf Wax Museum). Same slots as Legendary Calamitous (Melancholic, Dolorous, Miserable and Woeful weapon, Orange and Purple) and +15 Enhancement Bonus, 5.8[W], but +3 (one-handed) or +6 (two-handed) loaded weapon dice; shields: Buckler +6 loaded dice and +0.2[W] (6[W] total), Small and Large Shield +8 loaded damage dice, Tower Shield +10. Weapons are Bound to Character on Acquire, shields Bound to Account on Acquire. Cost 25 each of the four Legendary Bleak materials plus 25 Legendary Bleak Memento. Crafted ones cannot have Mythic bonuses; chest-looted ones may."""
option = "Legendary Cataclysmic weapon or shield"
tier = "legendary"
step = "Weapon creation"

[[recipe.ingredient]]
ingredient = "Legendary Bleak Memento"
quantity = 25
