name = "Soulforge"
page = "https://ddowiki.com/page/Soulforge"

[[station]]
name = "Soulforge"
note = "Transforms a raid item (with Thread of Fate and an Empty Soul Vessel) into a Bound to Account level 30 essence augment"

[[step]]
name = "Essence augment"

[[step.cost]]
tier = "legendary"
ingredient = "Thread of Fate"
quantity = 50

[[step.cost]]
tier = "legendary"
ingredient = "Empty Soul Vessel"
quantity = 1

[[family]]
family = "Named"

[[citation]]
url = "https://ddowiki.com/page/Soulforge"
read = "2026-11-04"
note = "Whole page read: the device is in the Eberron Hall of Heroes (lower level, first room, south-west corner) and is used to purchase essence augments; a raid item is transformed into a Bound to Account level 30 augment; the 13-row table (Essence Augment, Color, ML, Items to Consume, Essence bonus effect, item drop sites; the Constellation row names two ways to pay). Not stated: any level, favor, pack, quest or feat gate."

[[citation]]
field = "pack"
url = "https://ddowiki.com/page/Hall_of_Heroes"
read = "2026-11-12"
note = "The Soulforge altar is in the lower level of the Eberron Hall of Heroes (listed on the Hall of Heroes page). That page says everyone can enter the Halls of Heroes, which provide basic amenities to all characters; the Soulforge page names no pack. The augments it makes come from raid items (not enumerated here)."

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Soulforge"
read = "2026-11-04"
note = """
Pure step: each row consumes one raid item (the Constellation row consumes two) plus Thread of Fate and an Empty Soul Vessel and yields a level 30 essence augment.

Items to Consume column on all 13 rows: 'Thread of Fate x 50' and 'Empty Soul Vessel' (no count shown, taken as 1), plus the raid item(s), which differ per recipe and stay on the recipe. The page does not label the grade; the raid items are the legendary versions."""

[[citation]]
field = "recipe"
url = "https://ddowiki.com/page/Soulforge"
read = "2026-11-04"
note = """
Pays either with both The Broken Blade of Constellation and The Shattered Hilt of Constellation, or with Constellation, Cursed Blade alone, plus Thread of Fate x 50 and an Empty Soul Vessel.

Yellow augment, ML 30, Bound to Account; slotted effect Invisibility Guard. Item drop site named on the page: Old Baba's Hut.

Yellow augment, ML 30, Bound to Account; slotted effect Nullmagic Guard. Item drop site named on the page: Killing Time.

Colorless augment, ML 30, Bound to Account; slotted effect Litany of the Dead II - Ability Bonus. Item drop site named on the page: Mark of Death.

Orange augment, ML 30, Bound to Account; slotted effect Improved Destruction. Item drop site named on the page: Too Hot to Handle.

Blue augment, ML 30, Bound to Account; slotted effect Soundproof. Item drop site named on the page: The Curse of Strahd.

Purple augment, ML 30, Bound to Account; slotted effect Improved Quelling Strikes. Item drop site named on the page: Riding the Storm Out.

Yellow augment, ML 30, Bound to Account; slotted effect Alchemical Conservation. Item drop site named on the page: Project Nemesis.

Yellow augment, ML 30, Bound to Account; slotted effect Occultation. Item drop site named on the page: Temple of the Deathwyrm.

Orange augment, ML 30, Bound to Account; slotted effect Touch of the Mournlands. Item drop site named on the page: Legendary Lord of Blades.

Blue augment, ML 30, Bound to Account; slotted effect Healers Bounty. Item drop site named on the page: Legendary Vision of Destruction.

Green augment, ML 30, Bound to Account; slotted effect Petrification Immunity. Item drop site named on the page: Defiler of the Just.

Green augment, ML 30, Bound to Account; slotted effect Runic Revitalization. Item drop site named on the page: Fire on Thunder Peak.

Green augment, ML 30, Bound to Account; slotted effect Insightful Spell Lore V. Item drop site named on the page: Hunt or Be Hunted."""

