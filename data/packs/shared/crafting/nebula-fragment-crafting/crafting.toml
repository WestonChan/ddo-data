[[citation]]
url = "https://ddowiki.com/page/Item:Nebula_Fragment"
read = "2026-11-04"
note = "Whole page read: examination panel, the Lahar process (Nebula Fragment -> quest and Star Fragments: Frame -> 8 Shards of Power -> Perfected Crafting interface), what the upgrade consumes (Legendary base item, Nebula Fragment, 500 Threads of Fate, 250 pack-specific components), the eight packs needed, and the table of the 15 Perfected items (ML 30, all Bound to Character on Acquire, four also Exclusive, Acquired: 'Lahar, Turn in Nebula Fragment', up to 4 filigree slots). Screenshots: Nebula_Fragment.png shows Bound To Account, Binds to Account on Acquire, base value 100; Star_Fragments_Frame.png (empty frame) shows Bound To Account, Binds to Account on Acquire, Unique item capacity 0 / 8; Star_Fragments_Frame_Completed.jpg shows 'Bound to Account (from Acquisition)', capacity 8 / 8, base value 800. The page does not say which pack-specific component each Perfected item takes; it states only '250 pack-specific components'. No level is stated in the body."

[[citation]]
field = "pack"
url = "https://ddowiki.com/page/Item:Nebula_Fragment"
read = "2026-11-12"
note = "The Item:Nebula_Fragment page (read 2026-11-04) says all eight locations where Shards of Power drop must be reachable, only one being free, so several adventure packs or expansions are all needed. The earlier rows name six: Sentinels of Stormreach, The Red Fens, Devil Assault, Vault of Night, Phiarlan Carnival and Sinister Secret of Saltmarsh. The Lahar station is in The Twelve."

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Item:Nebula_Fragment"
read = "2026-11-04"
note = """
Pure step: no socket label. Lahar's 'Perfected Crafting interface' upgrades a Legendary item into the Perfected minor artifact.

'This consumes: Legendary base item / Nebula Fragment / 500 Threads of Fate / 250 pack-specific components'. The shared part is 1 Nebula Fragment and 500 Threads of Fate (the page writes 'Threads of Fate'). Each recipe adds its Legendary base item (an item cost, x1) and 250 of one pack-specific component; the survey rows give each recipe a component the page does not name per item (see not stated). The survey rows otherwise match."""

[[citation]]
field = "recipe"
url = "https://ddowiki.com/page/Item:Nebula_Fragment"
read = "2026-11-04"
note = "Side effects of every Perfected item: it is a Minor Artifact (cannot be equipped if another is worn); as a new item it does not inherit Mythic or Reaper bonuses, or Deck of Many Curses effects, from the item it was made from; up to 4 filigree slots."

[[citation]]
field = "unlock"
url = "https://ddowiki.com/page/Item:Nebula_Fragment"
read = "2026-11-04"
note = """
Page: 'you must have access to all eight locations in which Shards of Power drop, only one of which is free to access - you will need to own the following adventure packs/expansions'. Every shard except the Red Shard can be reached with a VIP account; a Guest Pass allows temporary access.

Written as other because the survey has no adventure pack named 'Sands of Menechtarun'; the survey links the quest 'Sands of Menechtarun' to the pack 'Demon Sands'. Not guessed: unresolved, for the maintainer.

Written as other because the survey has no adventure pack named 'Web of Chaos'; the survey links the quest 'The Spinner of Shadows' to the pack 'Free to Play'. Not guessed: unresolved, for the maintainer."""

[[citation]]
url = "https://ddowiki.com/page/Lahar"
read = "2026-11-04"
note = "Whole page read: Lahar <Epic Vendor>, Earth Elemental, 'The Twelve, southwest of the tower-end of the bridge, near the Altar of Epic Rituals'; the Nebula Fragment paragraph ('If you have a Nebula Fragment, Lahar will bestow a quest on you ... the fragment must be in your inventory, not in a bag'). Only a photo of the NPC (Lahar.jpg), no screenshot of the Perfected interface."

[[recipe]]
note = """
Upgrades the Legendary Jidz-Tet'ka into Perfected Jidz-Tet'ka (Bracers), a minor artifact at ML 30 with up to 4 filigree slots. The Frame must be in the inventory and is not consumed. As a new item it inherits no Mythic, Reaper or Deck of Many Curses effects, and cannot be equipped alongside another minor artifact. Uses Sentinels of Stormreach components per the Epic Crafting pack table. A separate item in Maetrim's data; no augment counterpart.

Side effects of every Perfected item: it is a Minor Artifact (cannot be equipped if another is worn); as a new item it does not inherit Mythic or Reaper bonuses, or Deck of Many Curses effects, from the item it was made from; up to 4 filigree slots."""
