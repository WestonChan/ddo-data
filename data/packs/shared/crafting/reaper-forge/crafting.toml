[[citation]]
url = "https://ddowiki.com/page/Reaper_Forge"
read = "2026-11-04"
note = "Whole page read. Typed text for every recipe and gate. The forge UI screenshot (Reaper_forge.png) shows the Fragment of Reaper Power deconstruct list only; Item_with_reaper_helmet_enchantment.png was not opened. No gate for reaching the forge beyond talking to Raven Queen Augur; no level or pack gate is stated (the Level 1+ navbox heading is a category list, not a gate). The page lists no output items."

[[citation]]
field = "pack"
url = "https://ddowiki.com/page/Hall_of_Heroes"
read = "2026-11-12"
note = "The Reaper Forge is in the Eberron Hall of Heroes. The Hall of Heroes page says everyone can enter the Halls of Heroes, which provide basic amenities to all characters; the Reaper Forge page names no pack."

[[citation]]
