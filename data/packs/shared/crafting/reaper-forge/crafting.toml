note = """
Page: any slot-specific bonus costs 75 fragments; checked against all 1 recipe(s) at the step

Page: any slot-specific bonus costs 75 fragments; checked against all 4 recipe(s) at the step

Four options (1) to (4) at one socket; the page says all four are called Reaper Ring Boost in game"""

[[citation]]
field = "recipe"
url = "https://ddowiki.com/page/Reaper_Forge"
read = "2026-11-04"
note = "Input is one item carrying a reaper bonus (not an ingredient row); yields 1 fragment for a generic bonus, 1 or 5 for a slot-specific one (choose 5). No Reaper Experience needed. ML1-2 items and wands and throwing weapons cannot be deconstructed."

[[citation]]
field = "unlock"
url = "https://ddowiki.com/page/Reaper_Forge"
read = "2026-11-04"

[[recipe]]
note = """
All recipe facts are on this page. Destroying an item with a reaper bonus yields Fragments of Reaper Power: 1 for a generic bonus, 1 or 5 for a slot-specific one (choose 5). Needs no Reaper Experience; ML1-2 items, wands and throwing weapons cannot be deconstructed. The generic bonuses (+3 Reaper Bonus to Melee, Ranged and Spell Power; +3 PRR; +3 MRR) appear on any named item from Reaper chests and cannot be crafted, so Maetrim's +3 Melee/Ranged and Spell Power, +3 PRR and +3 MRR augments have no recipe here.

At the Reaper Forge."""
option = "Deconstruct a reaper-bonus item"
tier = "any"

[[recipe]]
note = "+1 Reaper Bonus to attack and +1 to Spell Penetration. Imprinted on an item of the matching slot with no existing reaper bonus; needs 2,500,000 Reaper Experience (50 Reaper Points)."
