name = "Reaper Forge"
npc = "Raven Queen Augur, Eberron Hall of Heroes (introduced in Update 52)"
page = "https://ddowiki.com/page/Reaper_Forge"

[[family]]
family = "Reaper"

[[ingredient]]
name = "Fragment of Reaper Power"
drop_location = "Deconstructing items with reaper bonuses at the Reaper Forge; reaper bonuses appear on about 5% of eligible named chest loot on Reaper difficulty"
tier = "any"

[[citation]]
url = "https://ddowiki.com/page/Reaper_Forge"
read = "2026-09-29"

[[recipe]]
note = "All recipe facts are on this page. Destroying an item with a reaper bonus yields Fragments of Reaper Power: 1 for a generic bonus, 1 or 5 for a slot-specific one (choose 5). Needs no Reaper Experience; ML1-2 items, wands and throwing weapons cannot be deconstructed. The generic bonuses (+3 Reaper Bonus to Melee, Ranged and Spell Power; +3 PRR; +3 MRR) appear on any named item from Reaper chests and cannot be crafted, so Maetrim's +3 Melee/Ranged and Spell Power, +3 PRR and +3 MRR augments have no recipe here."
option = "Deconstruct a reaper-bonus item"
tier = "any"

[[recipe]]
note = "+1 Reaper Bonus to attack and +1 to Spell Penetration. Imprinted on an item of the matching slot with no existing reaper bonus; needs 2,500,000 Reaper Experience (50 Reaper Points)."
option = "Reaper Goggles Enchantment"
slot = "crafting: reaper goggles"
tier = "any"

[[recipe.augment]]
name = "+1 Attack and Spell Penetration"
level = 1

[[recipe.ingredient]]
ingredient = "Fragment of Reaper Power"
quantity = 75

