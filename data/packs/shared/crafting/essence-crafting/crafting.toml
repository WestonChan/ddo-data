[[citation]]
url = "https://ddowiki.com/page/Essence_Crafting"
read = "2026-11-12"
note = """
The wiki page is titled Essence Crafting and the address Cannith_Crafting redirects to it ('Redirected from Cannith Crafting'); the system was introduced under the name Cannith Crafting in Update 9 and renamed Essence Crafting in Update 79, and the page says older guides still call it Cannith Crafting. It lets players build fully customized weapons, shields, armor, jewelry and clothing: disjunct an item, craft a Minimum Level shard, craft effect shards, then apply the shards at an item crafting device. The page states no free-to-play, adventure pack, level, favor or quest requirement for using it, so there is no system-level unlock row (not stated, which is not the same as no requirement). Not gates: the Essence Crafting Tutorial (Fabricators Guild Tutorial) is offered with a reward but the page does not require it, and 50 House Cannith Favor is only said to make some crafting experience elixirs and success boosters buyable. Recipes, essences, shards, crafting levels and enchantments are not recorded here (ddo-data#71).

Read: History, Locations (four halls), Steps (the devices), Components, Crafting Experience and its leveling tips; a keyword search of the rest of the page found no free-to-play, pack, level or favor requirement for access. The only image is a picture of the House Kundarak Crafting Hall; no in-game screenshot shows a fact recorded here. Recipe, collectable and enchantment tables not read (ddo-data#71)."""

[[citation]]
field = "pack"
url = "https://ddowiki.com/page/Eveningstar"
read = "2026-11-12"
note = "Its devices stand in the public Crafting Halls of House Kundarak Enclave, House Cannith Enclave and Eveningstar and in the Guild Airship's Cannith Crafting Hall amenity (guild level 41). The Essence Crafting page names no pack, and the Eveningstar page describes reaching Eveningstar by routes that need no pack (Hall of Heroes passport, a key from Purple Dragon Knights favor, Gatekeeper's Grove portals)."

