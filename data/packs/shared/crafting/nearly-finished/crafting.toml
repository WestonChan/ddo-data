[[citation]]
url = "https://ddowiki.com/page/Nearly_Finished"
read = "2026-11-04"
note = "Whole page read: Quest Items Upgrade table (heroic and epic columns; the epic column is the Legendary version), Raid Items Upgrade table, The Soul Splitter table, Set bonuses (Secrets of the Artificers pack). Costs of every table row match the survey recipes: quest rows cost either the Energizing group (Energizing Alloy, Reforged Pliable Ingot, Reforged Metallic Ingot, Caustic Compound) or the Dampening group (Dampening Alloy, Reforged Glowing Ingot, Reforged Dense Ingot, Stabilizing Compound), one each; raid rows cost an alloy, Caustic Compound, Stabilizing Compound and Threads of Fate. No in-game screenshot on the page. No level, favor, quest, pack or feat gate is stated in the page body (the Level 15+ box is the wiki's navigation grouping). The page gives no tier for the raid items and no cost for the four set-bonus pairs; the Reforging Station page gives the set-bonus cost. The page notes that most effect values, especially heroic, need verification."

[[citation]]
field = "pack"
url = "https://ddowiki.com/page/Artificer_Workshops"
read = "2026-11-12"
note = "The Cannith Reforging Station that unlocks Nearly Finished set bonuses stands in the Artificer Workshops (the page says 'Requires access to adventure pack: Secrets of the Artificers') and in Sharn - Cliffside Docks District (that page names no pack), so the station alone does not gate it. The Nearly Finished page's tables upgrade items from many packs' quests and raids and give the Secrets of the Artificers set bonuses."

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Nearly_Finished"
read = "2026-11-04"
note = """
Quest items, raid items and the four set-bonus pairs; applying a recipe removes Nearly Finished. Raid weapons also gain a Purple Augment Slot (The Eclipse Itself adds an Orange one too) and Almost There.

Quest item Collective Sight (a second effect after Nearly Finished) and the raid items' second stage; the raid recipes add Finishing Touch.

Final raid stage: the weapon becomes a Completed Weapon, or The Eclipse Itself adds a spell focus.

Two groups, by item: the Energizing group (Energizing Alloy, Reforged Pliable Ingot, Reforged Metallic Ingot, Caustic Compound; Resplendant Fury, Black Satin Waist, Celestial Amethyst and Topaz Rings, Solid Sound, Sunken Chains, Sunken Slippers) and the Dampening group (Dampening Alloy, Reforged Glowing Ingot, Reforged Dense Ingot, Stabilizing Compound; the other eight items), 1 each. The groups share no ingredient. The survey rows match the page.

Quest and Soul Splitter items (48 rows) cost the Energizing or Dampening ingot group, 1 each. Raid first-stage rows cost an alloy, 1 Caustic Compound, 1 Stabilizing Compound and Threads of Fate: Cornerstone Champion and Wildwood Wrists Dampening Alloy and 250; Silver Dragonscale Capelet and Helmet Energizing Alloy and 250; the fourteen first-stage weapon rows Energizing Alloy and 100. Nothing is common to all. The survey rows match the page.

The six Collective Sight second-stage rows, all the Dampening group. The survey rows match the page.

Common part only. The six Legendary Collective Sight rows add 1 Reforged Glowing Ingot and 1 Reforged Dense Ingot; the 21 raid rows add 1 Caustic Compound and 250 Threads of Fate. The survey rows match the page.

All 20 rows (13 Completed Weapon, The Eclipse Itself's 7 spell focus choices). The page writes 'Threads of Fate' and this system's ingredient row is named 'Threads of Fate' (plural); Soulforge, Cauldron of Cadence, Alchemical Crafting, Nebula Fragment Crafting and Legendary Crafting name it 'Thread of Fate' (see the verification request). The survey rows match the page.

The page's first stage: 'Nearly Finished and Almost There enchantments indicate that the item can be further upgraded'; every table recipe in the Removed properties column 'Nearly Finished' (and the four set-bonus pairs).

Removed properties 'Almost There' on the raid second stage rows and on Collective Sight's six second-stage quest rows.

Removed properties 'Finishing Touch' on the raid third stage rows (13 weapons: 'Completed Weapon'; The Eclipse Itself: seven spell focus choices)."""

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Cannith_Reforging_Station"
read = "2026-11-04"
note = "The four set-bonus recipes, per item: 1 Lesser Cannith Power Cell plus three plain ingots (Tinker's: Pliable, Metallic, Dense; Magewright's: Glowing, Pliable, Dense; Fabricator's: Dense, Metallic, Glowing; Alchemist's: Metallic, Glowing, Pliable), 1 each, plus the item. Read from icon names (1_Lesser_Cannith_Power_Cell.jpg and so on); the Nearly Finished page gives no cost."

[[citation]]
field = "recipe"
url = "https://ddowiki.com/page/Cannith_Reforging_Station"
read = "2026-11-04"
note = """
Awaken Set Bonus on each of Tinker's Gloves and Tinker's Goggles (two recipes, one per item, 'Both items in a set must be upgraded to unlock the set bonus'); effect applied: Tinker's Finesse. Per item the Reforging Station's cost icons are the item, 1 each of Pliable Ingot, Metallic Ingot, Dense Ingot (plain ingot names) and 1 Lesser Cannith Power Cell. Items change from Bound to Account to Bound to Character.

Awaken Set Bonus on each of Magewright's Cloak and Magewright's Spectacles (two recipes, one per item, 'Both items in a set must be upgraded to unlock the set bonus'); effect applied: Magewright's Expertise. Per item the Reforging Station's cost icons are the item, 1 each of Glowing Ingot, Pliable Ingot, Dense Ingot (plain ingot names) and 1 Lesser Cannith Power Cell. Items change from Bound to Account to Bound to Character.

Awaken Set Bonus on each of Fabricator's Bracers and Fabricator's Gauntlets (two recipes, one per item, 'Both items in a set must be upgraded to unlock the set bonus'); effect applied: Fabricator's Ingenuity. Per item the Reforging Station's cost icons are the item, 1 each of Dense Ingot, Metallic Ingot, Glowing Ingot (plain ingot names) and 1 Lesser Cannith Power Cell. Items change from Bound to Account to Bound to Character.

Awaken Set Bonus on each of Alchemist's Pendant and Alchemist's Crown (two recipes, one per item, 'Both items in a set must be upgraded to unlock the set bonus'); effect applied: Alchemist's Lore. Per item the Reforging Station's cost icons are the item, 1 each of Metallic Ingot, Glowing Ingot, Pliable Ingot (plain ingot names) and 1 Lesser Cannith Power Cell. Items change from Bound to Account to Bound to Character."""

[[citation]]
field = "recipe"
url = "https://ddowiki.com/page/Nearly_Finished"
read = "2026-11-04"
note = """
The page's Cornerstone Champion row lists its materials as names only, with no counts, and offers Quality Strength +3, Quality Dexterity +3 or Quality Wisdom +3. Cost: Dampening Alloy, Caustic Compound, Stabilizing Compound, 250 Threads of Fate.

Adds a Purple Augment Slot and an Orange Augment Slot, then Almost There (the other raid weapons add the Purple slot only).

Materials: 25 Iron Defender Rivets where every other raid first-stage row lists 35 (the rest: 25 Claws, 30 Actuators, 45 Platings, 45 Gyroscopes, 30 Cores, 35 Parts, 25 Cannon Cores)."""

[[citation]]
url = "https://ddowiki.com/page/Cannith_Reforging_Station"
read = "2026-11-04"
note = "Whole page read: location (Artificer Workshops and Sharn - Cliffside Docks District; may be labeled 'Cannith Forging Station'), 'It can be used to unlock the set bonuses of Nearly Finished items', the six Alchemical Refinement recipes (Alchemical Crafting's), and the 'Nearly Finished unlocking' table of eight Awaken Set Bonus recipes (cost icons: the item, three plain ingots and 1 Lesser Cannith Power Cell each). No gate stated. Icons only, no examine screenshot."

