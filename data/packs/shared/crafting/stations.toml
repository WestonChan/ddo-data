note = "The Essence Crafting page, Steps: craft a Minimum Level shard and effect shards 'at a Shard (Bound or Unbound) Crafting Device', and 'Use a Bound crafting station for Bound-to-Account shards, or an Unbound station for Unbound shards'; its leveling tips say to go back and forth between both devices. So a Bound and an Unbound device stand together; the page gives no separate wiki names for them, so they are one station row here. The Essence Crafting page lists 'The Eveningstar Crafting Hall in Eveningstar' and its History says Update 79 made Essence Crafting available in Eveningstar. The Eveningstar Crafting Hall page itself was not opened. Same variant name as the Device Workstation rows. Which devices stand in which hall is read from two statements, not from a per-hall device list: the Essence Crafting page says all four halls are places where Essence Crafting activities are performed and names the three devices of the steps, and the Crafting Hall page says the public halls hold 2 complete sets of altars. No more exact spot is given: the Essence Crafting page lists the hall, and its section on the Eveningstar page has no text."

