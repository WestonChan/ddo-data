name = "Trapmaking"
npc = "Device Workstation, ground level of the House Cannith Enclave; also a guild airship amenity at guild level 30 (24 Gold Seal). Needs the Trapmaking feat (auto-granted to level 4 Rogues and Artificers and level 3 Dark Hunters)"

[[ingredient]]
name = "Mechanical Trap Parts"
drop_location = "From disabled trap Control Panels whose traps are mechanical (spikes, blades); needs the Trapmaking feat"
tier = "any"

[[ingredient]]
name = "<Elemental> Trap Parts"
drop_location = "From disabled trap Control Panels of the matching element: Acid, Cold, Electrical, Fire, Force or Sonic; needs the Trapmaking feat. Unholy and Holy parts drop but have no recipe"
tier = "any"

[[ingredient]]
name = "Magical Trap Parts"
drop_location = "From disabled Control Panels of poison and spell traps; needs the Trapmaking feat"
tier = "any"

[[ingredient]]
