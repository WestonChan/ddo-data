tier = "any"

[[ingredient]]
name = "Level 2 trap scroll"
drop_location = "Scroll of Blindness, Daze Monster, Glitterdust, Hypnotic Pattern, Otto's Resistible Dance, Scare, Touch of Idiocy or Web; The Marketplace Bazaar sells level 2 scrolls"
tier = "any"

[[ingredient]]
name = "Level 3 trap scroll"
drop_location = "Scroll of Deep Slumber, Dispel Magic, Halt Undead, Hold Person or Slow; Object Desire in the House Phiarlan Enclave sells level 3 scrolls"
tier = "any"

