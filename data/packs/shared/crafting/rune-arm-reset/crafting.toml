[[citation]]
field = "recipe"
url = "https://ddowiki.com/page/Device_Workstation"
read = "2026-11-04"
note = """
Clears the Cannith Crafted enchantments from a Rune Arm: the Device Workstation page says it completely resets the Rune Arm to factory default and basically returns a brand new rune arm. The Rune Arm page: a craftable rune that has been Cannith Crafted cannot be simply disjuncted and re-crafted, unlike other gear; it must be reset at a Device Workstation first and then disjuncted. No cost is stated.

The reset is described on the Device Workstation page; the disjunction rule is from the Rune Arm page. No cost is stated on either page."""

