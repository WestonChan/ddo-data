[[citation]]
url = "https://ddowiki.com/page/Dusty_Old_Treasure_of_Crystal_Cove"
read = "2026-11-04"
note = """
A crafting device in the Rook's Gambit tavern of Smuggler's Rest, introduced in Update 39, holding the old tiered versions of the Cove gear (Brigand's Cutlass, Cutthroat's Smallblade, Ornamented Dagger, Ratkiller, Glass Cannon, Swashbuckler, Cavalry Plate, Duelist's Leathers, Brawling Gloves, Ring of the Buccaneer, Treasure Hunter's Spyglass), the four trinkets and the Bottomless Flask of Rum; the new versions are bought at Euphonia's Barter Box. The tier upgrades of the legacy items happen here: Tier 1 is bought for doubloons and a gem, Tier 2 and Tier 3 are upgrades in steps that cost green dragonshards and gems, Tier 3 also a Greater trinket, and the item level goes up 4-8-12-16-20-24 by a separate recipe that resets the item to Tier 1.

Whole page read as text: the device, the item lines, the trinket tables (Lesser, mid and Greater costs), the flask tier table (not written: no flask file), the upgrade description. The Upgrade requirement matrix is images and its text came out garbled, so no matrix rows. The page says Tier II of a weapon needs a trinket where the Cavalry Plate table puts the trinket at Tier 3: the table wins.

Read again for the upgrade matrix: the Brigand's Cutlass matrix (Upgrade I and II for levels 4 to 24, trinket row) was viewed as a screenshot of the page and read in full; the level 24 row is text. Typed (a wiki table of images, not an in-game screenshot)."""

[[citation]]
