[[citation]]
field = "step"
url = "https://ddowiki.com/page/Item:Cavalry_Plate"
read = "2026-11-04"
note = """
Dragonshards are the same for every line at a level (100/200/300/400/500/600 for levels 4 to 24); the gems are two types per level in a pair that swaps order by line (a Pyrite-set line puts the larger count on Pyrite, Obsidian, Amethyst, Ruby, Emerald, Opal and the smaller on Alabaster, Amber, Topaz, Sapphire, Diamond, Malachite; an Alabaster-set line the reverse), so the whole cost is per recipe; the consumed lower tier is the item itself, upgraded in place. All ten lines were read (Glass Cannon prices Star Rubies and Star Sapphires instead).

As Tier 2 with double the dragonshards (and 1100 at level 24), more gems, and one Greater trinket whose type depends on the line (Bold: Brigand's Cutlass, Ratkiller; Cunning: Ornamented Dagger, Treasure Hunter's Spyglass; Nimble: Cutthroat's Smallblade, Swashbuckler, Duelist's Leathers; Stalwart: Cavalry Plate, Ring of the Buccaneer; not stated: Brawling Gloves; none: Glass Cannon).

Cost differs by level; each recipe carries its cost.

The Dusty Old Treasure page: the tier upgrades of the legacy Cove items are done at this box; the Cavalry Plate line page's Legacy Version table gives each tier's enhancements and costs. Shared with ToEE Crafting and Vaults of the Artificers: one step per system."""

