[[citation]]
url = "https://ddowiki.com/page/Incredible_Potential"
read = "2026-11-04"
note = """
Whole page. Not stated: level, favor, pack, feat, a Guild Airship use, the drop source of the War Trophies, or the Tower of Despair ring names. Notes: Burst effects apply to unarmed attacks only and do not stack with identical handwraps; 20% Negative Energy Absorption does not protect against level drain; the +2 stats are Insight bonuses since Update 14. Table order matches the data's 36 recipes.

The Guild Airship variant of the altar is not mentioned on this page."""

[[citation]]
field = "pack"
url = "https://ddowiki.com/page/The_Shroud"
read = "2026-11-12"
note = "Its two stations are both the Altar of Subjugation: one in The Shroud raid (the Shroud page says 'Requires access to adventure pack: The Vale of Twilight') and one in the Devil Battlefield (its page says 'Requires access to adventure pack: The Devils of Shavarath'). Either altar will do, so no single pack gates it. The Incredible Potential page states no pack."

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Incredible_Potential"
read = "2026-11-04"
note = """
Tooltip and page: "combined with 9 Shavarath War Trophies and an Imbued Shard of Great Power in an Altar of Subjugation"; the table caption says all recipes assume a ring from the Tower of Despair raid and 9 Shavarath Trophies of War. The shard is made from the recipe's Focus, Gem and Essence types, so the type differs per recipe but it is one ingredient name. All 36 recipes agree. No energy cell is stated for this step. The ring is the item being upgraded (not a cost, not an output).

The only socket step: the ring tooltip reads "Incredible Potential: This ring's power has not been fully unleashed" and the 36-row table lists the attribute added per Focus/Gem/Essence type. One effect per ring; a Yellow Dopant removes it (since Update 14)."""

