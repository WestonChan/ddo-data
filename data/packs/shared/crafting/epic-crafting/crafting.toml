[[citation]]
url = "https://ddowiki.com/page/Epic_Crafting"
read = "2026-11-04"
note = "Whole page. Level, favor, pack and feat are not stated (the navigation box says Level 20+, not used). The † note: playing the Legendary version of a Chronoscope or Saltmarsh quest or raid can drop the Legendary versions directly (a Legendary Crafting matter, not the Epic items)."

[[citation]]
field = "pack"
url = "https://ddowiki.com/page/The_Twelve"
read = "2026-11-12"
note = "The Altar of Epic Rituals is in The Twelve, a city zone whose page names no pack. The system's recipes take pack-specific ingredients (the Epic Crafting page's pack ingredient table, read 2026-11-04) and make items from many packs' epic quests, and no single pack gates it. The packs behind the ingredients were not enumerated in this pass."

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Epic_Crafting"
read = "2026-11-04"
note = """
Pure step (no socket label): the heroic base item becomes its Epic version (ML 20). 215 items are on the page's list; Epic Red Dragonscale Armor is named in the prose only.

Nothing is shared by name: every recipe takes its heroic base item (the placeholder "Heroic base item" in the data) and 50 of its own pack's ingredient, plus 5 Greater Token of the Twelve for raid items (Epic Red Dragonscale Armor adds a Shard of the Red Dragon and 20 Flawless Red Dragon Scales). The grouped costs follow as recipe_text rows and match the page's usage table; the page's raid flags (64 items on the list) equal the survey's 63 recipes with Greater Tokens plus Epic Helm of the Red Dragon, which the survey gives no ingredients at all (see its output row), and Epic Red Dragonscale Armor has Greater Tokens but is not on the list."""

[[citation]]
field = "recipe"
url = "https://ddowiki.com/page/Epic_Crafting"
read = "2026-11-04"
note = "Page: Star Fragments can be bought at the Altar of Legendary Rituals at 100 pack ingredients (except Saltmeadow Hay) to one Star Fragment. The survey files these 7 recipes under Epic Crafting; the station is a Legendary Crafting one."

[[citation]]
field = "recipe"
url = "https://ddowiki.com/page/Item:Shard_of_the_Red_Dragon"
read = "2026-11-12"
note = """
Yields one Epic Red Dragonscale armor of the player's choice: Epic Red Dragonhide Armor, Epic Red Dragonplate Armor, Epic Red Dragonscale Armor, Epic Red Dragonscale Docent or Epic Red Dragonscale Robe. The Shard of the Red Dragon's in-game text (examination panel image Shard_of_the_Red_Dragon.png) says to bring it to the Altar of Epic Rituals 'to convert it into a Dragonscale Armor of the type of your choice'; the five type names are from the item page's typed Tips.

The in-game text is the examination panel image Shard_of_the_Red_Dragon.png; the five armor type names are from the item page's typed Tips."""

