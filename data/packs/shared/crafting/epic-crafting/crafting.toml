[[station]]
name = "Altar of Legendary Rituals"
note = """
Star Fragment exchange (100 pack ingredients each)

Makes Star Fragment from Desert Sand Crystal.

Makes Star Fragment from Vault Key.

Makes Star Fragment from Medal of House Deneith.

Makes Star Fragment from Scrap of Patterned Cloth.

Makes Star Fragment from Glowing Fen Mushroom.

Makes Star Fragment from Fractured Sliver of Time.

Makes Star Fragment from Crystallized Spiderweb."""

