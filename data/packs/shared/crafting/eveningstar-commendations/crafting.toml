note = "Read for the traders' place: Notable NPCs, Traders & Brokers, Commendation traders lists the five traders as Tellie Scavelman (Villager Trader), Wilkan Drome (Cleric Trader), Arcton Greenwort (Druid Trader), Torgar Falmon (Purple Dragon Knight Trader), Relton Trapalo (War Wizard Trader) with no spot for any of them. The page's only images are a map, a loading screen and a saga picture, none of which show the traders."
