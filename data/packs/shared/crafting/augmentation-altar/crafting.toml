[[citation]]
url = "https://ddowiki.com/page/Augmentation_Altar"
read = "2026-11-04"
note = "Whole page read: introduced in Update 72; the Altar is in the raid Den of Vipers inside the Temple of Silith-tar and upgrades loot from that raid; upgrades require Hydra Scales from the end and optional chests of the raid; one table of 7 rows (six weapon effects and one ability-bonus row). Not stated: level, favor, pack, feat, or any quest or raid-completion gate on the Altar (unlike the Ritual Table page, it does not say the Altar is locked until the raid is done). No item ingredient or crafted item is named: the page speaks of 'Sealed in Mist item' and 'Sealed in Gloom item' generically."

[[citation]]
field = "pack"
url = "https://ddowiki.com/page/Den_of_Vipers"
read = "2026-11-12"
note = "The Augmentation Altar is inside the Temple of Silith-tar in the Den of Vipers raid (Augmentation Altar page, read 2026-11-04). The Den of Vipers page's infobox says Purchase: Free to Play, no flagging required, and the raid is entered from the Hall of Heroes, which everyone can enter."

[[citation]]
field = "step"
url = "https://ddowiki.com/page/Augmentation_Altar"
read = "2026-11-04"
note = """
Six weapon effects on 'Raid Den of Vipers Weapons'; the cost cell spans all six rows.

One ability-bonus row on 'Raid Den of Vipers Equipment'.

One cost cell for the six weapon rows: a Sealed in Mist item (the item being rewritten, not a fixed item) and 20 Hydra Scales. The page does not label the grade; the effects are the Legendary effects.

A Sealed in Gloom item (the item being rewritten) and 20 Hydra Scales.

The page's cost cell for the six weapon effects reads 'Sealed in Mist item, 20 Hydra Scales'. Step name is the wiki's wording of the item kind; the in-game socket text was not seen.

The page's cost cell for the ability-bonus row reads 'Sealed in Gloom item, 20 Hydra Scales'. Step name is the wiki's wording of the item kind; the in-game socket text was not seen."""

