name = "Legendary Brightbane Emerald"
description = """
Command +7. This armor or shield always appears brilliant and gleaming, no matter
what he conditions and despite all attempts to paint over or obscure it.
Coveted by military leaders of all sorts, it carries a powerful aura that
grants a +7 Insight bonus on Charisma-based skill checks. Command armor and
command shields make their owners very noticeable, imposing a -6 penalty on
Hide checks."""
