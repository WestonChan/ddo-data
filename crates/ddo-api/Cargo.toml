[package]
name = "ddo-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Read-only public API over the DDO Tools game database"

[dependencies]
anyhow = { workspace = true }
axum = "0.8"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ddo-model = { path = "../ddo-model" }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "io-util"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "compression-br", "trace", "set-header", "fs"] }
tower_governor = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }

[dev-dependencies]
ddo-etl = { path = "../ddo-etl" }
http-body-util = "0.1"
