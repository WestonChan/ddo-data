[[row]]
name = "Wild Shape: Plague Wolf"
acquire = "Train"
description = """
Animal Form: Transform into a Plague Wolf. While in this form, you gain a +10%
Combat Style bonus to attack speed, a +3 bonus to attack while flanking, 10%
bonus to movement speed and you can use either the Biting Acid or Biting Poison
Imbue. You gain a -2 penalty to Intelligence and Charisma. While in Wolf form you
gain access to a number of spells and enhancements that require Wold form, but
the cooldowns of your non-animal form spells are increased to 2.5 times their
normal length.

You now attack with tooth and claw using the stats of whatever weapon held in
your right hand. Shields work normally but you cannot shield bash.

You are considered an animal. If you are a Warforged, you are no longer considered
a Living Construct, and can now be healed normally by Positive energy spells, and
you become immune to repair spells.

You cannot use wands or scrolls while in animal form."""
icon = "WildShapePlagueWolf"
source_name = "Blight Caster"

