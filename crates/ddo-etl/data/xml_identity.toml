[[entity]]
table = "feats"
upstream_id = 381
name = "Echoing Soul"
description = "Your soul is fractured, shifted, or connected to another in some way.\nGain +3 to all Skills plus an additional +1 for every 2 Character Levels.\nGain +1 to all Saving Throws plus an additional +1 every 3 Character Levels.\n\nWhen you get hit in Melee or Ranged attacks, there is a very small chance your\nEchoing Soul will cause you to become Afraid, Blinded, or Immobilized for six\nseconds with no save. Immunities to these conditions do not apply to this effect."
variant = "dark-gift"

[[entity]]
table = "feats"
upstream_id = 382
name = "Form of Pain"
description = "Your body is cursed to be prone to all manner of damage, but with the ability to\nwithstand it. Passively grants +5 PRR/MRR.\n\nWhen you take damage your body changes and you gain the Form of Pain effect\nwhich grants +2 PRR/MRR but also reduces movement speed and increases spell\ncosts by 1% as the pain distracts you. This can stack 10 times, with one stack\nbeing removed every 5 seconds."
variant = "dark-gift"

[[entity]]
table = "feats"
upstream_id = 383
name = "Living Shadow"
description = "Your Shadow extends your reach, acting out your dark impulse, nearly doubling your\nrange with melee weapon attacks in the front arc.\n\nYet, there is a small change when you critical hit a target that the shadow drains\nyou briefly, reducing your damage by 15% for 6 seconds. This can only occur once\nevery 30 seconds."
variant = "dark-gift"

[[entity]]
table = "feats"
upstream_id = 384
name = "Minion of the Eldritch"
description = "Cooldown: 2 minutes\nTarget: Self\n\nYour soul has touched something beyond the planes, and a connection has formed\nthere. Activate: You gain +5 Spell Power per Character Level, and +1% Spell\nCritical Damage for every 2 Character Levels you have for 12 seconds.\n\nWhen you use this ability, there is a chance the Eldritch Being you reach out\nto will grow tired of your petitions and decide to punish you instead.\nThis chance increases each time you use this ability between rests."
variant = "dark-gift"

[[entity]]
table = "feats"
upstream_id = 385
name = "Mist Walker"
description = "Cooldown: 15 seconds\nTarget: Self, Directional\n\nYou have learned how to navigate the Mists with time and a little luck.\nTrigger this ability to leap forward, and briefly gain a +5 bonus to Reflex\nSaves and a stacking 20% bonus to Incorporeality defense. This feat shares a\ncooldown with Abundant Step.\n\nWhen using this ability there is a small chance the mists will nearly catch up\nand you will become Exhausted for 6 seconds, -50% penalty to movement speed,\n-6 to Strength and Dexterity, cannot tumble. Normal immunities or remedies to\nexhaustion will not protect against this."
variant = "dark-gift"

[[entity]]
table = "feats"
upstream_id = 386
name = "Touch of Death"
description = "Every touch causes life to wilt, but you can use this power if you know the way...\nGain +3 Negative Spell power and Negative Healing Amplification per Character Level.\nLose 5 Positive Spell Power and Healing Amplification per Character Level."
variant = "dark-gift"

[[entity]]
table = "feats"
upstream_id = 387
name = "Webtouched Wretch"
description = "You've become entwined with a great cosmic web, which occasionally becomes coterminous\nwith reality. Your offensive spells, melee and ranged attacks occasionally cause\nstrange spectral webs to coat your enemies either slowing them or entangling\nthem for up to 6 seconds with no save.\n\nWhen you get hit with Melee or Ranged attacks, there is a small chance the webs\nturn on you, applying a weakened slow effect which lasts 6 seconds but can\nstack 3 times. Spells/Immunities like Freedom of Movement do not prevent this."
variant = "dark-gift"

