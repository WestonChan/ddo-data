[[system]]
name = "Dragontouched Armor"
page = "https://ddowiki.com/page/Dragontouched_Armor"
read = "2026-09-29"
pack = "The Reaver's Reach"
families = ["Dragontouched_EldritchRune", "Dragontouched_TempestRune", "Dragontouched_SovereignRune"]
npc = "Vorace, across from the Stormreaver in Reaver's Refuge, beside the Dragontouched Eldritch, Tempest and Sovereign Altars"

[[system.ingredient]]
name = "Draconic Rune"
tier = "heroic"
source = "1-3 from named chests in Aussircaex's Valley, Soami Gardens, Mount Reysalon and Eerie Forest; 3-11 from end chests in Enter the Kobold, Monastery of the Scorpion and Prey on the Hunter; 50 as the Stealer of Souls end reward. Spending them needs Stealer of Souls complete; Vorace also trades 50 for an Eberron Dragonshard Essence and 25 each for a Siberys or Khyber Dragonshard Essence"

[[system.ingredient]]
name = "Eldritch Rune"
tier = "heroic"
source = "1-2 from Enter the Kobold; 1-2 from Monastery of the Scorpion; one from Vorace for 50 Draconic Runes. 23 types; identified in the chest since Update 7"

[[system.ingredient]]
name = "Tempest Rune"
tier = "heroic"
source = "1 from Prey on the Hunter; made from three Eldritch Runes. 24 types"

[[system.ingredient]]
name = "Sovereign Rune"
tier = "heroic"
source = "1 from Stealer of Souls; made from three Tempest Runes. 33 types"

[[system.recipe]]
tier = "heroic"
option = "Dragontouched Armor (blank)"
augments = []
note = "All recipe facts are on this page (Dragontouched_Armor redirects to Item:Dragontouched_Armor). Vorace sells the blank for 50 Draconic Runes once Stealer of Souls is complete; all six types are ML16: Plate Armor (armor +22, max Dex +1), Breastplate (+17, max Dex +5), Leather Armor (+11, max Dex +11), Docent (Adamantine +16, Mithral +7, Composite +2, Construct Fortification 10%), Shroud (robe, +6) and Vestments (outfit, +6). The armor takes one rune of each type, in any order, at the matching altar; no augment counterpart."
cost = [{ ingredient = "Draconic Rune", quantity = 50 }]

[[system.recipe]]
tier = "heroic"
option = "Eldritch Rune from Vorace"
augments = []
note = "Vorace shows ten of the 25 possible Eldritch Runes and you pick one; Tempest and Sovereign Runes can no longer be bought (since Module 9). No augment counterpart."
cost = [{ ingredient = "Draconic Rune", quantity = 50 }]

[[system.recipe]]
tier = "heroic"
option = "Tempest Rune Empowered"
augments = []
note = "Three Eldritch Runes at the Dragontouched Eldritch Altar make one random Tempest Rune; a stack of identical runes cannot be used, but separate identical runes can. No augment counterpart."
cost = [{ ingredient = "Eldritch Rune", quantity = 3 }]

[[system.recipe]]
tier = "heroic"
option = "Sovereign Rune Empowered"
augments = []
note = "Three Tempest Runes make one random Sovereign Rune. No augment counterpart."
cost = [{ ingredient = "Tempest Rune", quantity = 3 }]

[[system.recipe]]
tier = "heroic"
option = "Sovereign Rune Shattered"
augments = []
note = "At the Dragontouched Sovereign Altar (since Update 7) a Sovereign Rune and a Draconic Rune return 1-9 Eldritch Runes' worth, converted up (5 gives 1 Tempest and 2 Eldritch; 9 gives a Sovereign), with exceptions. No augment counterpart."
cost = [{ ingredient = "Sovereign Rune", quantity = 1 }, { ingredient = "Draconic Rune", quantity = 1 }]

