[[system.recipe]]
tier = "heroic"
option = "Seal of the Stormreaver"
augments = []
note = "Trade added in Update 18; a crafting ingredient, no augment counterpart."
cost = [{ ingredient = "Black Dragon Scale", quantity = 20 }, { ingredient = "Blue Dragon Scale", quantity = 20 }, { ingredient = "White Dragon Scale", quantity = 20 }]

[[system.recipe]]
tier = "heroic"
option = "Unlock a pre-Update 12 raid item"
augments = []
note = "Since Update 12 Patch 3, Reaver or Abbot raid items obtained before Update 12 can be unlocked to add the upgrade option; relic type depends on the item. Dreamspitter keeps its Suppressed or Unsuppressed status; old versions with neither status gain no suppressed power and keep their binding. Stone of Change rituals persist. Adds the upgrade socket, which Maetrim models on the items already."
cost = [{ ingredient = "Restored Giant, Elven or Dragon Relic", quantity = 5 }]

[[system.recipe]]
tier = "heroic"
slot = "crafting: upgradeable item"
option = "Amulet of the Stormreaver upgrade"
augments = []
note = "Upgrades Amulet of the Stormreaver (Necklace; Protection +4, Electric Resistance +30, Chain Lightning (3 Charges)) in place: loses Protection +4, Electric Resistance +30, gains Protection +5, Electric Resistance +40. Upgrading does not remove a Deck of Many Curses curse. Introduced in Update 12. Maetrim holds the upgraded effects as an item-specific option on this socket, not in an augment family."
cost = [{ ingredient = "Amulet of the Stormreaver", quantity = 1 }, { ingredient = "Seal of the Stormreaver", quantity = 1 }]

