[[system]]
name = "Nebula Fragment Crafting"
page = "https://ddowiki.com/page/Item:Nebula_Fragment"
read = "2026-09-29"
npc = "Lahar in The Twelve: present a Nebula Fragment to receive the Star Fragments: Frame quest; the completed Frame (Bound to Account, not consumed, shareable through the bank) must be in the inventory to open his Perfected Crafting interface"

[[system.ingredient]]
name = "Nebula Fragment"
tier = "legendary"
bind = "Bound to Account on Acquire"
source = "Very rare drop from Legendary chests in Sinister Secret of Saltmarsh"

[[system.ingredient]]
name = "Thread of Fate"
tier = "legendary"

[[system.ingredient]]
