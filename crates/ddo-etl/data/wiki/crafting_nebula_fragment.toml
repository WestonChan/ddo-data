[[system.ingredient]]
name = "Star Fragments: Frame"
tier = "legendary"
bind = "Bound to Account"
source = "From Lahar's quest; completed by clicking 8 Star Shrines with it in the inventory: Red (Saltmarsh wilderness, south of the Final Enemy entrance), Orange (The Chronoscope, Rusty Nail inn behind the weapon and wand dealers' counter), Yellow (Partycrashers, front lobby by the guest list), Green (Storm the Beaches, on the warship), Teal (Into the Deep, bottom right corner), Blue (Plane of Night, island below the main platform, bring Feather Fall), Purple (The Spinner of Shadows, in the lava), Pink (Sands of Menechtarun wilderness, south-west of the Chains of Flame entrance). Needs Sands of Menechtarun, Sentinels of Stormreach, The Red Fens, Devil Assault, The Vault of Night, Phiarlan Carnival, Sinister Secret of Saltmarsh and Web of Chaos (free to play); all but the Red Shard work with VIP"

[[system.recipe]]
tier = "legendary"
option = "Perfected Jidz-Tet'ka"
augments = []
note = "Upgrades the Legendary Jidz-Tet'ka into Perfected Jidz-Tet'ka (Bracers), a minor artifact at ML 30 with up to 4 filigree slots. The Frame must be in the inventory and is not consumed. As a new item it inherits no Mythic, Reaper or Deck of Many Curses effects, and cannot be equipped alongside another minor artifact. Uses Sentinels of Stormreach components per the Epic Crafting pack table. A separate item in Maetrim's data; no augment counterpart."
cost = [{ ingredient = "Legendary base item", quantity = 1 }, { ingredient = "Nebula Fragment", quantity = 1 }, { ingredient = "Thread of Fate", quantity = 500 }, { ingredient = "Medal of House Deneith", quantity = 250 }]

