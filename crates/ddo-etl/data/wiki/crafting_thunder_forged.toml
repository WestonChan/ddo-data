[[system]]
name = "Thunder-Forged"
page = "https://ddowiki.com/page/Thunder-Forged"
read = "2026-09-29"
pack = "Shadowfell Conspiracy"
families = ["Thunderforged"]
npc = "Magma Forge, in the lower area of The Ruins of Thunderholme; a fast travel NPC in The Thunder Peaks public area takes you there once you have defeated the Dragon Emissary (Sarva Bellistrae), flagging for the Temple of the Deathwyrm raid"

[[system.ingredient]]
name = "Thunder-Forged Dwarven Ingot"
tier = "epic"
bind = "Unbound"
source = "Main Raid Chest, Fire on Thunder Peak and Temple of the Deathwyrm (14-26); Side Raid Chests, Fire on Thunder Peak and Temple of the Deathwyrm (Rare Drop: 0-3?); Rare Encounter Chests, The Ruins of Thunderholme (0-10?). Used for the base item and Tiers 1-3"

