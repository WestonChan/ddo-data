[[system.ingredient]]
name = "Accursed Card"
tier = "any"
bind = "Unbound"
source = "Primary drop: Pilgrims' Peril (Illithid Invasion). Legendary Sagas: Mists of Ravenloft, Fables of the Feywild, The Chill of Ravenloft (Normal 30, Hard 60, Elite 90, True Elite 120). All four cards appear in each Illithid Invasion quest, in the end chests and one optional chest per quest; also on the Auction House and Shard Exchange, and as later-content rewards. Festivult (from 2023, Update 65) doubles the natural drop rate, adds card stacks to Legendary Saga rewards and sells stacks of 6 from the Jester of Festivult for Gold coins"

[[system.ingredient]]
name = "Uncanny Card"
tier = "any"
bind = "Unbound"
source = "Primary drop: Stolen Power (Illithid Invasion). Legendary Sagas: Masterminds of Sharn, Cogs Explorer Dungeons, Terror of Demogorgon (Normal 30, Hard 60, Elite 90, True Elite 120). All four cards appear in each Illithid Invasion quest, in the end chests and one optional chest per quest; also on the Auction House and Shard Exchange, and as later-content rewards. Festivult (from 2023, Update 65) doubles the natural drop rate, adds card stacks to Legendary Saga rewards and sells stacks of 6 from the Jester of Festivult for Gold coins"

