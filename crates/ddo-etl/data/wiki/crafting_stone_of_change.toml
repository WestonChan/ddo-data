[[system.recipe]]
tier = "any"
option = "Flawed Siberys Dragonshard"
augments = []
note = "Dragonshard combination, no augment counterpart. Stacks of up to 10,000 shards can be placed but are transmuted one batch at a time; some combinations work in 10x bulk (1000 fragments give 10 Flawed shards). Since Update 61 Fred in the House Jorasco Enclave converts Siberys shards and fragments by barter. Since Updates 50 and 56 the Stone will not combine Khyber Dragonshard Fragments."
cost = [{ ingredient = "Siberys Dragonshard Fragment", quantity = 100 }]

