[[system.recipe]]
tier = "any"
option = "Attuned Equipable Item"
augments = []
note = "Binding and Attuning: the item becomes immune to future permanent damage (existing damage stays) and can take an Alchemical Ritual. Bound to Account items stay Bound to Account; Unbound items become Bound to Character. Does not destroy slotted augments and persists through Essence Crafting Disjunction, though a ritual laid on top does not. Only the required fragments are consumed from a larger stack. Changes the item's binding, not its sockets."
cost = [{ ingredient = "Any Equipable Item", quantity = 1 }, { ingredient = "Siberys Dragonshard Fragment", quantity = 400 }]

[[system.recipe]]
tier = "any"
option = "Adamantine Ritual I"
augments = []
note = "Alchemical Adamantine Ritual: +5 Hardness and +10 Durability. Rituals must be performed in order (I through V), can restore items Broken beyond Repair, and do not destroy mythic or reaper bonuses. An item holds one alchemical ritual at a time, Adamantine or Eldritch; applying another replaces it. No augment counterpart."
cost = [{ ingredient = "Any Attuned Item", quantity = 1 }, { ingredient = "Adamantine Ore", quantity = 10 }, { ingredient = "Soul Gem: Essence of Earth", quantity = 10 }]

[[system.recipe]]
tier = "any"
option = "Adamantine Ritual II"
augments = []
note = "Alchemical Adamantine Ritual: an additional +5 Durability. Requires Ritual I first."
cost = [{ ingredient = "Any Attuned Item", quantity = 1 }, { ingredient = "Adamantine Ore", quantity = 15 }, { ingredient = "Soul Gem: Essence of Earth", quantity = 20 }]

