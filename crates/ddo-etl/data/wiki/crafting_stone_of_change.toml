[[system.recipe]]
tier = "any"
option = "Alchemical Armor Eldritch Ritual"
augments = []
note = "+1 Alchemical Bonus to AC on attuned armor; also applies to Cosmetic Armor and Cosmetic Helmets and stacks with the Shield ritual. The page reports a bug: it is coded as an item-based Dodge bonus to AC, so it does not stack with Ranger's Favored Defense or Fighter's Mobility. Replaces any other alchemical ritual on the item. No augment counterpart."
cost = [{ ingredient = "Any Attuned Armor", quantity = 1 }, { ingredient = "String of Prayer Beads", quantity = 15 }, { ingredient = "Vial of Pure Water", quantity = 5 }]

[[system.recipe]]
tier = "any"
option = "Alchemical Shield Eldritch Ritual"
augments = []
note = "+1 Alchemical Bonus to AC on an attuned shield or orb; same Dodge-bonus bug as the Armor ritual. Replaces any other alchemical ritual on the item. No augment counterpart."
cost = [{ ingredient = "Any Attuned Shield or Orb", quantity = 1 }, { ingredient = "Tome: Prophecies of Khyber", quantity = 2 }, { ingredient = "Silver Flame Hymnal", quantity = 6 }]

[[system.recipe]]
tier = "any"
option = "Force Damage Ritual"
augments = []
note = "1 point of force damage on each successful hit; works on all handwraps (randomly generated handwraps may need a solo pass through the Stone, shown as Ritual of Second Chances). Replaces any other alchemical ritual on the item. No augment counterpart."
cost = [{ ingredient = "Any Attuned Weapon", quantity = 1 }, { ingredient = "Luminescent Dust", quantity = 3 }, { ingredient = "Fragrant Drowshood", quantity = 9 }]

[[system.recipe]]
tier = "any"
option = "Force Critical Ritual"
augments = []
