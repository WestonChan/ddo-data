[[system.recipe]]
tier = "heroic"
slot = "crafting: nearly finished"
option = "Resplendant Fury: Insightful Charisma +3"
augments = []
note = "All recipe tables are on this page: Masterminds of Sharn quest items, Masterminds of Sharn raid items, The Soul Splitter, and Secrets of the Artificers set bonuses. The page's second quest-item column is headed Epic; its items are the Legendary versions, recorded at the legendary tier. Each recipe gives one effect of your choice; the page notes most values, especially heroic, need verification. Applied to Resplendant Fury; removes Nearly Finished and adds Insightful Charisma +3. Cost materials, melted at a Cannith Melting Station: 20 Iron Defender Claws, 25 Iron Defender Rivets, 20 Magefire Cannon Cores, 25 Magefire Cannon Parts, 5 Shield Guardian Cores, 50 Shield Guardian Gyroscopes, 5 Worker Drone Actuators, 50 Worker Drone Platings. Maetrim has no augment family for this system."
