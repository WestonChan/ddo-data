[[system]]
name = "Trace of Madness"
page = "https://ddowiki.com/page/Altar_of_Insanity"
read = "2026-09-29"
families = ["Other"]
npc = "Altar of Insanity, Hall of the Planes in the Tower of the Twelve (head south from the tower entrance to the purple \"Door\" icon; the altar is on the right)"

[[system.ingredient]]
name = "Watcher's Eye"
tier = "any"
bind = "Bound to Account"
source = "Any appropriate Reign of Madness enemy (Update 10); added to the ingredient bag automatically when you or a party member kills it"

