[[system.ingredient]]
name = "Trace of Madness item"
tier = "any"
source = "Items with the Trace of Madness trait from Harbinger of Madness, Reign of Madness and Disciples of Rage quests (Updates 9, 10 and 38); ML 14 heroic and ML 29 legendary versions"

[[system.recipe]]
tier = "any"
slot = "crafting: trace of madness"
option = "Xoriat Madness: Mania"
augments = ["Melodic Guard"]
note = "Applies Melodic Guard to an item with the Trace of Madness trait (the page's tooltip says any armor item). The item stays Bound to Account with no change in minimum level; once applied the recipe is fixed and cannot be overwritten."
