[[item]]
name = "Epic Cloak of Night (Level 20)"
page = "https://ddowiki.com/page/Item:Epic_Cloak_of_Night_%28level_20%29"
read = "2026-09-29"
slot = "Back"
category = "Clothing"
minimum_level = 20
material = "Leather"
description = "This Cloak is as smooth and dark as the most pitch-black of nights. Wearing it makes you difficult to spot and attack, and by awakening its powers you will enable it to aid you against creatures native to the darkness."
drop_location = "The Night Revels, Turn in Cloak of Night (level 16) and 150 Piece of Darkest Chocolate, 40 Pinch of Sinister Cinnamon, 80 Shadowy Caramel at Joe Candymaker"
bonuses = [
  { stat = "Dodge", bonus_type = "Enhancement", value = 4 },
]
effects = [
  { name = "Invisibility Guard", description = "This item has a chance of granting you temporary invisibility when you are hit by foes. The invisibility will not be removed when you attack or take damage, but it will wear off after 10 seconds." },
  { name = "Ghostly", description = "Equipping this item causes you to become partially incorporeal. Your melee attacks do not roll a miss chance for Incorporeal targets. Enemy attacks have a 10% chance to miss you due to incorporeality. You receive a +5 enhancement bonus to your Hide and Move Silently skills." },
  { name = "Deathblock", description = "The wearer of this item is immune to all death spells and magical death effects." },
  { name = "Nightmare Guard", description = "This item has a chance to terrorizing foes that hit you, applying a Mind Thrust effect, when you are hit by them (dealing 5d8 force damage, Will save vs. Enchantments negates). It may also expose your foes to their greatest fears, acting as a Phantasmal Killer spell." },
  { name = "DR 5/Good", description = "Reduces physical damage by 5, except from Good attacks." },
]

