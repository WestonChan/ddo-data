[[system]]
name = "Trapmaking"
page = "https://ddowiki.com/page/Trapmaking"
read = "2026-09-29"
npc = "Device Workstation, ground level of the House Cannith Enclave; also a guild airship amenity at guild level 30 (24 Gold Seal). Needs the Trapmaking feat (auto-granted to level 4 Rogues and Artificers and level 3 Dark Hunters)"

[[system.ingredient]]
name = "Mechanical Trap Parts"
tier = "any"
source = "From disabled trap Control Panels whose traps are mechanical (spikes, blades); needs the Trapmaking feat"

[[system.ingredient]]
name = "<Elemental> Trap Parts"
tier = "any"
source = "From disabled trap Control Panels of the matching element: Acid, Cold, Electrical, Fire, Force or Sonic; needs the Trapmaking feat. Unholy and Holy parts drop but have no recipe"

[[system.ingredient]]
name = "Magical Trap Parts"
tier = "any"
source = "From disabled Control Panels of poison and spell traps; needs the Trapmaking feat"

[[system.ingredient]]
name = "Siberys Dragonshard Fragment"
tier = "any"
source = "Chests and collectables"

[[system.ingredient]]
name = "Magic Item Essence"
tier = "any"

[[system.ingredient]]
name = "Crude Vial"
tier = "any"
source = "Free Agent vendor only, e.g. Sorvile Smythe"

[[system.ingredient]]
name = "Simple Vial"
tier = "any"
source = "Free Agent vendor only, e.g. Sorvile Smythe"

[[system.ingredient]]
name = "Unadorned Vial"
tier = "any"
source = "Free Agent vendor only, e.g. Sorvile Smythe"

[[system.ingredient]]
name = "Level 1 trap scroll"
tier = "any"
source = "Scroll of Cause Fear, Daze, Grease, Hypnotism or Sleep; The Marketplace Bazaar sells level 1 scrolls except the rare Daze"

[[system.ingredient]]
name = "Level 2 trap scroll"
tier = "any"
source = "Scroll of Blindness, Daze Monster, Glitterdust, Hypnotic Pattern, Otto's Resistible Dance, Scare, Touch of Idiocy or Web; The Marketplace Bazaar sells level 2 scrolls"

[[system.ingredient]]
name = "Level 3 trap scroll"
tier = "any"
source = "Scroll of Deep Slumber, Dispel Magic, Halt Undead, Hold Person or Slow; Object Desire in the House Phiarlan Enclave sells level 3 scrolls"

[[system.recipe]]
tier = "any"
option = "Noisemakers"
augments = []
note = "Mine. Yields 15 Noisemakers, which make a small noise after several seconds to lure creatures. Level 2 to use. A consumable, no augment counterpart."
cost = [{ ingredient = "Mechanical Trap Parts", quantity = 25 }]

[[system.recipe]]
tier = "any"
option = "Weak <Elemental> Trap"
augments = []
note = "Mine. Yields 15 Weak <Elemental> Traps: 10d6 damage. Level 3 to use. A consumable, no augment counterpart."
cost = [{ ingredient = "<Elemental> Trap Parts", quantity = 10 }, { ingredient = "Mechanical Trap Parts", quantity = 10 }]

[[system.recipe]]
tier = "any"
option = "Small <Elemental> Trap"
augments = []
