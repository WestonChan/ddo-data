cost = [{ ingredient = "<Elemental> Trap Parts", quantity = 100 }, { ingredient = "Mechanical Trap Parts", quantity = 25 }, { ingredient = "Siberys Dragonshard Fragment", quantity = 250 }, { ingredient = "Magic Item Essence", quantity = 5 }]

