[[system]]
name = "Schism Shard Crafting"
page = "https://ddowiki.com/page/Schism_Shard_Crafting"
read = "2026-09-29"
pack = "Dragonblood Prophecy"
npc = "Varron Tertius <Schism Shard Collector> in The Gatekeepers' Grove; Killing Time must be completed to speak with him and view the recipes"

[[system.ingredient]]
name = "Schism Shard"
tier = "legendary"
bind = "Bound to Account on Acquire"
source = "Killing Time end chest (rare drop), or 500 Time Runes"

[[system.ingredient]]
name = "Legendary Echo of Wave"
tier = "legendary"
source = "White Plume Mountain; must never have had a sentient jewel slotted (remove or destroy it first, then drag the weapon into the ingredient area)"

