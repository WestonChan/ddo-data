[[system.recipe]]
tier = "legendary"
option = "Reflection of Wave"
augments = []
note = "Upgrades Legendary Echo of Wave into Reflection of Wave (Quarterstaff), Bound to Character on Acquire. Mythic and Reaper bonuses on the base weapon are lost; since Update 41 Threads of Fate can add Mythic +2 or +4 to the result. Each White Plume Mountain weapon offers a direct upgrade or a secondary weapon type. A separate item in Maetrim's data; no augment counterpart."
cost = [{ ingredient = "Legendary Echo of Wave", quantity = 1 }, { ingredient = "Schism Shard", quantity = 5 }, { ingredient = "Sentient Jewel of Wave", quantity = 1 }]

