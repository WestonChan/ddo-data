# How DDOBuilderV2's <Effect> vocabulary maps onto DDO Tools stats, for deriving `bonuses` rows.
#
# Only an effect that is a plain number on a stat derives a bonus: AType Simple, one Type, one
# integral Amount. Everything else lives only in `modifiers`, faithfully, so an effect type with no
# entry here is NOT an error — the build report merely counts it.
#
#   [fixed]            Type -> stat, whatever <Item> says
#   [by_item]          Type -> template over each <Item>; a template naming no stat is skipped
#   [by_item_default]  Type -> stat used when <Item> is absent or "All"
#   [item_aliases]     <Item> spellings that differ from the word our stat names use
#   [bonus_type_aliases]  <Bonus> spellings; an empty value means NULL
#   [engine_only]      Type -> why it derives no bonus: conditional on a weapon class, damage type or
#                      spell, or a mechanic flag without a magnitude. The stats engine reads these
#                      from `modifiers`. A type may not be both here and in a mapping section, and a
#                      type listed here is not counted as unmapped.

