# How DDOBuilderV2's <Buff> vocabulary maps onto the DDO Tools schema.
#
# A buff resolves in this order:
#   1. its Type is in `enhancement`        -> items.enhancement_bonus = Value1
#   2. its Type is a key in `fixed`         -> a bonuses row on that stat
#   3. its Type is a key in `by_item`       -> a bonuses row on the stat named by the template,
#                                              with {item} replaced by the buff's <Item>; a template
#                                              that names no stat is an error
#   4. otherwise                            -> an effects row named by the Type
#
# Stat names must match ddo-model's `stats` seed exactly.

enhancement = ["WeaponEnchantment", "ArmorEnchantment", "ShieldEnchantment"]

[by_item]
AbilityBonus = "{item}"
SkillBonus = "{item}"
SchoolFocusNumber = "{item} Spell Focus"
Absorption = "{item} Absorption"
EnergyResistance = "{item} Resistance"

# <Item> sub-target spellings that differ from the word our stat names use.
[item_aliases]
Lawful = "Law"
Chaotic = "Chaos"

[fixed]
# Spell power
SpellcastingImplement = "Universal Spell Power"
Potency = "Universal Spell Power"
UniversalSpellPower = "Universal Spell Power"
Combustion = "Fire Spell Power"
Magnetism = "Electric Spell Power"
Glaciation = "Cold Spell Power"
