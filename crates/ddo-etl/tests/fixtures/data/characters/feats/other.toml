Allows you to intimidate certain NPCs and to draw the attention of monsters while in battle.
You will suffer a -4 penalty to your intimidate skill for every size category
you are smaller than the creature your are trying to intimidate, or +4 for every
size category your are larger. (15 second cooldown)"""
