other = "d20"
skill = "Intimidate"

[[row.dc]]
name = "Diplomacy"
dc_type = "Diplomacy"
dc_versus = "CR+Quest Level"
description = """
Allows you to negotiate more effectively with certain NPCs and to encourage
monsters to find targets other than yourself. Any accumulated threat you
have with enemies that you successfully diplomacize is reduced.
(15 second cooldown, Shares cooldown with Bluff)"""
