description = """
Allows you to bluff certain NPCs, draw monsters away from their group,
or make an individual monster vulnerable to sneak attack for six seconds.
You also gain a decrease in threat generation for a short period of time after
successfully using this ability. (15 second cooldown, Shares cooldown with Diplomacy)"""
icon = "Bluff"
other = "d20"
skill = "Bluff"

