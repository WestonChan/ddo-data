[[row]]
name = "Static Shock"
description = """
An Electrical discharge strikes one target for 1d6 Electricity damage plus 1d6 Electricity
damage per two caster levels up to a maximum damage of 6d6 at caster level 10.
A successful Reflex save reduces this damage by half.
On a failed save, the target must make a successful Will save or be dazed for
a short period of time or until they take damage."""
icon = "StaticShock"
max_caster_level = 10
metamagics = [
    "Embolden",
    "Empower",
    "Enlarge",
    "Heighten",
    "Intensify",
    "Maximize",
    "Quicken",
]
schools = ["Evocation"]

