[[row]]
name = "Dominate Person"
description = """
You can control the actions of any humanoid creature that fails its Will save through
a telepathic link that you establish with the subjects mind. Dominate acts
like Charm Person, with additional Will saves every 15 to 30 seconds, but the
creature will follow you throughout the dungeon."""
icon = "DominatePerson"
metamagics = [
    "Embolden",
    "Enlarge",
    "Heighten",
    "Quicken",
]
schools = ["Enchantment"]

[[row.dc]]
casting_stat_mod = true
dc_type = "Negates"
dc_versus = "Will"
schools = ["Enchantment"]

