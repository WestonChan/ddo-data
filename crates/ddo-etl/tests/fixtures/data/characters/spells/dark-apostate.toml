[[row]]
name = "Aid"
description = """
This spell grants the target (An ally creature.) 8 plus 1 per caster level (Maximum
caster level 10.) temporary Hit points, and a +1 Morale bonus to attack rolls
and saves versus fear. Aid will not stack with Bless."""
icon = "Aid"
max_caster_level = 10
metamagics = [
    "Enlarge",
    "Extend",
    "Quicken",
]
schools = ["Enchantment"]

[[row]]
name = "Bless"
description = """
You and any allies near you are filled with courage and gain +1 Morale bonuses to attack
rolls and saving throws against fear, with an additional +1 per 5 caster levels,
max 5 at caster level 20. Bless counters and dispels Bane."""
icon = "Bless"
max_caster_level = 20
metamagics = [
    "Extend",
    "Quicken",
]
schools = ["Enchantment"]

