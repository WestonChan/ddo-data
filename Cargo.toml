[workspace]
resolver = "2"
members = ["crates/ddo-model", "crates/ddo-etl", "crates/ddo-api"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/WestonChan/ddo-data"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
quick-xml = { version = "0.42", features = ["serialize"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
walkdir = "2"
