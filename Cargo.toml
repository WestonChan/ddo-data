[workspace]
resolver = "2"
members = ["crates/ddo-model", "crates/ddo-etl", "crates/ddo-api"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/WestonChan/ddo-data"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
