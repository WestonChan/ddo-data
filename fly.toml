# fly.toml app configuration file generated for ddo-data on 2026-09-28T00:01:15Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ddo-data'
primary_region = 'dfw'

[build]
  dockerfile = 'Dockerfile'

[env]
  DDO_DB_PATH = '/app/ddo.db'
  ICONS_DIR = '/app/icons'
  RUST_LOG = 'info,tower_http=warn'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/v1/version'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
