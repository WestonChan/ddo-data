name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo lint
      - run: cargo test --workspace
      - name: Find an entity directly in the data files
        run: cargo run -p ddo-etl -- find "Death House" --data data
      - name: Verify the full data round trip
        run: cargo run --release -p xtask -- round-trip --data data
      - name: Build the data files' database
        run: cargo run --release -p ddo-etl -- build --data data --out target/data-source.db
      - name: Validate the database and the served data
        run: |
          cargo xtask check-db target/data-source.db
          cargo xtask validate-api --db target/data-source.db --all-details
          cargo xtask wiki-tooltips --db target/data-source.db
      - name: Check the fixture database's integrity
        run: |
          mkdir -p target/no-corrections
          rm -f target/fixture.db
          cargo run -q -p ddo-etl -- build --data crates/ddo-etl/tests/fixtures/data --out target/fixture.db
          cargo xtask check-db target/fixture.db --source crates/ddo-etl/tests/fixtures/DataFiles --corrections target/no-corrections \
            --allow-empty-table effect_damage --allow-empty-table race_feat_slots \
            --allow-empty-table removed_entities
